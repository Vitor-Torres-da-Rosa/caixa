            ok: 'Excluir registro', tom: 'perigo'
          }, function () {
            marcarExcluido('servicos', existente.id);
            estado.servicos = estado.servicos.filter(function (s) { return s.id !== existente.id; });
            estado.pagamentos.forEach(function (p) { if (p.servicoId === existente.id) p.servicoId = ''; });
            estado.parcelas.forEach(function (p) {
              if (p.servicoId === existente.id && !parcelaPaga(p)) marcarExcluido('parcelas', p.id);
            });
            estado.parcelas = estado.parcelas.filter(function (p) {
              return p.servicoId !== existente.id || parcelaPaga(p);
            });
            salvar();
            voltarNavegacao();
            avisar('Registro excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: previsão de pagamento (parcelas) ----------
  //
  // Divide o valor, aplica o acréscimo escolhido e mostra o resumo do que
  // vai ser cobrado. Só grava quando você confirma.

  // totalAlvo > 0 manda: o total é o que você escreveu, e as parcelas saem
  // da divisão dele. Sem ele, o total vem do valor mais o acréscimo.
  function calcularParcelas(base, vezes, modo, acrescimo, primeira, totalAlvo) {
    vezes = Math.max(1, Math.min(inteiro(vezes) || 1, 60));
    var itens = [];

    if (totalAlvo > 0) {
      var fatiaT = Math.floor(totalAlvo / vezes);
      var sobraT = totalAlvo - fatiaT * vezes;
      for (var j = 0; j < vezes; j++) {
        itens.push({
          numero: j + 1, total: vezes,
          valor: fatiaT + (j === 0 ? sobraT : 0),
          vencimento: somaMeses(primeira, j)
        });
      }
      return { itens: itens, total: totalAlvo, acrescimoTotal: totalAlvo - base, manual: true };
    }

    var fatia = Math.floor(base / vezes);
    var sobra = base - fatia * vezes;
    for (var i = 0; i < vezes; i++) {
      var semAcrescimo = fatia + (i === 0 ? sobra : 0);
      var valor = semAcrescimo;
      if (modo === 'porcento' && acrescimo > 0) valor = Math.round(semAcrescimo * (1 + acrescimo / 100));
      if (modo === 'reais' && acrescimo > 0) valor = semAcrescimo + acrescimo;
      itens.push({
        numero: i + 1,
        total: vezes,
        valor: valor,
        semAcrescimo: semAcrescimo,
        vencimento: somaMeses(primeira, i)
      });
    }
    var total = itens.reduce(function (soma, p) { return soma + p.valor; }, 0);
    return { itens: itens, total: total, acrescimoTotal: total - base, manual: false };
  }

  function abrirFolhaParcelamento(clienteId, servicoId) {
    var cliente = achar(estado.clientes, clienteId);
    if (!cliente) return;
    var servicos = servicosDoCliente(clienteId);
    var servicoInicial = servicoId ? achar(estado.servicos, servicoId) : null;
    var r = resumoCliente(clienteId);
    var jaParcelado = parcelasDoCliente(clienteId)
      .filter(function (p) { return !parcelaPaga(p); })
      .reduce(function (soma, p) { return soma + p.valor; }, 0);
    var sugestao = servicoInicial ? servicoInicial.valor : Math.max(r.restante - jaParcelado, 0);

    var vezes = 1;
    var modo = 'nenhum';

    empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });

    abrirFolha('Previsão de pagamento', function (folha) {
      var forma = no('div');

      var campoValorEl = entradaValor(sugestao, true);
      campoValorEl.style.color = 'var(--ouro)';
      forma.appendChild(campo('Valor a combinar', campoValorEl));

      var opcoesServico = [{ valor: '', rotulo: 'Sem registro específico' }].concat(
        servicos.map(function (sv) { return { valor: sv.id, rotulo: sv.nome, detalhe: (sv.tipo || 'Serviço') + ' · ' + emReais(sv.valor) }; }));
      var campoServico = entradaSelecao(opcoesServico, servicoId || '', 'Referente a');
      forma.appendChild(campo('Referente a', campoServico));

      var campoData = entradaData(hojeTexto());
      forma.appendChild(campo('Primeira parcela vence em', campoData));

      var opcoesVezes = [];
      for (var v = 1; v <= 24; v++) {
        opcoesVezes.push({ valor: String(v), rotulo: v === 1 ? 'À vista (1x)' : v + 'x' });
      }
      var campoVezes = entradaSelecao(opcoesVezes, '1', 'Em quantas vezes');
      forma.appendChild(campo('Em quantas vezes', campoVezes));

      var campoModo = entradaSelecao([
        { valor: 'nenhum', rotulo: 'Sem acréscimo' },
        { valor: 'porcento', rotulo: 'Acrescentar % por parcela' },
        { valor: 'reais', rotulo: 'Acrescentar R$ por parcela' }
      ], 'nenhum', 'Acréscimo');
      forma.appendChild(campo('Acréscimo', campoModo));

      var campoPorcento = entradaTextoNumero('0', '0');
      var caixaPorcento = campo('Quanto por cento por parcela', campoPorcento);
      caixaPorcento.style.display = 'none';
      forma.appendChild(caixaPorcento);

      var campoReais = entradaValor(0, false);
      var caixaReais = campo('Quantos reais por parcela', campoReais);
      caixaReais.style.display = 'none';
      forma.appendChild(caixaReais);

      // Se você escrever o total, ele manda: as parcelas saem da divisão dele.
      var totalManual = 0;
      var campoTotal = entradaValor(sugestao, false);
      campoTotal.style.color = 'var(--ouro)';
      forma.appendChild(campo('Total a cobrar', campoTotal));
      var notaTotal = no('div', 'linha-nota',
        'Mexeu aqui, o app divide esse total pelas parcelas. Mexeu no valor ou no acréscimo, ele volta a calcular sozinho.');
      notaTotal.style.margin = '-8px 0 16px';
      forma.appendChild(notaTotal);

      var campoMinimo = entradaValor(0, false);
      forma.appendChild(campo('Pagamento mínimo por parcela (opcional)', campoMinimo));

      var campoJuros = entradaTextoNumero('', '0');
      forma.appendChild(campo('Juros por atraso, ao mês (opcional %)', campoJuros));

      var resumo = cartao();
      forma.appendChild(resumo);

      function lerAcrescimo() {
        if (modo === 'porcento') {
          var p = Number(String(campoPorcento.value).replace(',', '.'));
          return isFinite(p) && p > 0 ? Math.min(p, 300) : 0;
        }
        if (modo === 'reais') return digitosParaCentavos(campoReais.value);
        return 0;
      }

      function contas() {
        return calcularParcelas(
          digitosParaCentavos(campoValorEl.value),
          vezes, modo, lerAcrescimo(),
          ehData(campoData.value) ? campoData.value : hojeTexto(),
          totalManual
        );
      }

      function pintarResumo() {
        resumo.textContent = '';
        var base = digitosParaCentavos(campoValorEl.value);
        if (base <= 0) {
          resumo.appendChild(no('div', 'linha-sub', 'Informe o valor para ver o resumo do parcelamento.'));
          return;
        }
        var c = contas();
        if (!totalManual) campoTotal.value = emReais(c.total);

        resumo.appendChild(no('div', 'rotulo', 'Vai ser cobrado'));
        resumo.appendChild(no('div', 'valorao pequeno num', emReais(c.total)));
        var detalhe = vezes + 'x de ' + emReais(c.itens[0].valor);
        if (vezes > 1 && c.itens[0].valor !== c.itens[vezes - 1].valor) {
          detalhe = vezes + 'x — a primeira de ' + emReais(c.itens[0].valor) +
            ' e as outras de ' + emReais(c.itens[vezes - 1].valor);
        }
        resumo.appendChild(no('div', 'linha-nota', detalhe));
        if (c.acrescimoTotal > 0) {
          resumo.appendChild(no('div', 'linha-nota ouro',
            'Acréscimo de ' + emReais(c.acrescimoTotal) + ' sobre os ' + emReais(base) + ' combinados.'));
        } else if (c.acrescimoTotal < 0) {
          resumo.appendChild(no('div', 'linha-nota verde',
            'Desconto de ' + emReais(-c.acrescimoTotal) + ' sobre os ' + emReais(base) + ' combinados.'));
        }

        var minimo = digitosParaCentavos(campoMinimo.value);
        if (minimo > 0) {
          resumo.appendChild(no('div', 'linha-nota',
            'Mínimo aceito por parcela: ' + emReais(minimo) + '.'));
        }
        var juros = comoNumero(campoJuros.value, 0);
        if (juros > 0) {
          resumo.appendChild(no('div', 'linha-nota',
            'Atrasando, entram ' + numeroBr(juros) + '% ao mês sobre a parcela, contados por dia.'));
        }

        var lista = no('div');
        lista.style.marginTop = '12px';
        c.itens.forEach(function (p) {
          var linha = no('div', 'parcela-linha');
          juntar(linha,
            no('span', 'q', p.numero + '/' + p.total + ' · ' + dataBr(p.vencimento)),
            no('span', 'v num', emReais(p.valor)));
          lista.appendChild(linha);
        });
        resumo.appendChild(lista);
      }

      // Mexer no valor, nas vezes ou no acréscimo devolve o total ao cálculo.
      function recalcular() { totalManual = 0; pintarResumo(); }
      campoValorEl.addEventListener('input', recalcular);
      campoData.addEventListener('change', pintarResumo);
      campoPorcento.addEventListener('input', recalcular);
      campoReais.addEventListener('input', recalcular);
      campoMinimo.addEventListener('input', pintarResumo);
      campoJuros.addEventListener('input', pintarResumo);
      campoTotal.addEventListener('input', function () {
        totalManual = digitosParaCentavos(campoTotal.value);
        pintarResumo();
      });
      campoVezes.aoMudar = function (v) { vezes = parseInt(v, 10) || 1; recalcular(); };
      campoModo.aoMudar = function (v) {
        modo = v;
        caixaPorcento.style.display = v === 'porcento' ? '' : 'none';
        caixaReais.style.display = v === 'reais' ? '' : 'none';
        recalcular();
      };
      pintarResumo();

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Confirmar parcelamento', function () {
        var base = digitosParaCentavos(campoValorEl.value);
        if (base <= 0) { mostrarErro(forma, 'Informe o valor a combinar.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha a data da primeira parcela.'); return; }
        var c = contas();

        perguntar({
          titulo: 'Confirmar ' + vezes + 'x de ' + emReais(c.itens[0].valor) + '?',
          texto: 'Total de ' + emReais(c.total) +
            (c.acrescimoTotal > 0 ? ', com ' + emReais(c.acrescimoTotal) + ' de acréscimo' : '') +
            '. Primeira em ' + dataBr(c.itens[0].vencimento) +
            ', última em ' + dataBr(c.itens[c.itens.length - 1].vencimento) + '.',
          ok: 'Confirmar', icone: 'alvo'
        }, function () {
          var minimoSalvo = digitosParaCentavos(campoMinimo.value);
          var jurosSalvo = Math.min(Math.max(comoNumero(campoJuros.value, 0), 0), 100);
          c.itens.forEach(function (p) {
            estado.parcelas.push({
              id: novoId(),
              clienteId: clienteId,
              servicoId: campoServico.value,
              numero: p.numero,
              total: p.total,
              valor: p.valor,
              vencimento: p.vencimento,
              minimo: Math.min(minimoSalvo, p.valor),
              jurosAtraso: jurosSalvo,
              quitadaEm: '',
              pagamentoId: '',
              criadoEm: Date.now()
            });
          });
          // O acréscimo é dinheiro a mais a receber: entra como registro próprio.
          if (c.acrescimoTotal > 0) {
            estado.servicos.push({
              id: novoId(), clienteId: clienteId,
              nome: 'Acréscimo do parcelamento em ' + vezes + 'x',
              tipo: 'Outros', valor: c.acrescimoTotal,
              data: c.itens[0].vencimento, obs: '', criadoEm: Date.now()
            });
          }
          salvar();
          abaFicha = 'parcelas';
          voltarNavegacao();
          avisar('Parcelamento combinado.');
        });
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // O que fazer com uma parcela que ainda está em aberto.
  function abrirFolhaParcela(clienteId, parcelaId) {
    var parcela = achar(estado.parcelas, parcelaId);
    if (!parcela) return;
    var servico = parcela.servicoId ? achar(estado.servicos, parcela.servicoId) : null;
    var servicos = servicosDoCliente(clienteId);
    empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });

    abrirFolha('Parcela ' + parcela.numero + ' de ' + parcela.total, function (folha) {
      var forma = no('div');

      var campoValorEl = entradaValor(parcela.valor, true);
      campoValorEl.style.color = 'var(--ouro)';
      forma.appendChild(campo('Valor da parcela', campoValorEl));

      var campoData = entradaData(parcela.vencimento);
      forma.appendChild(campo('Vence em', campoData));

      var campoMinimo = entradaValor(parcela.minimo || 0, false);
      forma.appendChild(campo('Pagamento mínimo (opcional)', campoMinimo));

      var campoJuros = entradaTextoNumero(parcela.jurosAtraso || '', '0');
      forma.appendChild(campo('Juros por atraso, ao mês (opcional %)', campoJuros));

      var opcoesServico = [{ valor: '', rotulo: 'Sem registro específico' }].concat(
        servicos.map(function (sv) {
          return { valor: sv.id, rotulo: sv.nome, detalhe: (sv.tipo || 'Serviço') + ' · ' + emReais(sv.valor) };
        }));
      var campoServico = entradaSelecao(opcoesServico, parcela.servicoId || '', 'Referente a');
      forma.appendChild(campo('Referente a', campoServico));

      var jaPago = pagoNaParcela(parcela);
      var juros = jurosDaParcela(parcela);
      if (parcela.vencimento < hojeTexto()) {
        forma.appendChild(no('div', 'linha-nota vermelho',
          'Esta parcela venceu em ' + dataBr(parcela.vencimento) + '.' +
          (juros > 0 ? ' Os juros já somam ' + emReais(juros) + '.' : '')));
      }
      if (jaPago > 0) {
        forma.appendChild(no('div', 'linha-nota verde',
          'Já entraram ' + emReais(jaPago) + '. Faltam ' + emReais(faltaNaParcela(parcela)) + '.'));
      }
      if (servico) {
        forma.appendChild(no('div', 'linha-nota',
          'Faz parte de ' + parcela.total + ' parcelas de ' + servico.nome + '.'));
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Registrar pagamento', function () {
        voltarNavegacao();
        setTimeout(function () { abrirFolhaPagamento(clienteId, null, parcelaId); }, 250);
      }));
      acoes.appendChild(botao('btn btn-fantasma', 'Salvar alterações', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        if (valor <= 0) { mostrarErro(forma, 'Informe o valor da parcela.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }
        parcela.valor = valor;
        parcela.vencimento = campoData.value;
        parcela.servicoId = campoServico.value;
        parcela.minimo = Math.min(digitosParaCentavos(campoMinimo.value), valor);
        parcela.jurosAtraso = Math.min(Math.max(comoNumero(campoJuros.value, 0), 0), 100);
        salvar();
        voltarNavegacao();
        avisar('Parcela atualizada.');
      }));
      acoes.appendChild(botao('btn btn-perigo', 'Excluir esta parcela', function () {
        perguntar({
          titulo: 'Excluir a parcela ' + parcela.numero + ' de ' + parcela.total + '?',
          texto: 'As outras parcelas continuam como estão.',
          ok: 'Excluir parcela', tom: 'perigo'
        }, function () {
          marcarExcluido('parcelas', parcela.id);
          estado.parcelas = estado.parcelas.filter(function (p) { return p.id !== parcela.id; });
          salvar();
          voltarNavegacao();
          avisar('Parcela excluída.');
        });
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  function abrirFolhaPagamento(clienteId, pagamentoId, parcelaId) {
    var existente = pagamentoId ? achar(estado.pagamentos, pagamentoId) : null;
    var parcela = parcelaId ? achar(estado.parcelas, parcelaId) : null;
    var r = resumoCliente(clienteId);
    var servicos = servicosDoCliente(clienteId);
    var lancarNoCaixa = !existente;
    empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });

    abrirFolha(existente ? 'Editar pagamento' : 'Registrar pagamento', function (folha) {
      var forma = no('div');

      var campoValorEl = entradaValor(existente ? existente.valor : 0, true);
      campoValorEl.style.color = 'var(--verde)';
      forma.appendChild(campo('Valor recebido', campoValorEl));

      // ---- a qual parcela este dinheiro se refere ----
      var abertas = parcelasDoCliente(clienteId).filter(function (p) {
        return !parcelaPaga(p) || (parcela && p.id === parcela.id);
      });
      var opcoesParcela = [{ valor: '', rotulo: 'Sem parcela específica' }].concat(
        abertas.map(function (p) {
          var servicoP = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
          return {
            valor: p.id,
            rotulo: 'Parcela ' + p.numero + ' de ' + p.total,
            detalhe: 'vence em ' + dataBr(p.vencimento) + ' · ' + emReais(faltaNaParcela(p)) +
              (servicoP ? ' · ' + servicoP.nome : '')
          };
        }));

      var campoParcela = null;
      if (!existente && abertas.length) {
        campoParcela = entradaSelecao(opcoesParcela, parcela ? parcela.id : '', 'Equivale a qual parcela');
        forma.appendChild(campo('Equivale a qual parcela', campoParcela));
      }

      var caixaAtalhos = no('div');
      forma.appendChild(caixaAtalhos);

      var campoData = entradaData(existente ? existente.data : hojeTexto());
      forma.appendChild(campo('Data do pagamento', campoData));

      var opcoesServico = [{ valor: '', rotulo: 'Sem registro específico' }].concat(
        servicos.map(function (s) {
          return { valor: s.id, rotulo: s.nome, detalhe: (s.tipo || 'Serviço') + ' · ' + emReais(s.valor) };
        }));
      var campoServico = entradaSelecao(opcoesServico,
        existente ? existente.servicoId : (parcela ? parcela.servicoId : ''), 'Referente a');
      forma.appendChild(campo('Referente a', campoServico));

      // ---- juros, multa e taxa lançados na hora ----
      var campoJuros = null, campoMulta = null, campoTaxa = null, resumoParcela = null;
      if (!existente) {
        forma.appendChild(no('div', 'rotulo-secao', 'Acréscimos deste pagamento'));

        campoJuros = entradaValor(0, false);
        forma.appendChild(campo('Juros de atraso', campoJuros));
        campoMulta = entradaValor(0, false);
        forma.appendChild(campo('Multa', campoMulta));
        campoTaxa = entradaValor(0, false);
        forma.appendChild(campo('Taxa', campoTaxa));

        resumoParcela = cartao();
        forma.appendChild(resumoParcela);
      }

      function parcelaAtual() {
        if (existente) return null;
        var id = campoParcela ? campoParcela.value : (parcela ? parcela.id : '');
        return id ? achar(estado.parcelas, id) : null;
      }

      function acrescimos() {
        if (existente) return 0;
        return digitosParaCentavos(campoJuros.value) +
               digitosParaCentavos(campoMulta.value) +
               digitosParaCentavos(campoTaxa.value);
      }

      // Quanto esta parcela deve hoje, já com o que foi lançado agora.
      function devidoAgora(p) {
        return p ? faltaNaParcela(p) + acrescimos() : 0;
      }

      function pintarAtalhos() {
        caixaAtalhos.textContent = '';
        var p = parcelaAtual();
        if (!p) {
          if (!existente && r.restante > 0) {
            var chips = no('div', 'chips');
            chips.appendChild(botao('chip', 'Tudo: ' + emReais(r.restante), function () {
              campoValorEl.value = emReais(r.restante); pintarResumo();
            }));
            chips.appendChild(botao('chip', 'Metade', function () {
              campoValorEl.value = emReais(Math.round(r.restante / 2)); pintarResumo();
            }));
            caixaAtalhos.appendChild(campo('Falta ' + emReais(r.restante), chips));
          }
          return;
        }
        var devido = devidoAgora(p);
        var minimo = Math.min(minimoDaParcela(p) || 0, devido);
        var chipsP = no('div', 'chips');
        chipsP.appendChild(botao('chip', 'Tudo: ' + emReais(devido), function () {
          campoValorEl.value = emReais(devido); pintarResumo();
        }));
        if (minimo > 0 && minimo < devido) {
          chipsP.appendChild(botao('chip', 'Mínimo: ' + emReais(minimo), function () {
            campoValorEl.value = emReais(minimo); pintarResumo();
          }));
        }
        chipsP.appendChild(botao('chip', 'Metade', function () {
          campoValorEl.value = emReais(Math.round(devido / 2)); pintarResumo();
        }));
        caixaAtalhos.appendChild(campo('Devido nesta parcela: ' + emReais(devido), chipsP));
      }

      function pintarResumo() {
        if (!resumoParcela) return;
        resumoParcela.textContent = '';
        var p = parcelaAtual();
        var recebido = digitosParaCentavos(campoValorEl.value);
        var extra = acrescimos();

        if (!p) {
          resumoParcela.appendChild(no('div', 'linha-sub',
            extra > 0
              ? 'Sem parcela escolhida, os ' + emReais(extra) + ' de acréscimo entram como valor a receber deste cliente.'
              : 'Escolha a parcela para o app fechar a conta dela e remanejar o que faltar.'));
          return;
        }

        var devido = devidoAgora(p);
        var falta = Math.max(devido - recebido, 0);
        var sobra = Math.max(recebido - devido, 0);

        resumoParcela.appendChild(no('div', 'rotulo', 'Parcela ' + p.numero + ' de ' + p.total));
        [
          ['Valor da parcela', emReais(faltaNaParcela(p))],
          ['Acréscimos agora', emReais(extra)],
          ['Devido', emReais(devido)],
          ['Recebendo', emReais(recebido)]
        ].forEach(function (par) {
          var l = no('div', 'parcela-linha');
          juntar(l, no('span', 'q', par[0]), no('span', 'v num', par[1]));
          resumoParcela.appendChild(l);
        });

        if (falta > 0) {
          var teto = tetoDoPlano(planoDaParcela(p)) || falta;
          var quantas = Math.ceil(falta / teto);
          resumoParcela.appendChild(no('div', 'linha-nota ouro',
            'A parcela fecha assim mesmo. Os ' + emReais(falta) + ' que faltaram viram ' +
            quantas + ' parcela(s) no fim do combinado, de no máximo ' + emReais(teto) + ' cada.'));
        } else if (sobra > 0) {
          resumoParcela.appendChild(no('div', 'linha-nota verde',
            'A parcela fecha e os ' + emReais(sobra) + ' que sobraram abatem as próximas.'));
        } else {
          resumoParcela.appendChild(no('div', 'linha-nota verde', 'Fecha a parcela na conta certa.'));
        }
      }

      function atualizar() { pintarAtalhos(); pintarResumo(); }

      campoValorEl.addEventListener('input', pintarResumo);
      if (campoParcela) {
        campoParcela.aoMudar = function () {
          var p = parcelaAtual();
          if (p) {
            // Sugere os juros de atraso já calculados e o valor cheio.
            if (campoJuros) campoJuros.value = emReais(jurosDaParcela(p));
            campoValorEl.value = emReais(devidoAgora(p));
            if (p.servicoId) campoServico.value = p.servicoId;
          }
          atualizar();
        };
      }
      if (campoJuros) {
        [campoJuros, campoMulta, campoTaxa].forEach(function (c) {
          c.addEventListener('input', atualizar);
        });
        var inicial = parcelaAtual();
        if (inicial) {
          campoJuros.value = emReais(jurosDaParcela(inicial));
          campoValorEl.value = emReais(devidoAgora(inicial));
        }
      }
      atualizar();

      var proximaDepois = proximoVencimento(clienteId);
      if (proximaDepois) {
        var notaProxima = no('div', 'linha-nota',
          'Próximo pagamento previsto para ' + dataBr(proximaDepois) + '.');
        notaProxima.style.margin = '-6px 0 14px';
        forma.appendChild(notaProxima);
      }

      var campoConta = null;
      if (!existente && estado.contas.length) {
        var marcar = botao('lembrar', null, function () {
          lancarNoCaixa = !lancarNoCaixa;
          marcar.setAttribute('aria-pressed', lancarNoCaixa ? 'true' : 'false');
          marcar.querySelector('.caixinha').textContent = lancarNoCaixa ? '✓' : '';
          campoConta.parentNode.style.display = lancarNoCaixa ? '' : 'none';
        });
        marcar.setAttribute('aria-pressed', 'true');
        marcar.style.marginBottom = '14px';
        marcar.appendChild(no('span', 'caixinha', '✓'));
        marcar.appendChild(no('span', null, 'Lançar como entrada no caixa'));
        forma.appendChild(marcar);

        campoConta = entradaSelecao(opcoesDeConta(), estado.contas[0].id);
        forma.appendChild(campo('Entrou em qual conta', campoConta));
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        if (valor <= 0) { mostrarErro(forma, 'Informe o valor recebido.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }

        var cliente = achar(estado.clientes, clienteId);

        if (existente) {
          existente.valor = valor;
          existente.data = campoData.value;
          existente.servicoId = campoServico.value;
        } else {
          var alvo = parcelaAtual();
          var extra = acrescimos();
          var lancamentoId = '';

          if (lancarNoCaixa && campoConta) {
            lancamentoId = novoId();
            var servico = campoServico.value ? achar(estado.servicos, campoServico.value) : null;
            estado.lancamentos.push({
              id: lancamentoId,
              tipo: 'entrada',
              valor: valor,
              descricao: (cliente ? cliente.nome : 'Cliente') + (servico ? ' — ' + servico.nome : ''),
              categoria: 'Serviços',
              data: campoData.value,
              contaId: campoConta.value,
              contaDestinoId: '',
              criadoEm: Date.now()
            });
          }

          // Juros, multa e taxa são dinheiro a mais a receber: entram como
          // registro próprio, senão a conta do cliente não fecha.
          if (extra > 0) {
            var partes = [];
            if (digitosParaCentavos(campoJuros.value) > 0) partes.push('juros');
            if (digitosParaCentavos(campoMulta.value) > 0) partes.push('multa');
            if (digitosParaCentavos(campoTaxa.value) > 0) partes.push('taxa');
            estado.servicos.push({
              id: novoId(), clienteId: clienteId,
              nome: partes.join(', ').replace(/^./, function (c) { return c.toUpperCase(); }) +
                (alvo ? ' — parcela ' + alvo.numero + ' de ' + alvo.total : ''),
              tipo: 'Outros', valor: extra,
              data: campoData.value, obs: '', criadoEm: Date.now()
            });
          }

          var devido = alvo ? devidoAgora(alvo) : 0;
          estado.pagamentos.push({
            id: novoId(), clienteId: clienteId, servicoId: campoServico.value,
            valor: valor, data: campoData.value,
            parcelaId: alvo ? alvo.id : '',
            lancamentoId: lancamentoId, criadoEm: Date.now()
          });

          if (alvo) {
            // A parcela fecha com o que foi recebido, seja quanto for. O que
            // faltou volta para o fim do combinado; o que sobrou abate as
            // próximas.
            alvo.quitadaEm = campoData.value;
            var falta = Math.max(devido - valor, 0);
            var sobra = Math.max(valor - devido, 0);
            if (falta > 0) empurrarFalta(alvo, falta);
            else if (sobra > 0) abaterSobra(alvo, sobra);
          }
        }

        salvar();
        voltarNavegacao();
        avisar(existente ? 'Pagamento atualizado.' : 'Pagamento registrado.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir pagamento', function () {
          perguntar({
            titulo: 'Excluir este pagamento?',
            texto: 'O lançamento de entrada criado junto com ele também sai, e a parcela volta a ficar em aberto. ' +
              'As parcelas que nasceram do que faltou continuam onde estão — apague na mão se não quiser.',
            ok: 'Excluir pagamento', tom: 'perigo'
          }, function () {
            if (existente.lancamentoId) {
              marcarExcluido('lancamentos', existente.lancamentoId);
              estado.lancamentos = estado.lancamentos.filter(function (l) { return l.id !== existente.lancamentoId; });
            }
            marcarExcluido('pagamentos', existente.id);
            estado.pagamentos = estado.pagamentos.filter(function (p) { return p.id !== existente.id; });
            estado.parcelas.forEach(function (p) {
              if (p.pagamentoId === existente.id) p.pagamentoId = '';
              if (p.id === existente.parcelaId) p.quitadaEm = '';
            });
            salvar();
            voltarNavegacao();
            avisar('Pagamento excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  function blocoKpi(rotulo, valor, anterior, classeCor) {
    var k = no('div', 'kpi');
    k.appendChild(no('div', 'rotulo', rotulo));
    k.appendChild(no('div', 'n num ' + classeCor, emReais(valor)));
    if (anterior) {
      var dif = valor - anterior;
      var p = (dif / Math.abs(anterior)) * 100;
      var v = no('div', 'variacao ' + (dif >= 0 ? 'sobe' : 'desce'),
        (dif >= 0 ? '↑ ' : '↓ ') + Math.abs(p).toFixed(1).replace('.', ',') + '%');
      k.appendChild(v);
    } else {
      k.appendChild(no('div', 'variacao', ' '));
    }
    return k;
  }

  function parDeValores(rotulo, valor, classeCor) {
    var d = no('div');
    d.appendChild(no('div', 'rotulo', rotulo));
    d.appendChild(no('div', 'linha-valor num ' + (classeCor || ''), valor));
    return d;
  }

  // ---------- Tela: Transações ----------

  function desenharTransacoes() {
    var tela = $('telaTransacoes');
    tela.textContent = '';
    tela.appendChild(cabecalho('Transações', null, periodo.tipo === 'mes' ? true : 'periodo'));

    var busca = no('div', 'busca');
    var lupa = no('span', 'lupa');
    lupa.appendChild(icone('lupa'));
    busca.appendChild(lupa);
    var campo = no('input');
    campo.type = 'search';
    campo.placeholder = 'Buscar por descrição ou categoria';
    campo.value = buscaTransacoes;
    campo.addEventListener('input', function () {
      buscaTransacoes = campo.value;
      desenharListaTransacoes();
    });
    busca.appendChild(campo);
    tela.appendChild(busca);

    tela.appendChild(segmentos([
      { valor: 'mes', rotulo: nomeDoPeriodo('mes') },
      { valor: 'tres', rotulo: 'Últimos 3 meses' },
      { valor: 'ano', rotulo: 'Último ano' },
      { valor: 'escolhido', rotulo: 'Escolher datas' }
    ], periodo.tipo, function (v) {
      trocarPeriodo(v, function () { desenharTransacoes(); });
    }));

    tela.appendChild(segmentos([
      { valor: 'todas', rotulo: 'Todas' },
      { valor: 'entrada', rotulo: 'Receitas' },
      { valor: 'saida', rotulo: 'Despesas' },
      { valor: 'transferencia', rotulo: 'Transferências' }
    ], filtroTransacoes, function (v) { filtroTransacoes = v; desenharTransacoes(); }));

    var container = no('div');
    container.id = 'listaTransacoes';
    tela.appendChild(container);
    desenharListaTransacoes();
  }

  function nomeDoPeriodo(qual) {
    if (qual === 'tres') return '3 meses';
    if (qual === 'ano') return '12 meses';
    if (qual === 'escolhido') return 'Escolhido';
    var mesmoAno = mesAtivo.ano === new Date().getFullYear();
    return MESES_CURTO[mesAtivo.mes] + (mesmoAno ? '' : '/' + String(mesAtivo.ano).slice(2));
  }

  // A janela de tempo que as telas estão olhando.
  function faixaDoPeriodo() {
    if (periodo.tipo === 'escolhido' && ehData(periodo.de) && ehData(periodo.ate)) {
      return {
        de: periodo.de, ate: periodo.ate,
        rotulo: 'de ' + dataBr(periodo.de) + ' a ' + dataBr(periodo.ate),
        curto: dataCurta(periodo.de) + ' a ' + dataCurta(periodo.ate)
      };
    }
    if (periodo.tipo === 'tres' || periodo.tipo === 'ano') {
      var meses = periodo.tipo === 'tres' ? 3 : 12;
      var hoje = new Date();
      var inicio = new Date(hoje.getFullYear(), hoje.getMonth() - (meses - 1), 1);
      return {
        de: deData(inicio), ate: hojeTexto(),
        rotulo: meses === 3 ? 'nos últimos 3 meses' : 'nos últimos 12 meses',
        curto: meses === 3 ? 'Últimos 3 meses' : 'Último ano'
      };
    }
    return {
      de: prefixoMes(mesAtivo.ano, mesAtivo.mes) + '-01',
      ate: ultimoDiaDoMes(mesAtivo.ano, mesAtivo.mes),
      rotulo: 'em ' + MESES[mesAtivo.mes],
      curto: MESES[mesAtivo.mes].charAt(0).toUpperCase() + MESES[mesAtivo.mes].slice(1) +
        (mesAtivo.ano === new Date().getFullYear() ? '' : ' ' + mesAtivo.ano)
    };
  }

  // A janela de mesmo tamanho logo antes, para comparar.
  function faixaAnterior() {
    if (periodo.tipo === 'mes') {
      var a = mesAnteriorAo(mesAtivo.ano, mesAtivo.mes);
      return { de: prefixoMes(a.ano, a.mes) + '-01', ate: ultimoDiaDoMes(a.ano, a.mes) };
    }
    var f = faixaDoPeriodo();
    var dias = Math.round((comoData(f.ate) - comoData(f.de)) / 86400000) + 1;
    return { de: somaDias(f.de, -dias), ate: somaDias(f.de, -1) };
  }

  function lancamentosNaFaixa(faixa) {
    var f = faixa || faixaDoPeriodo();
    return estado.lancamentos.filter(function (l) {
      return l.data >= f.de && l.data <= f.ate;
    });
  }

  function lancamentosDoPeriodo() { return lancamentosNaFaixa(); }

  function totaisNaFaixa(faixa) {
    var entradas = 0, saidas = 0;
    lancamentosNaFaixa(faixa).forEach(function (l) {
      if (l.tipo === 'entrada') entradas += l.valor;
      else if (l.tipo === 'saida') saidas += l.valor;
    });
    return { entradas: entradas, saidas: saidas, saldo: entradas - saidas };
  }

  function gastosNaFaixa(faixa) {
    var mapa = {};
    var total = 0;
    lancamentosNaFaixa(faixa).forEach(function (l) {
      if (l.tipo !== 'saida') return;
      mapa[l.categoria] = (mapa[l.categoria] || 0) + l.valor;
      total += l.valor;
    });
    var lista = Object.keys(mapa).map(function (nome) {
      return { nome: nome, valor: mapa[nome] };
    }).sort(function (a, b) { return b.valor - a.valor; });
    return { lista: lista, total: total };
  }

  // ---------- Escolher o período ----------

  function trocarPeriodo(tipo, aoTerminar, doSeletor) {
    if (tipo === 'escolhido') { abrirFolhaPeriodo(aoTerminar); return; }
    // Escolher "mês atual" na lista traz de volta o mês de hoje; as setas
    // do cabeçalho continuam levando para os outros meses.
    if (tipo === 'mes' && doSeletor) {
      var hoje = new Date();
      mesAtivo = { ano: hoje.getFullYear(), mes: hoje.getMonth() };
    }
    periodo.tipo = tipo;
    if (aoTerminar) aoTerminar();
  }

  function abrirFolhaPeriodo(aoTerminar) {
    var f = faixaDoPeriodo();
    abrirFolha('Período', function (folha) {
      var forma = no('div');
      forma.appendChild(no('p', 'linha-sub', 'Escolha as duas pontas do período que quer ver.'));

      var campoDe = entradaData(periodo.de || f.de);
      forma.appendChild(campo('Começa em', campoDe));
      var campoAte = entradaData(periodo.ate || f.ate);
      forma.appendChild(campo('Termina em', campoAte));

      var nota = no('div', 'linha-nota');
      forma.appendChild(nota);
      function medir() {
        if (!ehData(campoDe.value) || !ehData(campoAte.value)) { nota.textContent = ''; return; }
        if (campoDe.value > campoAte.value) { nota.textContent = 'A data de início vem antes da de fim.'; return; }
        var dias = Math.round((comoData(campoAte.value) - comoData(campoDe.value)) / 86400000) + 1;
        var quantos = estado.lancamentos.filter(function (l) {
          return l.data >= campoDe.value && l.data <= campoAte.value;
        }).length;
        nota.textContent = dias + ' dia(s), com ' + quantos + ' lançamento(s).';
      }
      campoDe.addEventListener('change', medir);
      campoAte.addEventListener('change', medir);
      medir();

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Ver este período', function () {
        if (!ehData(campoDe.value) || !ehData(campoAte.value)) {
          mostrarErro(forma, 'Escolha as duas datas.'); return;
        }
        if (campoDe.value > campoAte.value) {
          mostrarErro(forma, 'A data de início precisa vir antes da de fim.'); return;
        }
        periodo.tipo = 'escolhido';
        periodo.de = campoDe.value;
        periodo.ate = campoAte.value;
        fecharFolha();
        setTimeout(function () { if (aoTerminar) aoTerminar(); else desenhar(); }, 250);
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // A pílula que abre a lista de períodos.
  function seletorDePeriodo(aoTrocar) {
    var b = botao('pilula-periodo', null, function () {
      abrirEscolha({
        titulo: 'Período',
        valor: periodo.tipo,
        opcoes: [
          { valor: 'mes', rotulo: 'Mês atual',
            detalhe: MESES[new Date().getMonth()] + ' de ' + new Date().getFullYear() },
          { valor: 'tres', rotulo: 'Últimos 3 meses' },
          { valor: 'ano', rotulo: 'Último ano' },
          { valor: 'escolhido', rotulo: 'Escolher as datas',
            detalhe: periodo.tipo === 'escolhido' ? faixaDoPeriodo().curto : 'início e fim' }
        ]
      }, function (escolhido) {
        if (escolhido == null) return;
        trocarPeriodo(escolhido, aoTrocar, true);
      });
    });
    b.appendChild(icone('calendario'));
    b.appendChild(no('span', null, faixaDoPeriodo().curto));
    b.appendChild(no('span', 'seta', '▾'));
    return b;
  }

  function desenharListaTransacoes() {
    var alvo = $('listaTransacoes');
    if (!alvo) return;
    alvo.textContent = '';

    var termo = buscaTransacoes.trim().toLowerCase();
    var faixa = faixaDoPeriodo();
    var itens = lancamentosDoPeriodo().filter(function (l) {
      if (filtroTransacoes !== 'todas' && l.tipo !== filtroTransacoes) return false;
      if (!termo) return true;
      return (l.descricao + ' ' + l.categoria).toLowerCase().indexOf(termo) >= 0;
    });

    if (!itens.length) {
      var c = cartao('liso');
      c.appendChild(estadoVazio(
        termo ? 'Nada encontrado' : 'Nenhum lançamento',
        termo ? 'Tente outro termo de busca.'
              : 'Toque no + para registrar o primeiro movimento ' + faixa.rotulo + '.'
      ));
      alvo.appendChild(c);
      return;
    }

    var porDia = {};
    itens.forEach(function (l) { (porDia[l.data] = porDia[l.data] || []).push(l); });

    Object.keys(porDia).sort().reverse().forEach(function (data) {
      var doDia = porDia[data].slice().sort(function (a, b) { return (b.criadoEm || 0) - (a.criadoEm || 0); });
      var totalDia = doDia.reduce(function (s, l) {
        return s + (l.tipo === 'entrada' ? l.valor : l.tipo === 'saida' ? -l.valor : 0);
      }, 0);

      var cab = no('div', 'dia-cabecalho');
      juntar(cab, no('div', 'dia-nome', nomeDoDia(data)), no('div', 'dia-total num', comSinal(totalDia)));
      alvo.appendChild(cab);

      var cartaoDia = cartao('liso');
      doDia.forEach(function (l) { cartaoDia.appendChild(linhaLancamento(l)); });
      alvo.appendChild(cartaoDia);
    });

    var totais = totaisNaFaixa(faixa);
    var entradas = totais.entradas, saidas = totais.saidas, saldo = totais.saldo;

    var resumo = cartao();
    resumo.style.marginTop = '16px';
    var linhaResumo = no('div', 'cartao-topo');
    linhaResumo.style.marginBottom = '8px';
    juntar(linhaResumo,
      no('div', 'cartao-titulo', 'Saldo do período'),
      no('div', 'linha-valor num ' + (saldo >= 0 ? 'verde' : 'vermelho'), emReais(saldo))
    );
    resumo.appendChild(linhaResumo);
    var gradeResumo = no('div', 'resumo-grade');
    gradeResumo.style.marginTop = '0';
    [['Entradas', entradas, 'verde'], ['Saídas', saidas, 'vermelho'],
     ['Lançamentos', itens.length, '']].forEach(function (item) {
      var d = no('div');
      d.appendChild(no('div', 'r', item[0]));
      d.appendChild(no('div', 'v ' + item[2], item[0] === 'Lançamentos' ? String(item[1]) : emReais(item[1])));
      gradeResumo.appendChild(d);
    });
    resumo.appendChild(gradeResumo);
    resumo.appendChild(no('div', 'linha-nota', 'De ' + dataBr(faixa.de) + ' a ' + dataBr(faixa.ate) + '.'));
    alvo.appendChild(resumo);
  }

  function linhaLancamento(l) {
    var b = botao('linha', null, function () { abrirFolhaLancamento(l.id); });
    var cor = l.tipo === 'entrada' ? '#34D399' : l.tipo === 'saida' ? '#F87171' : '#60A5FA';
    var sinal = l.tipo === 'entrada' ? '+' : l.tipo === 'saida' ? '−' : '⇄';

    var sub;
    if (l.tipo === 'transferencia') {
      var origem = achar(estado.contas, l.contaId);
      var destino = achar(estado.contas, l.contaDestinoId);
      sub = (origem ? origem.nome : '—') + ' → ' + (destino ? destino.nome : '—');
    } else {
      var conta = achar(estado.contas, l.contaId);
      sub = l.categoria + (conta ? ' · ' + conta.nome : '');
    }

    juntar(b,
      selo(cor, sinal),
      juntar(no('div', 'linha-texto'),
        no('div', 'linha-titulo', l.descricao || (l.tipo === 'transferencia' ? 'Transferência' : l.categoria)),
        no('div', 'linha-sub', sub)),
      juntar(no('div', 'linha-fim'),
        no('div', 'linha-valor num ' + (l.tipo === 'entrada' ? 'verde' : l.tipo === 'saida' ? 'vermelho' : ''),
          (l.tipo === 'entrada' ? '+ ' : l.tipo === 'saida' ? '− ' : '') + emReais(l.valor)))
    );
    return b;
  }

  // Lançamentos que passaram por esta conta, do mais novo para o mais antigo.
  function lancamentosDaConta(id) {
    return estado.lancamentos.filter(function (l) {
      return l.contaId === id || l.contaDestinoId === id;
    }).sort(function (a, b) {
      if (a.data !== b.data) return a.data < b.data ? 1 : -1;
      return (b.criadoEm || 0) - (a.criadoEm || 0);
    });
  }

  // Quanto este lançamento mexeu nesta conta: positivo entra, negativo sai.
  function efeitoNaConta(l, id) {
    if (l.tipo === 'entrada') return l.contaId === id ? l.valor : 0;
    if (l.tipo === 'saida') return l.contaId === id ? -l.valor : 0;
    if (l.contaDestinoId === id) return l.valor;
    if (l.contaId === id) return -l.valor;
    return 0;
  }

  function linhaExtrato(l, id) {
    var efeito = efeitoNaConta(l, id);
    var b = botao('linha', null, function () { abrirFolhaLancamento(l.id); });
    var cor = efeito > 0 ? '#34D399' : efeito < 0 ? '#F87171' : '#60A5FA';
    var sinal = efeito > 0 ? '+' : efeito < 0 ? '−' : '⇄';

    var sub;
    if (l.tipo === 'transferencia') {
      var outra = achar(estado.contas, l.contaDestinoId === id ? l.contaId : l.contaDestinoId);
      sub = (efeito > 0 ? 'Veio de ' : 'Foi para ') + (outra ? outra.nome : 'outra conta');
    } else {
      sub = l.categoria;
    }

    juntar(b,
      selo(cor, sinal),
      juntar(no('div', 'linha-texto'),
        no('div', 'linha-titulo', l.descricao || (l.tipo === 'transferencia' ? 'Transferência' : l.categoria)),
        no('div', 'linha-sub', sub)),
      juntar(no('div', 'linha-fim'),
        no('div', 'linha-valor num ' + (efeito > 0 ? 'verde' : efeito < 0 ? 'vermelho' : ''),
          (efeito > 0 ? '+ ' : efeito < 0 ? '− ' : '') + emReais(Math.abs(efeito) || l.valor)))
    );
    return b;
  }

  function abrirExtratoConta(id) {
    var conta = achar(estado.contas, id);
    if (!conta) return;

    abrirFolha(conta.nome, function (folha) {
      var saldo = saldoConta(id, null);

      var topo = cartao();
      topo.appendChild(no('div', 'rotulo', 'Saldo atual'));
      topo.appendChild(no('div', 'valorao num' + (saldo < 0 ? ' vermelho' : ''), emReais(saldo)));
      topo.appendChild(no('div', 'linha-nota', conta.tipo + ' · saldo inicial de ' + emReais(conta.saldoInicial)));

      var editar = botao('btn btn-fantasma', 'Editar esta conta', function () {
        fecharFolha();
        setTimeout(function () { abrirFolhaConta(id); }, 240);
      });
      editar.style.marginTop = '14px';
      topo.appendChild(editar);
      folha.appendChild(topo);

      var itens = lancamentosDaConta(id);
      if (!itens.length) {
        var vazio = cartao('liso');
        vazio.appendChild(estadoVazio('Nenhum movimento ainda',
          'Os lançamentos feitos nesta conta aparecem aqui, do mais recente para o mais antigo.'));
        folha.appendChild(vazio);
        return;
      }

      var porDia = {};
      var ordem = [];
      itens.forEach(function (l) {
        if (!porDia[l.data]) { porDia[l.data] = []; ordem.push(l.data); }
        porDia[l.data].push(l);
      });

      ordem.forEach(function (data) {
        var doDia = porDia[data];
        var totalDia = doDia.reduce(function (soma, l) { return soma + efeitoNaConta(l, id); }, 0);

        var cab = no('div', 'dia-cabecalho');
        juntar(cab, no('div', 'dia-nome', nomeDoDia(data)), no('div', 'dia-total num', comSinal(totalDia)));
        folha.appendChild(cab);

        var cartaoDia = cartao('liso');
        doDia.forEach(function (l) { cartaoDia.appendChild(linhaExtrato(l, id)); });
        folha.appendChild(cartaoDia);
      });
    });
  }

  // ---------- Tela: Investimentos ----------

  function desenharInvestimentos() {
    var tela = $('telaInvestimentos');
    tela.textContent = '';
    tela.appendChild(cabecalho('Investimentos', null, false));

    var total = totalInvestido(null);
    var aplicado = totalAplicado();

    var cTotal = cartao();
    var topo = no('div', 'cartao-topo');
    juntar(topo, no('div', 'rotulo', 'Total investido'),
      botao('cartao-acao', '+ Novo ativo', function () { abrirFolhaAtivo(null); }));
    cTotal.appendChild(topo);
    cTotal.appendChild(no('div', 'valorao num', emReais(total)));

    if (aplicado > 0) {
      var lucro = total - aplicado;
      var v = no('div', 'variacao ' + (lucro >= 0 ? 'sobe' : 'desce'));
      v.appendChild(no('span', null, (lucro >= 0 ? '↑ ' : '↓ ') +
        Math.abs((lucro / aplicado) * 100).toFixed(2).replace('.', ',') + '%'));
      v.appendChild(no('span', 'resto', '(' + comSinal(lucro) + ' sobre ' + emReais(aplicado) + ')'));
      cTotal.appendChild(v);
    }
    cTotal.appendChild(blocoGrafico(serieInvestimentos(30), '#E9B44C'));
    tela.appendChild(cTotal);

    if (!estado.ativos.length) {
      var vazio = cartao('liso');
      vazio.appendChild(estadoVazio('Nenhum ativo cadastrado',
        'Cadastre o que você tem investido para acompanhar rentabilidade e alocação.'));
      var b = botao('btn btn-ouro', 'Cadastrar primeiro ativo', function () { abrirFolhaAtivo(null); });
      b.style.margin = '0 16px 18px';
      b.style.width = 'calc(100% - 32px)';
      vazio.appendChild(b);
      tela.appendChild(vazio);
      return;
    }

    tela.appendChild(segmentos([
      { valor: 'alocacao', rotulo: 'Alocação' },
      { valor: 'ativos', rotulo: 'Ativos' },
      { valor: 'rentabilidade', rotulo: 'Rentabilidade' }
    ], abaInvestimentos, function (v) { abaInvestimentos = v; desenharInvestimentos(); }));

    if (abaInvestimentos === 'alocacao') {
      var aloc = alocacaoPorClasse();
      var c = cartao();
      c.appendChild(no('div', 'cartao-titulo', 'Alocação por classe'));
      var seg = comCores(aloc.lista);
      c.appendChild(rosca(seg, aloc.total, 'Carteira'));
      c.appendChild(legenda(seg, aloc.total));
      tela.appendChild(c);
    } else if (abaInvestimentos === 'ativos') {
      var lista = cartao('liso');
      estado.ativos.slice().sort(function (a, b) { return valorAtivo(b) - valorAtivo(a); }).forEach(function (a) {
        var atual = valorAtivo(a);
        var rend = a.aplicado > 0 ? ((atual - a.aplicado) / a.aplicado) * 100 : 0;
        var linha = botao('linha', null, function () { abrirFolhaAtivo(a.id); });
        juntar(linha,
          selo(corDeCategoria(a.classe), a.nome.charAt(0).toUpperCase()),
          juntar(no('div', 'linha-texto'),
            no('div', 'linha-titulo', a.nome),
            no('div', 'linha-sub', a.classe)),
          juntar(no('div', 'linha-fim'),
            no('div', 'linha-valor num', emReais(atual)),
            no('div', 'linha-nota num ' + (rend >= 0 ? 'verde' : 'vermelho'),
              (rend >= 0 ? '↑ ' : '↓ ') + Math.abs(rend).toFixed(2).replace('.', ',') + '%'))
        );
        lista.appendChild(linha);
      });
      tela.appendChild(lista);
    } else {
      var cR = cartao();
      cR.appendChild(no('div', 'cartao-titulo', 'Rentabilidade da carteira'));
      var lucroTotal = total - aplicado;
      cR.appendChild(no('div', 'valorao pequeno num ' + (lucroTotal >= 0 ? 'verde' : 'vermelho'), comSinal(lucroTotal)));
      cR.appendChild(no('div', 'linha-nota',
        aplicado > 0
          ? 'sobre ' + emReais(aplicado) + ' aplicados (' +
            ((lucroTotal / aplicado) * 100).toFixed(2).replace('.', ',') + '%)'
          : 'informe o valor aplicado nos ativos para calcular'));

      var tabela = no('div');
      tabela.style.marginTop = '14px';
      estado.ativos.slice().sort(function (a, b) {
        var ra = a.aplicado > 0 ? (valorAtivo(a) - a.aplicado) / a.aplicado : 0;
        var rb = b.aplicado > 0 ? (valorAtivo(b) - b.aplicado) / b.aplicado : 0;
        return rb - ra;
      }).forEach(function (a) {
        var atual = valorAtivo(a);
        var lucro = atual - a.aplicado;
        var rend = a.aplicado > 0 ? (lucro / a.aplicado) * 100 : 0;
        var item = no('div', 'legenda-item');
        item.style.padding = '9px 0';
        item.style.borderTop = '1px solid var(--borda)';
        juntar(item,
          no('span', 'nome', a.nome),
          no('span', 'val num ' + (lucro >= 0 ? 'verde' : 'vermelho'), comSinal(lucro)),
          no('span', 'pct num', (rend >= 0 ? '+' : '−') + Math.abs(rend).toFixed(1).replace('.', ',') + '%')
        );
        tabela.appendChild(item);
      });
      cR.appendChild(tabela);
      tela.appendChild(cR);
    }
  }

  // ---------- Tela: Planejamento ----------

  function desenharPlanejamento() {
    var tela = $('telaPlanejamento');
    tela.textContent = '';
    tela.appendChild(cabecalho('Planejamento', null, true));

    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);
    var gastos = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);

    // Orçamento mensal
    var cOrc = cartao();
    cOrc.appendChild(topoDeCartao('Orçamento mensal', 'Editar', function () { abrirFolhaOrcamento(); }));
    if (!estado.orcamentos.geral) {
      cOrc.appendChild(no('p', 'linha-sub', 'Defina um teto de gastos para o mês e acompanhe o quanto já foi usado.'));
      var bDef = botao('btn btn-fantasma', 'Definir orçamento', function () { abrirFolhaOrcamento(); });
      bDef.style.marginTop = '12px';
      cOrc.appendChild(bDef);
    } else {
      var usado = pct(t.saidas, estado.orcamentos.geral);
      var linhaOrc = no('div', 'cartao-topo');
      linhaOrc.style.marginBottom = '8px';
      juntar(linhaOrc,
        no('div', 'linha-valor num', emReais(t.saidas) + ' / ' + emReais(estado.orcamentos.geral)),
        no('div', 'linha-valor num ' + (usado > 100 ? 'vermelho' : usado > 80 ? 'ouro' : 'verde'),
          Math.round(usado) + '%')
      );
      cOrc.appendChild(linhaOrc);
      cOrc.appendChild(progresso(t.saidas, estado.orcamentos.geral,
        usado > 100 ? 'var(--vermelho)' : usado > 80 ? 'var(--ouro)' : 'var(--verde)'));
      var restante = estado.orcamentos.geral - t.saidas;
      cOrc.appendChild(no('div', 'linha-nota',
        restante >= 0 ? 'Restam ' + emReais(restante) + ' neste mês' : 'Você passou ' + emReais(-restante) + ' do orçamento'));
    }
    tela.appendChild(cOrc);

    // Orçamento por categoria
    var chaves = Object.keys(estado.orcamentos.categorias);
    if (chaves.length) {
      var cCat = cartao();
      cCat.appendChild(topoDeCartao('Por categoria', 'Editar', function () { abrirFolhaOrcamento(); }));
      chaves.sort().forEach(function (nomeCat) {

  // ---------- Análises calculadas ----------

  function normalizar(descricao) {
    return descricao.toLowerCase().replace(/\d+/g, '').replace(/[^a-zà-ú ]/gi, '').trim();
  }

  // Só categorias em que faz sentido sugerir corte: aluguel e imposto não se cancela.
  var CANCELAVEIS = ['Assinaturas', 'Lazer', 'Educação', 'Alimentação', 'Outros'];

  function assinaturasProvaveis() {
    var grupos = {};
    estado.lancamentos.forEach(function (l) {
      if (l.tipo !== 'saida' || !l.descricao) return;
      if (CANCELAVEIS.indexOf(l.categoria) < 0) return;
      var chave = normalizar(l.descricao) + '|' + l.valor;
      if (!chave.trim()) return;
      (grupos[chave] = grupos[chave] || []).push(l);
    });

    var achados = [];
    Object.keys(grupos).forEach(function (chave) {
      var itens = grupos[chave];
      var meses = {};
      itens.forEach(function (l) { meses[l.data.slice(0, 7)] = true; });
      if (Object.keys(meses).length >= 2) {
        achados.push({ descricao: itens[0].descricao, valor: itens[0].valor, vezes: Object.keys(meses).length });
      }
    });
    return achados.sort(function (a, b) { return b.valor - a.valor; });
  }

  function gerarAnalises() {
    var lista = [];
    var ant = mesAnteriorAo(mesAtivo.ano, mesAtivo.mes);
    var atual = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);
    var anterior = gastosPorCategoria(ant.ano, ant.mes);
    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);

    var mapaAnterior = {};
    anterior.lista.forEach(function (c) { mapaAnterior[c.nome] = c.valor; });

    // Maior queda e maior alta por categoria
    var quedas = [], altas = [];
    atual.lista.forEach(function (c) {
      var base = mapaAnterior[c.nome];
      if (!base) return;
      var dif = c.valor - base;
      var p = (dif / base) * 100;
      if (p <= -8) quedas.push({ nome: c.nome, p: p, dif: dif });
      if (p >= 8) altas.push({ nome: c.nome, p: p, dif: dif });
    });
    quedas.sort(function (a, b) { return a.p - b.p; });
    altas.sort(function (a, b) { return b.p - a.p; });

    if (quedas.length) {
      var q = quedas[0];
      lista.push({
        tom: 'bom', pino: '↓', cor: 'var(--verde)', titulo: 'Boa!',
        texto: 'Seus gastos com ' + q.nome.toLowerCase() + ' caíram ' +
          Math.abs(q.p).toFixed(0) + '% em ' + MESES[mesAtivo.mes] + ' comparado ao mês anterior.',
        destaque: 'Economia de ' + emReais(-q.dif), destaqueCor: 'var(--verde)'
      });
    }

    if (altas.length) {
      var a = altas[0];
      lista.push({
        tom: 'atencao', pino: '!', cor: 'var(--ouro)', titulo: 'Atenção',
        texto: 'Seus gastos com ' + a.nome.toLowerCase() + ' subiram ' +
          a.p.toFixed(0) + '% em relação ao mês anterior.',
        destaque: 'Aumento de ' + emReais(a.dif), destaqueCor: 'var(--vermelho)'
      });
    }

    var assinaturas = assinaturasProvaveis();
    if (assinaturas.length) {
      var somaAss = assinaturas.reduce(function (s, x) { return s + x.valor; }, 0);
      lista.push({
        tom: 'oportunidade', pino: '◇', cor: 'var(--ouro)', titulo: 'Oportunidade',
        texto: 'Encontramos ' + assinaturas.length + ' cobrança(s) que se repetem todo mês: ' +
          assinaturas.slice(0, 4).map(function (x) { return x.descricao; }).join(', ') +
          '. Cancelar o que você não usa libera esse valor.',
        destaque: 'Até ' + emReais(somaAss) + ' por mês', destaqueCor: 'var(--roxo)'
      });
    }

    if (t.entradas > 0) {
      var taxa = ((t.entradas - t.saidas) / t.entradas) * 100;
      lista.push({
        tom: taxa >= 20 ? 'bom' : 'atencao',
        pino: '%', cor: taxa >= 20 ? 'var(--verde)' : 'var(--ouro)',
        titulo: taxa >= 20 ? 'Boa taxa de poupança' : 'Sobra apertada',
        texto: 'Você guardou ' + taxa.toFixed(0) + '% do que entrou em ' + MESES[mesAtivo.mes] +
          '. ' + (taxa >= 20 ? 'Acima dos 20% que costumam ser recomendados.' : 'O caminho comum é buscar pelo menos 20%.'),
        destaque: comSinal(t.saldo), destaqueCor: t.saldo >= 0 ? 'var(--verde)' : 'var(--vermelho)'
      });
    }

    estado.metas.forEach(function (m) {
      var p = pct(m.guardado, m.alvo);
      if (p >= 50) {
        lista.push({
          tom: 'meta', pino: '◎', cor: 'var(--verde)', titulo: 'Meta em dia',
          texto: 'Sua meta ' + m.nome + ' está ' + Math.round(p) + '% completa. Faltam ' +
            emReais(Math.max(0, m.alvo - m.guardado)) + '.',
          destaque: null
        });
      }
    });

    if (atual.total > 0) {
      var maior = atual.lista[0];
      lista.push({
        tom: 'info', pino: '★', cor: 'var(--ouro)', titulo: 'Maior gasto do mês',
        texto: maior.nome + ' concentrou ' + Math.round(pct(maior.valor, atual.total)) +
          '% das suas saídas, somando ' + emReais(maior.valor) + '.',
        destaque: null
      });
    }

    if (!lista.length) {
      lista.push({
        tom: 'info', pino: '·', cor: 'var(--suave)', titulo: 'Ainda sem padrões',
        texto: 'Registre lançamentos por alguns meses para eu comparar períodos e apontar tendências.',
        destaque: null
      });
    }

    return lista;
  }
