<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090D12">
<meta name="description" content="Controle de receitas, despesas, investimentos e metas.">
<title>Caixa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caixa">
<style>
  :root {
    --fundo: #090D12;
    --cartao: #131B24;
    --cartao-2: #18212C;
    --borda: #212C3A;
    --texto: #E6EDF5;
    --suave: #94A3B4;
    --fraco: #66768A;
    --ouro: #E9B44C;
    --ouro-2: #C2913A;
    --verde: #34D399;
    --vermelho: #F87171;
    --azul: #60A5FA;
    --roxo: #A78BFA;
    --rosa: #F472B6;
    --ciano: #22D3EE;
    --raio: 16px;
    --baixo: env(safe-area-inset-bottom, 0px);
    --alto: env(safe-area-inset-top, 0px);
    --nav: 62px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  input, select { -webkit-appearance: none; appearance: none; }

  .oculto { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Estrutura ---------- */

  .tela { display: none; padding: 0 16px; }
  .tela.ativa { display: block; }

  main { padding-bottom: calc(var(--nav) + var(--baixo) + 92px); }

  .cabecalho {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: calc(14px + var(--alto)) 0 14px;
  }
  .cabecalho h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .cabecalho .sub { font-size: 13px; color: var(--suave); margin-top: 2px; }

  .mes-seletor {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 999px;
    padding: 3px;
    flex: 0 0 auto;
  }
  .mes-seletor button {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: var(--suave);
    font-size: 17px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .mes-seletor button:active { background: var(--cartao-2); }
  .mes-seletor .rotulo {
    font-size: 13px;
    font-weight: 600;
    padding: 0 4px;
    min-width: 94px;
    text-align: center;
    text-transform: capitalize;
  }

  /* ---------- Cartões ---------- */

  .cartao {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    padding: 16px;
    margin-bottom: 12px;
  }
  .cartao.liso { padding: 0; overflow: hidden; }

  .cartao-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .cartao-titulo { font-size: 15px; font-weight: 600; }
  .cartao-acao { font-size: 13px; color: var(--ouro); font-weight: 600; }

  .rotulo {
    font-size: 12px;
    color: var(--suave);
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 600;
  }

  .valorao { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0; }
  .valorao.pequeno { font-size: 26px; }

  .variacao { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .variacao.sobe { color: var(--verde); }
  .variacao.desce { color: var(--vermelho); }
  .variacao .resto { color: var(--fraco); font-weight: 500; }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpi {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 12px 10px;
  }
  .kpi .rotulo { font-size: 11px; letter-spacing: .04em; }
  .kpi .n { font-size: 14.5px; font-weight: 700; margin: 5px 0 4px; }
  .kpi .variacao { font-size: 12px; }

  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---------- Gráficos ---------- */

  .grafico { width: 100%; display: block; }
  .grafico-eixo { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--fraco); }

  .rosca-caixa { position: relative; width: 168px; margin: 4px auto 12px; }
  .rosca-centro {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    pointer-events: none;
  }
  .rosca-centro .t { font-size: 11px; color: var(--suave); }
  .rosca-centro .v { font-size: 17px; font-weight: 700; }

  .legenda { display: flex; flex-direction: column; gap: 9px; }
  .legenda-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .legenda-item .bolinha { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .legenda-item .nome { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legenda-item .pct { color: var(--suave); font-size: 12.5px; }
  .legenda-item .val { font-size: 12.5px; color: var(--suave); }

  /* ---------- Barras e progresso ---------- */

  .trilho { height: 7px; border-radius: 999px; background: #1E2833; overflow: hidden; }
  .trilho i { display: block; height: 100%; border-radius: 999px; transition: width .3s ease; }

  .barra-dupla { display: flex; height: 9px; border-radius: 999px; overflow: hidden; background: #1E2833; }
  .barra-dupla i { display: block; height: 100%; }

  /* ---------- Listas ---------- */

  .linha {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 13px 16px;
    text-align: left;
    border-top: 1px solid var(--borda);
  }
  .linha:first-child { border-top: 0; }
  .linha:active { background: var(--cartao-2); }

  .selo {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 700;
  }

  .linha-texto { flex: 1 1 auto; min-width: 0; }
  .linha-titulo { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-sub { font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-fim { flex: 0 0 auto; text-align: right; }
  .linha-valor { font-size: 15px; font-weight: 700; }
  .linha-nota { font-size: 12px; color: var(--fraco); }

  .verde { color: var(--verde); }
  .vermelho { color: var(--vermelho); }
  .ouro { color: var(--ouro); }
  .suave { color: var(--suave); }

  .dia-cabecalho {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 16px 4px 8px;
  }
  .dia-nome { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--suave); }
  .dia-total { font-size: 12.5px; font-weight: 600; color: var(--fraco); }

  .vazio { padding: 32px 18px; text-align: center; color: var(--suave); font-size: 14px; }
  .vazio strong { display: block; color: var(--texto); font-size: 15.5px; margin-bottom: 5px; }

  /* ---------- Segmentos e chips ---------- */

  .segmentos {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 999px;
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .segmentos::-webkit-scrollbar { display: none; }
  .segmentos button {
    flex: 1 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--suave);
    white-space: nowrap;
  }
  .segmentos button[aria-selected="true"] { background: var(--ouro); color: #17202A; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 13px;
    border-radius: 999px;
    background: var(--cartao-2);
    border: 1px solid var(--borda);
    font-size: 13.5px;
    color: var(--texto);
  }
  .chip[aria-pressed="true"] { background: var(--ouro); border-color: var(--ouro); color: #17202A; font-weight: 600; }

  /* ---------- Busca ---------- */

  .busca {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 0 12px;
    margin-bottom: 12px;
  }
  .busca input { flex: 1; border: 0; background: none; outline: none; padding: 12px 0; font-size: 14.5px; }
  .busca .lupa { color: var(--fraco); font-size: 15px; }

  /* ---------- Navegação ---------- */

  nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: calc(var(--nav) + var(--baixo));
    padding-bottom: var(--baixo);
    display: flex;
    background: rgba(11,16,22,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--borda);
    z-index: 40;
  }
  nav button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--fraco);
    font-size: 10.5px;
    font-weight: 600;
  }
  nav button svg { width: 21px; height: 21px; }
  nav button[aria-selected="true"] { color: var(--ouro); }

  .fab {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--nav) + var(--baixo) + 16px);
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(160deg, #F0C367, var(--ouro-2));
    color: #17202A;
    font-size: 30px;
    font-weight: 300;
    line-height: 1;
    display: grid;
    place-items: center;
    box-shadow: 0 10px 26px rgba(0,0,0,.55), 0 0 0 5px var(--fundo);
    z-index: 41;
  }
  .fab:active { transform: translateX(-50%) scale(.94); }

  /* ---------- Folhas ---------- */

  .cortina {
    position: fixed;
    inset: 0;
    background: rgba(4,7,10,.72);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 105;
  }
  .cortina.aberta { opacity: 1; pointer-events: auto; }

  .folha {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #0F151C;
    border-top: 1px solid var(--borda);
    border-radius: 22px 22px 0 0;
    padding: 8px 16px calc(22px + var(--baixo));
    transform: translateY(101%);
    transition: transform .27s cubic-bezier(.32,.72,0,1);
    z-index: 106;
  }
  .folha.aberta { transform: translateY(0); }

  .puxador { width: 38px; height: 4px; border-radius: 999px; background: #2B3846; margin: 6px auto 14px; }
  .folha-titulo { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 16px; }

  .campo { margin-bottom: 14px; }
  .campo > label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin-bottom: 7px; }

  .entrada {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--borda);
    border-radius: 12px;
    background: var(--cartao);
    outline: none;
    font-size: 15px;
  }
  .entrada:focus { border-color: var(--ouro); }
  select.entrada { background-image: linear-gradient(45deg, transparent 50%, var(--suave) 50%), linear-gradient(135deg, var(--suave) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
  input[type="date"].entrada { min-height: 47px; }
  ::placeholder { color: var(--fraco); }

  .valor-grande {
    width: 100%;
    padding: 6px 0 12px;
    border: 0;
    border-bottom: 2px solid var(--borda);
    border-radius: 0;
    background: none;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -.02em;
    text-align: center;
    outline: none;
  }
  .valor-grande:focus { border-bottom-color: currentColor; }
  .forma[data-tipo="saida"] .valor-grande { color: var(--vermelho); }
  .forma[data-tipo="entrada"] .valor-grande { color: var(--verde); }
  .forma[data-tipo="transferencia"] .valor-grande { color: var(--azul); }

  .acoes { display: flex; flex-direction: column; gap: 9px; margin-top: 20px; }

  .btn {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    font-size: 15.5px;
    font-weight: 700;
    text-align: center;
  }
  .btn-ouro { background: var(--ouro); color: #17202A; }
  .btn-fantasma { background: var(--cartao); border: 1px solid var(--borda); color: var(--texto); }
  .btn-perigo { background: transparent; color: var(--vermelho); font-size: 14.5px; padding: 12px; }
  .btn-perigo:active { background: rgba(248,113,113,.1); }
  .btn:disabled { opacity: .45; }

  .erro { color: var(--vermelho); font-size: 13px; text-align: center; margin-top: 4px; }

  /* ---------- Insights ---------- */

  .insight {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .insight-topo { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 13.5px; font-weight: 700; }
  .insight-topo .pino { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; }
  .insight p { margin: 0; font-size: 13.5px; color: var(--suave); line-height: 1.5; }
  .insight .destaque { margin-top: 9px; font-size: 13.5px; font-weight: 700; }

  /* ---------- Aviso e toque ---------- */

  .aviso {
    position: fixed;
    left: 12px; right: 12px;
    top: calc(10px + var(--alto));
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--cartao-2);
    border: 1px solid var(--borda);
    color: var(--texto);
    border-radius: 13px;
    box-shadow: 0 12px 30px rgba(0,0,0,.6);
    z-index: 118;
    font-size: 14px;
  }
  .aviso span { flex: 1; }
  .aviso button { padding: 8px 13px; border-radius: 999px; background: var(--ouro); color: #17202A; font-size: 13.5px; font-weight: 700; }

  .toque {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--nav) + var(--baixo) + 84px);
    max-width: calc(100% - 32px);
    padding: 11px 18px;
    background: #212C3A;
    border: 1px solid #2E3B4B;
    border-radius: 999px;
    font-size: 14px;
    box-shadow: 0 10px 26px rgba(0,0,0,.5);
    z-index: 120;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .toque.visivel { opacity: 1; }

  /* ---------- Relatório ---------- */

  #relatorio {
    position: fixed;
    inset: 0;
    background: var(--fundo);
    z-index: 90;
    overflow-y: auto;
    display: none;
  }
  #relatorio.aberto { display: block; }
  .rel-barra {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: calc(12px + var(--alto)) 16px 12px;
    background: rgba(9,13,18,.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--borda);
  }
  .rel-barra button { font-size: 14px; font-weight: 600; color: var(--ouro); }
  .rel-folha { padding: 18px 16px 40px; max-width: 720px; margin: 0 auto; }
  .rel-folha h1 { font-size: 22px; margin: 0 0 4px; }
  .rel-folha .rel-sub { color: var(--suave); font-size: 13px; margin-bottom: 20px; }
  .rel-folha h2 { font-size: 15px; margin: 24px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--borda); }
  .rel-tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rel-tabela th { text-align: left; color: var(--suave); font-weight: 600; padding: 7px 6px; border-bottom: 1px solid var(--borda); font-size: 12px; }
  .rel-tabela td { padding: 8px 6px; border-bottom: 1px solid #1A232E; }
  .rel-tabela td.n, .rel-tabela th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .rel-par { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1A232E; font-size: 14px; }
  .rel-par .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rel-nota { font-size: 12px; color: var(--fraco); margin-top: 18px; line-height: 1.6; }

  /* ---------- Entrada: abertura, login e cadastro ---------- */

  #entrada {
    position: fixed;
    inset: 0;
    z-index: 100;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background:
      radial-gradient(120% 62% at 50% 0%, rgba(233,180,76,.13), transparent 62%),
      radial-gradient(90% 45% at 50% 100%, rgba(233,180,76,.07), transparent 70%),
      #05080B;
  }
  #entrada.escondida { display: none; }

  .ent-folha {
    min-height: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: calc(18px + var(--alto)) 24px calc(26px + var(--baixo));
    display: flex;
    flex-direction: column;
  }

  .ent-voltar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #10171F;
    border: 1px solid #222E3C;
    color: var(--texto);
    display: grid;
    place-items: center;
    font-size: 19px;
    margin-bottom: 22px;
    flex: 0 0 auto;
  }
  .ent-voltar:active { background: #172029; }

  .marca-caixa { text-align: center; margin: 6px 0 4px; }
  .marca-nome {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: .34em;
    text-indent: .34em;
    margin-top: 14px;
  }
  .marca-sub {
    font-size: 9.5px;
    letter-spacing: .3em;
    text-indent: .3em;
    color: #8A7442;
    margin-top: 7px;
    text-transform: uppercase;
  }

  .ent-titulo {
    font-size: 34px;
    line-height: 1.12;
    font-weight: 700;
    letter-spacing: -.02em;
    text-align: center;
    margin: 26px 0 0;
  }
  .ent-titulo .ouro { color: var(--ouro); display: block; }
  .ent-texto {
    text-align: center;
    color: var(--suave);
    font-size: 14.5px;
    line-height: 1.5;
    margin: 12px 0 0;
  }

  .carrossel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    margin: 0 -24px;
  }
  .carrossel::-webkit-scrollbar { display: none; }
  .carrossel > div {
    flex: 0 0 100%;
    scroll-snap-align: center;
    padding: 0 24px;
  }

  .vantagens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 26px; }
  .vantagem { text-align: center; }
  .vantagem .quadro {
    width: 54px;
    height: 54px;
    margin: 0 auto 10px;
    border-radius: 15px;
    background: linear-gradient(160deg, #17202B, #0D131A);
    border: 1px solid #26313E;
    display: grid;
    place-items: center;
    color: var(--ouro);
  }
  .vantagem .quadro svg { width: 24px; height: 24px; }
  .vantagem .nome { font-size: 12.5px; font-weight: 700; }
  .vantagem .detalhe { font-size: 11px; color: var(--fraco); line-height: 1.45; margin-top: 4px; }

  .pontos { display: flex; justify-content: center; gap: 7px; margin: 22px 0 4px; }
  .pontos i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2B3646;
    transition: all .2s ease;
  }
  .pontos i.ativo { background: var(--ouro); width: 20px; border-radius: 999px; }

  .ent-fundo { margin-top: auto; padding-top: 26px; }

  .btn-dourado {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, #F7D888 0%, #E9B44C 45%, #D09A32 100%);
    color: #16202B;
    font-size: 15.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 10px 26px rgba(233,180,76,.18);
  }
  .btn-dourado:active { filter: brightness(.94); }
  .btn-dourado:disabled { opacity: .5; box-shadow: none; }

        if (!Array.isArray(lista)) return;
        limpo.categoriasExtras[tipo] = lista
          .filter(function (c) { return typeof c === 'string' && c.trim(); })
          .map(function (c) { return c.trim().slice(0, 30); })
          .slice(0, 40);
      });
    }

    if (Array.isArray(bruto.clientes)) {
      limpo.clientes = bruto.clientes.filter(function (c) {
        return c && typeof c === 'object' && typeof c.id === 'string' && texto(c.nome);
      }).map(function (c) {
        return {
          id: c.id,
          nome: texto(c.nome).slice(0, 60),
          telefone: texto(c.telefone).slice(0, 30),
          obs: texto(c.obs).slice(0, 200),
          proximoPagamento: ehData(c.proximoPagamento) ? c.proximoPagamento : '',
          criadoEm: inteiro(c.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.servicos)) {
      limpo.servicos = bruto.servicos.filter(function (s) {
        return s && typeof s === 'object' && typeof s.id === 'string' &&
          typeof s.clienteId === 'string' && inteiro(s.valor) > 0 && ehData(s.data);
      }).map(function (s) {
        return {
          id: s.id,
          clienteId: s.clienteId,
          nome: texto(s.nome).slice(0, 60) || 'Serviço',
          valor: inteiro(s.valor),
          data: s.data,
          obs: texto(s.obs).slice(0, 200),
          criadoEm: inteiro(s.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.pagamentos)) {
      limpo.pagamentos = bruto.pagamentos.filter(function (p) {
        return p && typeof p === 'object' && typeof p.id === 'string' &&
          typeof p.clienteId === 'string' && inteiro(p.valor) > 0 && ehData(p.data);
      }).map(function (p) {
        return {
          id: p.id,
          clienteId: p.clienteId,
          servicoId: texto(p.servicoId),
          valor: inteiro(p.valor),
          data: p.data,
          lancamentoId: texto(p.lancamentoId),
          criadoEm: inteiro(p.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.contas)) {
      limpo.contas = bruto.contas.filter(function (c) {
        return c && typeof c === 'object' && typeof c.id === 'string' && texto(c.nome);
      }).map(function (c) {
        return {
          id: c.id,
          nome: texto(c.nome).slice(0, 40),
          tipo: TIPOS_CONTA.indexOf(c.tipo) >= 0 ? c.tipo : 'Conta corrente',
          saldoInicial: inteiro(c.saldoInicial),
          cor: CORES.indexOf(c.cor) >= 0 ? c.cor : CORES[0]
        };
      });
    }

    if (Array.isArray(bruto.lancamentos)) {
      limpo.lancamentos = bruto.lancamentos.filter(function (l) {
        return l && typeof l === 'object' && typeof l.id === 'string' &&
          ['entrada', 'saida', 'transferencia'].indexOf(l.tipo) >= 0 &&
          inteiro(l.valor) > 0 && ehData(l.data);
      }).map(function (l) {
        return {
          id: l.id,
          tipo: l.tipo,
          valor: inteiro(l.valor),
          descricao: texto(l.descricao).slice(0, 80),
          categoria: texto(l.categoria) || 'Outros',
          data: l.data,
          contaId: texto(l.contaId),
          contaDestinoId: texto(l.contaDestinoId),
          criadoEm: inteiro(l.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.ativos)) {
      limpo.ativos = bruto.ativos.filter(function (a) {
        return a && typeof a === 'object' && typeof a.id === 'string' && texto(a.nome);
      }).map(function (a) {
        var historico = Array.isArray(a.historico) ? a.historico.filter(function (p) {
          return p && ehData(p.data) && inteiro(p.valor) >= 0;
        }).map(function (p) {
          return { data: p.data, valor: inteiro(p.valor) };
        }).sort(function (x, y) { return x.data < y.data ? -1 : 1; }) : [];
        return {
          id: a.id,
          nome: texto(a.nome).slice(0, 50),
          classe: CLASSES_ATIVO.indexOf(a.classe) >= 0 ? a.classe : 'Outros',
          aplicado: Math.max(inteiro(a.aplicado), 0),
          historico: historico.length ? historico : [{ data: hojeTexto(), valor: Math.max(inteiro(a.aplicado), 0) }]
        };
      });
    }

    if (Array.isArray(bruto.metas)) {
      limpo.metas = bruto.metas.filter(function (m) {
        return m && typeof m === 'object' && typeof m.id === 'string' && texto(m.nome) && inteiro(m.alvo) > 0;
      }).map(function (m) {
        return {
          id: m.id,
          nome: texto(m.nome).slice(0, 50),
          alvo: inteiro(m.alvo),
          guardado: Math.max(inteiro(m.guardado), 0),
          prazo: ehData(m.prazo) ? m.prazo : ''
        };
      });
    }

    if (bruto.orcamentos && typeof bruto.orcamentos === 'object') {
      limpo.orcamentos.geral = Math.max(inteiro(bruto.orcamentos.geral), 0);
      var cats = bruto.orcamentos.categorias;
      if (cats && typeof cats === 'object') {
        Object.keys(cats).slice(0, 60).forEach(function (c) {
          var v = Math.max(inteiro(cats[c]), 0);
          if (v > 0 && c.length <= 30) limpo.orcamentos.categorias[c] = v;
        });
      }
    }

    return limpo;
  }

  function migrarDaV1() {
    var bruto;
    try { bruto = JSON.parse(localStorage.getItem(CHAVE_ANTIGA) || 'null'); } catch (e) { return null; }
    if (!Array.isArray(bruto) || !bruto.length) return null;

    var carteira = { id: novoId(), nome: 'Carteira', tipo: 'Dinheiro físico', saldoInicial: 0, cor: CORES[0] };
    var novo = estadoPadrao();
    novo.contas = [carteira];
    novo.lancamentos = bruto.map(function (l) {
      return {
        id: typeof l.id === 'string' ? l.id : novoId(),
        tipo: l.tipo === 'entrada' ? 'entrada' : 'saida',
        valor: inteiro(l.valor),
        descricao: texto(l.descricao),
        categoria: texto(l.categoria) || 'Outros',
        data: ehData(l.data) ? l.data : hojeTexto(),
        contaId: carteira.id,
        contaDestinoId: '',
        criadoEm: inteiro(l.criadoEm) || Date.now()
      };
    });
    return limparEstado(novo);
  }

  // ---------- Criptografia dos dados ----------
  // Cada conta tem uma chave mestra aleatória. Ela é guardada duas vezes:
  // embrulhada pela senha e embrulhada pelo código de recuperação. O cofre
  // com os dados é cifrado com AES-GCM usando essa chave mestra.

  var cripto = window.crypto && window.crypto.subtle ? window.crypto : null;

  function paraBase64(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }

  function deBase64(texto) {
    var s = atob(texto);
    var bytes = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
    return bytes;
  }

  function bytesAleatorios(n) { return cripto.getRandomValues(new Uint8Array(n)); }

  function derivarChave(segredo, saltB64) {
    return cripto.subtle.importKey('raw', new TextEncoder().encode(segredo), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return cripto.subtle.deriveKey(
          { name: 'PBKDF2', salt: deBase64(saltB64), iterations: 210000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      });
  }

  function cifrarBytes(chave, bytes) {
    var iv = bytesAleatorios(12);
    return cripto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, chave, bytes).then(function (cif) {
      var saida = new Uint8Array(12 + cif.byteLength);
      saida.set(iv, 0);
      saida.set(new Uint8Array(cif), 12);
      return paraBase64(saida);
    });
  }

  function decifrarBytes(chave, b64) {
    var bytes = deBase64(b64);
    return cripto.subtle.decrypt(
      { name: 'AES-GCM', iv: bytes.slice(0, 12) }, chave, bytes.slice(12)
    ).then(function (claro) { return new Uint8Array(claro); });
  }

  function cifrar(chave, objeto) {
    return cifrarBytes(chave, new TextEncoder().encode(JSON.stringify(objeto)));
  }

  function decifrar(chave, b64) {
    return decifrarBytes(chave, b64).then(function (bytes) {
      return JSON.parse(new TextDecoder().decode(bytes));
    });
  }

  function novaChaveMestra() {
    return cripto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }

  function exportarChave(chave) {
    return cripto.subtle.exportKey('raw', chave).then(function (b) { return paraBase64(new Uint8Array(b)); });
  }

  function importarChave(b64) {
    return cripto.subtle.importKey('raw', deBase64(b64), { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }

  function embrulhar(chaveMestra, segredo, saltB64) {
    return Promise.all([exportarChave(chaveMestra), derivarChave(segredo, saltB64)])
      .then(function (r) { return cifrarBytes(r[1], deBase64(r[0])); });
  }

  function desembrulhar(envelope, segredo, saltB64) {
    return derivarChave(segredo, saltB64)
      .then(function (chaveSegredo) { return decifrarBytes(chaveSegredo, envelope); })
      .then(function (bruto) { return importarChave(paraBase64(bruto)); });
  }

  function gerarCodigoRecuperacao() {
    // Sem vogais, para o código nunca formar palavra.
    var alfabeto = 'BCDFGHJKLMNPQRSTVWXZ23456789';
    var bytes = bytesAleatorios(20);
    var saida = '';
    for (var i = 0; i < 20; i++) {
      if (i > 0 && i % 5 === 0) saida += '-';
      saida += alfabeto[bytes[i] % alfabeto.length];
    }
    return saida;
  }

  // ---------- Contas de usuário ----------

  function lerContas() {
    try {
      var lista = JSON.parse(localStorage.getItem(CHAVE_CONTAS) || '[]');
      return Array.isArray(lista) ? lista : [];
    } catch (e) { return []; }
  }

  function gravarContas(lista) {
    try {
      localStorage.setItem(CHAVE_CONTAS, JSON.stringify(lista));
    } catch (e) {
      avisar('Não foi possível salvar. Armazenamento cheio?');
    }
  }

  function normalizarEmail(email) { return String(email || '').trim().toLowerCase(); }

  var sessao = null;          // { contaId, chave }
  var filaSalvar = Promise.resolve();

  function salvar() {
    if (!sessao) return;
    filaSalvar = filaSalvar.then(function () {
      return cifrar(sessao.chave, estado).then(function (cofre) {
        var contas = lerContas();
        var conta = achar(contas, sessao.contaId);
        if (!conta) return;
        conta.cofre = cofre;
        conta.atualizadoEm = Date.now();
        gravarContas(contas);
      });
    }).catch(function () {
      avisar('Não foi possível salvar os dados.');
    });
    return filaSalvar;
  }

  // Dados soltos das versões anteriores, para levar na primeira conta criada.
  function dadosParaImportar() {
    if (localStorage.getItem('caixa.importado.v3')) return null;
    var bruto = null;
    try { bruto = JSON.parse(localStorage.getItem(CHAVE) || 'null'); } catch (e) { bruto = null; }
    if (bruto) return limparEstado(bruto);
    return migrarDaV1();
  }

  function marcarImportado() {
    try { localStorage.setItem('caixa.importado.v3', '1'); } catch (e) { /* sem espaço, tudo bem */ }
  }

  function criarConta(nome, email, senha) {
    var contas = lerContas();
    var codigo = gerarCodigoRecuperacao();
    var saltSenha = paraBase64(bytesAleatorios(16));
    var saltCodigo = paraBase64(bytesAleatorios(16));
    var chaveMestra;

    return novaChaveMestra().then(function (chave) {
      chaveMestra = chave;
      return Promise.all([
        embrulhar(chaveMestra, senha, saltSenha),
        embrulhar(chaveMestra, codigo, saltCodigo),
        cifrar(chaveMestra, dadosParaImportar() || estadoPadrao())
      ]);
    }).then(function (r) {
      var conta = {
        id: novoId(),
        nome: nome,
        email: normalizarEmail(email),
        criadoEm: Date.now(),
        atualizadoEm: Date.now(),
        saltSenha: saltSenha,
        saltCodigo: saltCodigo,
        envelopeSenha: r[0],
        envelopeCodigo: r[1],
        cofre: r[2]
      };
      contas.push(conta);
      gravarContas(contas);
      marcarImportado();
      return { conta: conta, chave: chaveMestra, codigo: codigo };
    });
  }

  function entrarComSenha(conta, senha) {
    return desembrulhar(conta.envelopeSenha, senha, conta.saltSenha);
  }

  function entrarComCodigo(conta, codigo) {
    return desembrulhar(conta.envelopeCodigo, String(codigo).trim().toUpperCase(), conta.saltCodigo);
  }

  function trocarSenha(conta, chaveMestra, novaSenha) {
    var salt = paraBase64(bytesAleatorios(16));
    return embrulhar(chaveMestra, novaSenha, salt).then(function (envelope) {
      var contas = lerContas();
      var alvo = achar(contas, conta.id);
      if (!alvo) return;
      alvo.saltSenha = salt;
      alvo.envelopeSenha = envelope;
      gravarContas(contas);
    });
  }

  function guardarSessao(contaId, chave, lembrar) {
    return exportarChave(chave).then(function (bruta) {
      var pacote = JSON.stringify({ contaId: contaId, chave: bruta });
      try {
        sessionStorage.setItem(CHAVE_SESSAO, pacote);
        if (lembrar) localStorage.setItem(CHAVE_SESSAO, pacote);
        else localStorage.removeItem(CHAVE_SESSAO);
      } catch (e) { /* sessão só nesta aba */ }
    });
  }

  function limparSessao() {
    try {
      sessionStorage.removeItem(CHAVE_SESSAO);
      localStorage.removeItem(CHAVE_SESSAO);
    } catch (e) { /* nada a fazer */ }
  }

  function sessaoGuardada() {
    var bruto = null;
    try { bruto = sessionStorage.getItem(CHAVE_SESSAO) || localStorage.getItem(CHAVE_SESSAO); } catch (e) { return null; }
    if (!bruto) return null;
    try { return JSON.parse(bruto); } catch (e) { return null; }
  }

  function abrirCofre(conta, chave) {
    sessao = { contaId: conta.id, chave: chave };
    return decifrar(chave, conta.cofre).then(function (dados) {
      estado = limparEstado(dados);
    }).catch(function () {
      estado = estadoPadrao();
    });
  }

  function sair() {
    limparSessao();
    sessao = null;
    estado = estadoPadrao();
    telaAtiva = 'inicio';
    mostrarEntrada('abertura');
  }

  function achar(lista, id) {
    for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i];
    return null;
  }

  function contaPadrao() {
    if (!estado.contas.length) {
      estado.contas.push({ id: novoId(), nome: 'Carteira', tipo: 'Dinheiro físico', saldoInicial: 0, cor: CORES[0] });
      salvar();
    }
    return estado.contas[0];
  }

  // ---------- Cálculos ----------

  function saldoConta(id, ate) {
    var c = achar(estado.contas, id);
    if (!c) return 0;
    var s = c.saldoInicial;
    estado.lancamentos.forEach(function (l) {
      if (ate && l.data > ate) return;
      if (l.tipo === 'entrada' && l.contaId === id) s += l.valor;
      else if (l.tipo === 'saida' && l.contaId === id) s -= l.valor;
      else if (l.tipo === 'transferencia') {
        if (l.contaId === id) s -= l.valor;
        if (l.contaDestinoId === id) s += l.valor;
      }
    });
    return s;
  }

  function totalEmContas(ate) {
    var s = 0;
    estado.contas.forEach(function (c) { s += c.saldoInicial; });
    estado.lancamentos.forEach(function (l) {
      if (ate && l.data > ate) return;
      if (l.tipo === 'entrada') s += l.valor;
      else if (l.tipo === 'saida') s -= l.valor;
    });
    return s;
  }

  function valorAtivoEm(ativo, ate) {
    var valor = 0;
    var achou = false;
    for (var i = 0; i < ativo.historico.length; i++) {
      if (!ate || ativo.historico[i].data <= ate) { valor = ativo.historico[i].valor; achou = true; }
    }
    return achou ? valor : 0;
  }

  function valorAtivo(ativo) { return valorAtivoEm(ativo, null); }

  function totalInvestido(ate) {
    var s = 0;
    estado.ativos.forEach(function (a) { s += valorAtivoEm(a, ate); });
    return s;
  }

  function totalAplicado() {
    var s = 0;
    estado.ativos.forEach(function (a) { s += a.aplicado; });
    return s;
  }

  function patrimonio(ate) { return totalEmContas(ate) + totalInvestido(ate); }

  function lancamentosDoMes(ano, mes) {
    var pre = prefixoMes(ano, mes);
    return estado.lancamentos.filter(function (l) { return l.data.indexOf(pre) === 0; });
  }

  function totaisDoMes(ano, mes) {
    var entradas = 0, saidas = 0;
    lancamentosDoMes(ano, mes).forEach(function (l) {
      if (l.tipo === 'entrada') entradas += l.valor;
      else if (l.tipo === 'saida') saidas += l.valor;
    });
    return { entradas: entradas, saidas: saidas, saldo: entradas - saidas };
  }

  function gastosPorCategoria(ano, mes) {
    var mapa = {};
    var total = 0;
    lancamentosDoMes(ano, mes).forEach(function (l) {
      if (l.tipo !== 'saida') return;
      mapa[l.categoria] = (mapa[l.categoria] || 0) + l.valor;
      total += l.valor;
    });
    var lista = Object.keys(mapa).map(function (nome) {
      return { nome: nome, valor: mapa[nome] };
    }).sort(function (a, b) { return b.valor - a.valor; });
    return { lista: lista, total: total };
  }

  function alocacaoPorClasse() {
    var mapa = {};
    var total = 0;
    estado.ativos.forEach(function (a) {
      var v = valorAtivo(a);
      mapa[a.classe] = (mapa[a.classe] || 0) + v;
      total += v;
    });
    var lista = Object.keys(mapa).map(function (nome) {
      return { nome: nome, valor: mapa[nome] };
    }).sort(function (a, b) { return b.valor - a.valor; });
    return { lista: lista, total: total };
  }

  function mediaDespesas(meses) {
    var hoje = new Date();
    var soma = 0, contados = 0;
    for (var i = 1; i <= meses; i++) {
      var d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
      var t = totaisDoMes(d.getFullYear(), d.getMonth());
      if (t.entradas > 0 || t.saidas > 0) { soma += t.saidas; contados++; }
    }
    if (!contados) {
      var atual = totaisDoMes(hoje.getFullYear(), hoje.getMonth());
      return atual.saidas;
    }
    return Math.round(soma / contados);
  }

  function seriePatrimonio(dias) {
    var pontos = [];
    var fim = hojeTexto();
    for (var i = dias - 1; i >= 0; i--) {
      var d = somaDias(fim, -i);
      pontos.push({ data: d, valor: patrimonio(d) });
    }
    return pontos;
  }

  function serieInvestimentos(dias) {
    var pontos = [];
    var fim = hojeTexto();
    for (var i = dias - 1; i >= 0; i--) {
      var d = somaDias(fim, -i);
      pontos.push({ data: d, valor: totalInvestido(d) });
    }
    return pontos;
  }

  // ---------- Construção de elementos ----------

  function no(tag, classe, conteudo) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (conteudo != null) e.textContent = conteudo;
    return e;
  }

  function juntar(pai) {
    for (var i = 1; i < arguments.length; i++) {
      var f = arguments[i];
      if (f) pai.appendChild(f);
    }
    return pai;
  }

  function botao(classe, conteudo, aoClicar) {
    var b = no('button', classe, conteudo);
    b.type = 'button';
    if (aoClicar) b.addEventListener('click', aoClicar);
    return b;
  }

  function svgNo(nome, atributos) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', nome);
    Object.keys(atributos || {}).forEach(function (k) { e.setAttribute(k, atributos[k]); });
    return e;
  }

  var contadorId = 0;
  function idUnico() { contadorId += 1; return 'g' + contadorId; }

  // ---------- Gráfico de área ----------

  function graficoArea(pontos, cor) {
    var L = 320, A = 132, base = 108, topo = 12;
    var svg = svgNo('svg', {
      'class': 'grafico', viewBox: '0 0 ' + L + ' ' + A,
      preserveAspectRatio: 'none', role: 'img', height: '132'
    });
    svg.style.height = 'auto';

    if (pontos.length < 2) {
      svg.setAttribute('aria-label', 'Sem dados suficientes para o gráfico');
      return svg;
    }

    var valores = pontos.map(function (p) { return p.valor; });
    var min = Math.min.apply(null, valores);
    var max = Math.max.apply(null, valores);
    if (max === min) { max = min + 1; }
    var faixa = max - min;
    min -= faixa * 0.12;
    max += faixa * 0.12;

    function x(i) { return (i / (pontos.length - 1)) * L; }
    function y(v) { return base - ((v - min) / (max - min)) * (base - topo); }

    // Linhas de grade
    for (var g = 0; g <= 3; g++) {
      var yy = topo + ((base - topo) / 3) * g;
      svg.appendChild(svgNo('line', {
        x1: 0, y1: yy, x2: L, y2: yy,
        stroke: '#1B2531', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke'
      }));
    }

    var d = '';
    pontos.forEach(function (p, i) { d += (i ? 'L' : 'M') + x(i).toFixed(2) + ' ' + y(p.valor).toFixed(2) + ' '; });

    juntar(grad, p1, p2);
    defs.appendChild(grad);
    svg.appendChild(defs);

    svg.appendChild(svgNo('path', {
      d: d + 'L' + L + ' ' + base + ' L0 ' + base + ' Z',

  function rosca(segmentos, total, rotuloCentro) {
    var caixa = no('div', 'rosca-caixa');
    var raio = 56, largura = 20, centro = 70, circ = 2 * Math.PI * raio;

    var svg = svgNo('svg', { viewBox: '0 0 140 140', width: '168', height: '168', role: 'img' });
    svg.appendChild(svgNo('circle', {
      cx: centro, cy: centro, r: raio, fill: 'none',
      stroke: '#1B2531', 'stroke-width': largura
    }));

    var acumulado = 0;
    segmentos.forEach(function (s, i) {
      if (!s.valor || total <= 0) return;
      var fatia = (s.valor / total) * circ;
      var arco = svgNo('circle', {
        cx: centro, cy: centro, r: raio, fill: 'none',
        stroke: s.cor || CORES[i % CORES.length],
        'stroke-width': largura,
        'stroke-dasharray': Math.max(fatia - 2, 0.5) + ' ' + (circ - Math.max(fatia - 2, 0.5)),
        'stroke-dashoffset': -acumulado,
        'stroke-linecap': 'butt',
        transform: 'rotate(-90 ' + centro + ' ' + centro + ')'
      });
      svg.appendChild(arco);
      acumulado += fatia;
    });

    svg.setAttribute('aria-label', segmentos.map(function (s) {
      return s.nome + ' ' + Math.round(pct(s.valor, total)) + '%';
    }).join(', ') || 'Sem dados');

    caixa.appendChild(svg);

    var meio = no('div', 'rosca-centro');
    juntar(meio, no('div', 't', rotuloCentro || 'Total'), no('div', 'v', emReais(total)));
    caixa.appendChild(meio);

    return caixa;
  }

  var pilha = [];

  function iniciarNavegacao() {
    pilha = [];
    try {
      history.replaceState({ caixa: 'base' }, '');
      history.pushState({ caixa: 'app' }, '');
    } catch (e) { /* navegador sem history, o app segue */ }
  }

  function empilhar(item) {
    pilha.push(item);
    try { history.pushState({ caixa: pilha.length }, ''); } catch (e) { /* idem */ }
  }

  function topoEh(tipo) { return pilha.length > 0 && pilha[pilha.length - 1].tipo === tipo; }

  function voltarNavegacao() {
    if (pilha.length) { history.back(); return; }
    perguntarSaida();
  }

  function perguntarSaida() {
    if (confirm('Deseja sair do Caixa?')) {
      try { history.back(); } catch (e) { /* nada a fazer */ }
      return;
    }
    try { history.pushState({ caixa: 'app' }, ''); } catch (e) { /* idem */ }
  }

  function aoVoltar() {
    if (!pilha.length) { perguntarSaida(); return; }

    var item = pilha.pop();

    if (item.tipo === 'folha') { fecharFolhaEfeito(); if (sessao) desenhar(); return; }
    if (item.tipo === 'relatorio') { fecharRelatorioEfeito(); return; }
    if (item.tipo === 'entrada') { telaEntrada = item.anterior; montarEntrada(); return; }
    if (item.tipo === 'tela') { mostrarTela(item.anterior); return; }
    if (item.tipo === 'aba') { item.voltar(); return; }
  }

  function irEntrada(qual) {
    empilhar({ tipo: 'entrada', anterior: telaEntrada });
    telaEntrada = qual;
    montarEntrada();

    ['inicio', 'transacoes', 'investimentos', 'planejamento', 'mais'].forEach(function (t) {
      var el = $('tela' + t.charAt(0).toUpperCase() + t.slice(1));
      el.classList.toggle('ativa', t === id);
    });
    window.scrollTo(0, 0);
    desenhar();
  }

  function irPara(id) {
    if (id === telaAtiva) return;
    empilhar({ tipo: 'tela', anterior: telaAtiva });
    mostrarTela(id);
  }

  function cabecalho(titulo, subtitulo, comMes) {
    var c = no('div', 'cabecalho');
    var esquerda = no('div');
    esquerda.appendChild(no('h1', null, titulo));
    if (subtitulo) esquerda.appendChild(no('div', 'sub', subtitulo));
    c.appendChild(esquerda);

    if (comMes) {
      var sel = no('div', 'mes-seletor');
      var anterior = botao(null, '‹', function () { mudarMes(-1); });
      anterior.setAttribute('aria-label', 'Mês anterior');
      var rotulo = no('div', 'rotulo', MESES[mesAtivo.mes] + ' ' + mesAtivo.ano);
      var proximo = botao(null, '›', function () { mudarMes(1); });
      proximo.setAttribute('aria-label', 'Mês seguinte');
      juntar(sel, anterior, rotulo, proximo);
      c.appendChild(sel);
    }
    return c;
  }

  function mudarMes(passo) {
    var d = new Date(mesAtivo.ano, mesAtivo.mes + passo, 1);
    mesAtivo = { ano: d.getFullYear(), mes: d.getMonth() };
    desenhar();
  }

  function saudacao() {
    var h = new Date().getHours();
    if (h < 12) return 'Bom dia';
    if (h < 18) return 'Boa tarde';
    return 'Boa noite';
  }

  function mesAnteriorAo(ano, mes) {
    var d = new Date(ano, mes - 1, 1);
    return { ano: d.getFullYear(), mes: d.getMonth() };
  }

  // ---------- Empreendedor: cálculos ----------

  function servicosDoCliente(id) {
    return estado.servicos.filter(function (s) { return s.clienteId === id; })
      .sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
  }

  function pagamentosDoCliente(id) {
    return estado.pagamentos.filter(function (p) { return p.clienteId === id; })
      .sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
  }

  function resumoCliente(id) {
    var total = 0, pago = 0;
    estado.servicos.forEach(function (s) { if (s.clienteId === id) total += s.valor; });
    estado.pagamentos.forEach(function (p) { if (p.clienteId === id) pago += p.valor; });
    return { total: total, pago: pago, restante: total - pago };
  }

  function resumoGeralClientes() {
    var total = 0, pago = 0;
    estado.servicos.forEach(function (s) { total += s.valor; });
    estado.pagamentos.forEach(function (p) { pago += p.valor; });
    var atrasados = 0;
    var hoje = hojeTexto();
    estado.clientes.forEach(function (c) {
      var r = resumoCliente(c.id);
      if (r.restante > 0 && c.proximoPagamento && c.proximoPagamento < hoje) atrasados += 1;
    });
    return { total: total, pago: pago, restante: total - pago, atrasados: atrasados };
  }

  function situacaoCliente(cliente) {
    var r = resumoCliente(cliente.id);
    if (r.total === 0) return { classe: 'aberto', texto: 'sem serviço' };
    if (r.restante <= 0) return { classe: 'quitado', texto: 'quitado' };
    if (cliente.proximoPagamento && cliente.proximoPagamento < hojeTexto()) return { classe: 'atrasado', texto: 'atrasado' };
    return { classe: 'aberto', texto: 'em aberto' };
  }

  function proximoPagamentoGeral() {
    var datas = estado.clientes.filter(function (c) {
      return c.proximoPagamento && resumoCliente(c.id).restante > 0;
    }).map(function (c) { return c.proximoPagamento; }).sort();
    return datas.length ? datas[0] : '';
  }

  // ---------- Tela: Início ----------

  function desenharInicio() {
    var tela = $('telaInicio');
    tela.textContent = '';

    var nome = estado.perfil.nome;
    var hoje = new Date();
    var diaTexto = DIAS_SEMANA[hoje.getDay()].replace('-feira', '');
    diaTexto = diaTexto.charAt(0).toUpperCase() + diaTexto.slice(1);

    tela.appendChild(cabecalho(
      saudacao() + (nome ? ', ' + nome : ''),
      diaTexto + ', ' + hoje.getDate() + ' de ' + MESES[hoje.getMonth()],
      false
    ));

    tela.appendChild(segmentos([
      { valor: 'geral', rotulo: 'Visão geral' },
      { valor: 'empreendedor', rotulo: 'Empreendedor' }
    ], abaInicio, function (v) {
      if (v === abaInicio) return;
      var anterior = abaInicio;
      empilhar({ tipo: 'aba', voltar: function () { abaInicio = anterior; desenharInicio(); } });
      abaInicio = v;
      window.scrollTo(0, 0);
      desenharInicio();
    }));

    if (abaInicio === 'empreendedor') { desenharEmpreendedor(tela); return; }

    // Patrimônio
    var cPat = cartao();
    cPat.appendChild(no('div', 'rotulo', 'Patrimônio líquido'));
    cPat.appendChild(no('div', 'valorao num', emReais(patrimonio(null))));

    var fimMesPassado = ultimoDiaDoMes(mesAnteriorAo(hoje.getFullYear(), hoje.getMonth()).ano,
                                       mesAnteriorAo(hoje.getFullYear(), hoje.getMonth()).mes);
    cPat.appendChild(variacao(patrimonio(null), patrimonio(fimMesPassado)));
    cPat.appendChild(blocoGrafico(seriePatrimonio(30), '#E9B44C'));
    tela.appendChild(cPat);

    // KPIs do mês
    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);
    var ant = mesAnteriorAo(mesAtivo.ano, mesAtivo.mes);
    var tAnt = totaisDoMes(ant.ano, ant.mes);

    var kpis = no('div', 'kpis');
    kpis.appendChild(blocoKpi('Receitas', t.entradas, tAnt.entradas, 'verde'));
    kpis.appendChild(blocoKpi('Despesas', t.saidas, tAnt.saidas, 'vermelho'));
    kpis.appendChild(blocoKpi('Investido', totalInvestido(null), totalInvestido(fimMesPassado), 'ouro'));
    tela.appendChild(kpis);

    // Fluxo de caixa
    var cFluxo = cartao();
    cFluxo.appendChild(topoDeCartao('Fluxo de caixa', 'Ver todas', function () { irPara('transacoes'); }));
    cFluxo.appendChild(no('div', 'valorao pequeno num ' + (t.saldo >= 0 ? 'verde' : 'vermelho'), emReais(t.saldo)));
    cFluxo.appendChild(no('div', 'linha-nota', 'líquido em ' + MESES[mesAtivo.mes]));

    var barra = no('div', 'barra-dupla');
    barra.style.marginTop = '14px';
    var soma = t.entradas + t.saidas;
    var iE = no('i'); iE.style.width = pct(t.entradas, soma) + '%'; iE.style.background = 'var(--verde)';
    var iS = no('i'); iS.style.width = pct(t.saidas, soma) + '%'; iS.style.background = 'var(--vermelho)';
    juntar(barra, iE, iS);
    cFluxo.appendChild(barra);

    var duas = no('div', 'duas');
    duas.style.marginTop = '12px';
    duas.appendChild(parDeValores('Entradas', emReais(t.entradas), 'verde'));
    var dir = parDeValores('Saídas', emReais(t.saidas), 'vermelho');
    dir.style.textAlign = 'right';
    duas.appendChild(dir);
    cFluxo.appendChild(duas);
    tela.appendChild(cFluxo);

    // Distribuição de gastos
    var gastos = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);
    var cGastos = cartao();
    cGastos.appendChild(topoDeCartao('Distribuição de gastos', 'Relatório', function () { abrirRelatorio('fluxo'); }));
    if (!gastos.total) {
      cGastos.appendChild(estadoVazio('Sem gastos em ' + MESES[mesAtivo.mes], 'Os lançamentos de saída aparecem aqui divididos por categoria.'));
    } else {
      var seg = comCores(gastos.lista.slice(0, 6));
      var outros = gastos.lista.slice(6).reduce(function (s, c) { return s + c.valor; }, 0);
      if (outros > 0) seg.push({ nome: 'Demais', valor: outros, cor: '#4B5A6B' });
      cGastos.appendChild(rosca(seg, gastos.total, 'Gastos'));
      cGastos.appendChild(legenda(seg, gastos.total));
    }
    tela.appendChild(cGastos);

    // Contas
    var cContas = cartao('liso');
    var topoContas = topoDeCartao('Contas', '+ Nova', function () { abrirFolhaConta(null); });
    topoContas.style.padding = '16px 16px 0';
    topoContas.style.marginBottom = '8px';
    cContas.appendChild(topoContas);

    if (!estado.contas.length) {
      cContas.appendChild(estadoVazio('Nenhuma conta', 'Cadastre suas contas para acompanhar o saldo de cada uma.'));
    } else {
      estado.contas.forEach(function (c) {
        var linha = botao('linha', null, function () { abrirFolhaConta(c.id); });
        var s = saldoConta(c.id, null);
        juntar(linha,
          selo(c.cor, c.nome.charAt(0).toUpperCase()),
          juntar(no('div', 'linha-texto'),
            no('div', 'linha-titulo', c.nome),
            no('div', 'linha-sub', c.tipo)),
          juntar(no('div', 'linha-fim'),
            no('div', 'linha-valor num' + (s < 0 ? ' vermelho' : ''), emReais(s)))
        );
        cContas.appendChild(linha);
      });
      var totalLinha = no('div', 'linha');
      totalLinha.style.background = 'var(--cartao-2)';
      juntar(totalLinha,
        juntar(no('div', 'linha-texto'), no('div', 'linha-titulo suave', 'Total em contas')),
        juntar(no('div', 'linha-fim'), no('div', 'linha-valor num', emReais(totalEmContas(null))))
      );
      cContas.appendChild(totalLinha);
    }
    tela.appendChild(cContas);
  }

  // ---------- Empreendedor: tela ----------

  function desenharEmpreendedor(tela) {
    var geral = resumoGeralClientes();

    var cResumo = cartao();
    cResumo.appendChild(no('div', 'rotulo', 'A receber de todos os clientes'));
    cResumo.appendChild(no('div', 'valorao num ' + (geral.restante > 0 ? 'ouro' : 'verde'), emReais(geral.restante)));

    var barra = no('div', 'barra-dupla');
    barra.style.marginTop = '10px';
    var iPago = no('i');
    iPago.style.width = pct(geral.pago, geral.total) + '%';
    iPago.style.background = 'var(--verde)';
    var iFalta = no('i');
    iFalta.style.width = (geral.total > 0 ? 100 - pct(geral.pago, geral.total) : 0) + '%';
    iFalta.style.background = 'var(--ouro)';
    juntar(barra, iPago, iFalta);
    cResumo.appendChild(barra);

    var grade = no('div', 'resumo-grade');
    [['Total', geral.total, ''], ['Recebido', geral.pago, 'verde'], ['Falta', geral.restante, 'ouro']].forEach(function (item) {
      var d = no('div');
      d.appendChild(no('div', 'r', item[0]));
      d.appendChild(no('div', 'v ' + item[2], emReais(item[1])));
      grade.appendChild(d);
    });
    cResumo.appendChild(grade);

    var proxima = proximoPagamentoGeral();
    if (proxima) {
      cResumo.appendChild(no('div', 'linha-nota', 'Próximo pagamento previsto para ' + dataBr(proxima) + '.'));
    }
    if (geral.atrasados) {
      var alerta = no('div', 'linha-nota vermelho',
        geral.atrasados + ' cliente(s) com pagamento atrasado.');
      cResumo.appendChild(alerta);
    }
    tela.appendChild(cResumo);

    var cClientes = cartao('liso');
    var topo = topoDeCartao('Clientes', '+ Novo', function () { abrirFolhaCliente(null); });
    topo.style.padding = '16px 16px 0';
    topo.style.marginBottom = '8px';
    cClientes.appendChild(topo);

    if (!estado.clientes.length) {
      cClientes.appendChild(estadoVazio('Nenhum cliente ainda',
        'Cadastre quem contratou seu serviço para acompanhar o que já foi pago e o que falta receber.'));
      var b = botao('btn btn-ouro', 'Cadastrar primeiro cliente', function () { abrirFolhaCliente(null); });
      b.style.margin = '0 16px 18px';
      b.style.width = 'calc(100% - 32px)';
      cClientes.appendChild(b);
    } else {
      estado.clientes.slice().sort(function (a, b) {
        return resumoCliente(b.id).restante - resumoCliente(a.id).restante;
      }).forEach(function (c) {
        var r = resumoCliente(c.id);
        var sit = situacaoCliente(c);
        var linha = botao('linha', null, function () { abrirFichaCliente(c.id); });

        var texto = no('div', 'linha-texto');
        var titulo = no('div', 'linha-titulo', c.nome);
        texto.appendChild(titulo);
        var sub = no('div', 'linha-sub');
        sub.appendChild(document.createTextNode(
          servicosDoCliente(c.id).length + ' serviço(s)' + (c.telefone ? ' · ' + c.telefone : '')));
        texto.appendChild(sub);

        var fim = no('div', 'linha-fim');
        fim.appendChild(no('div', 'linha-valor num ' + (r.restante > 0 ? 'ouro' : 'verde'), emReais(r.restante)));
        var etiqueta = no('span', 'etiqueta ' + sit.classe, sit.texto);
        fim.appendChild(etiqueta);

        juntar(linha, selo(sit.classe === 'quitado' ? '#34D399' : sit.classe === 'atrasado' ? '#F87171' : '#E9B44C',
          c.nome.charAt(0).toUpperCase()), texto, fim);
        cClientes.appendChild(linha);
      });
    }
    tela.appendChild(cClientes);
  }

  // ---------- Empreendedor: folhas ----------

  function abrirFolhaCliente(id) {
    var existente = id ? achar(estado.clientes, id) : null;
    if (id && !existente) return;

    abrirFolha(existente ? 'Editar cliente' : 'Novo cliente', function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Nome do cliente', 60);
      forma.appendChild(campo('Nome', campoNome));

      var campoTelefone = entradaTexto(existente ? existente.telefone : '', '(51) 90000-0000', 30);
      campoTelefone.type = 'tel';
      campoTelefone.inputMode = 'tel';
      forma.appendChild(campo('Telefone', campoTelefone));

      var campoProximo = entradaData(existente && existente.proximoPagamento ? existente.proximoPagamento : '');
      campoProximo.value = existente ? existente.proximoPagamento : '';
      forma.appendChild(campo('Próximo pagamento previsto', campoProximo));

      var campoObs = entradaTexto(existente ? existente.obs : '', 'Anotação (opcional)', 200);
      forma.appendChild(campo('Observação', campoObs));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = campoNome.value.trim();
        if (!nome) { mostrarErro(forma, 'Escreva o nome do cliente.'); return; }

        if (existente) {
          existente.nome = nome;
          existente.telefone = campoTelefone.value.trim();
          existente.proximoPagamento = ehData(campoProximo.value) ? campoProximo.value : '';
          existente.obs = campoObs.value.trim();
        } else {
          estado.clientes.push({
            id: novoId(), nome: nome, telefone: campoTelefone.value.trim(),
            obs: campoObs.value.trim(),
            proximoPagamento: ehData(campoProximo.value) ? campoProximo.value : '',
            criadoEm: Date.now()
          });
        }
        salvar();
        fecharFolha();
        desenhar();
        avisar(existente ? 'Cliente atualizado.' : 'Cliente cadastrado.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir cliente', function () {
          var quantos = servicosDoCliente(existente.id).length + pagamentosDoCliente(existente.id).length;
          if (!confirm('Excluir ' + existente.nome + ' e seus ' + quantos + ' registro(s)? Não dá para desfazer.')) return;
          estado.servicos = estado.servicos.filter(function (s) { return s.clienteId !== existente.id; });
          estado.pagamentos = estado.pagamentos.filter(function (p) { return p.clienteId !== existente.id; });
          estado.clientes = estado.clientes.filter(function (c) { return c.id !== existente.id; });
          salvar();
          fecharFolha();
          desenhar();
          avisar('Cliente excluído.');
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  var abaFicha = 'servicos';

  function abrirFichaCliente(id) {
    var cliente = achar(estado.clientes, id);
    if (!cliente) return;
    abaFicha = 'servicos';
    montarFichaCliente(id);
  }

  function montarFichaCliente(id) {
    var cliente = achar(estado.clientes, id);
    if (!cliente) { fecharFolha(); return; }
    var r = resumoCliente(id);

    abrirFolha(cliente.nome, function (folha) {
      if (cliente.telefone) {
        var tel = no('p', 'linha-sub', cliente.telefone);
        tel.style.textAlign = 'center';
        tel.style.marginTop = '-10px';
        folha.appendChild(tel);
      }

      var cResumo = cartao();
      var grade = no('div', 'resumo-grade');
      grade.style.marginTop = '0';
      [['Total', r.total, ''], ['Pago', r.pago, 'verde'], ['Falta', r.restante, r.restante > 0 ? 'ouro' : 'verde']].forEach(function (item) {
        var d = no('div');
        d.appendChild(no('div', 'r', item[0]));
        d.appendChild(no('div', 'v ' + item[2], emReais(item[1])));
        grade.appendChild(d);
      });
      cResumo.appendChild(grade);
      cResumo.appendChild(progresso(r.pago, r.total || 1, 'var(--verde)'));
      if (cliente.proximoPagamento && r.restante > 0) {
        cResumo.appendChild(no('div', 'linha-nota',
          'Próximo pagamento previsto para ' + dataBr(cliente.proximoPagamento) +
          (cliente.proximoPagamento < hojeTexto() ? ' — atrasado.' : '.')));
      }
      if (cliente.obs) cResumo.appendChild(no('div', 'linha-nota', cliente.obs));
      folha.appendChild(cResumo);

      var abas = no('div', 'aba-cliente');
      [['servicos', 'Serviços'], ['pagamentos', 'Pagamentos']].forEach(function (a) {
        var b = botao(null, a[1], function () {
          if (abaFicha === a[0]) return;
          abaFicha = a[0];
          montarFichaCliente(id);
        });
        b.setAttribute('aria-selected', abaFicha === a[0] ? 'true' : 'false');
        abas.appendChild(b);
      });
      folha.appendChild(abas);

      var lista = cartao('liso');
      if (abaFicha === 'servicos') {
        var servicos = servicosDoCliente(id);
        if (!servicos.length) {
          lista.appendChild(estadoVazio('Nenhum serviço', 'Cadastre o que foi feito e o valor combinado.'));
        } else {
          servicos.forEach(function (s) {
            var linha = botao('linha', null, function () { abrirFolhaServico(id, s.id); });
            juntar(linha,
              selo('#E9B44C', '#'),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', s.nome),
                no('div', 'linha-sub', dataBr(s.data) + (s.obs ? ' · ' + s.obs : ''))),
              juntar(no('div', 'linha-fim'), no('div', 'linha-valor num', emReais(s.valor)))
            );
            lista.appendChild(linha);
          });
        }
      } else {
        var pagamentos = pagamentosDoCliente(id);
        if (!pagamentos.length) {
          lista.appendChild(estadoVazio('Nenhum pagamento', 'Registre cada valor recebido com a data.'));
        } else {
          pagamentos.forEach(function (p) {
            var servico = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
            var linha = botao('linha', null, function () { abrirFolhaPagamento(id, p.id); });
            juntar(linha,
              selo('#34D399', '✓'),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', dataBr(p.data)),
                no('div', 'linha-sub', servico ? servico.nome : 'Pagamento' + (p.lancamentoId ? ' · lançado no caixa' : ''))),
              juntar(no('div', 'linha-fim'), no('div', 'linha-valor num verde', '+ ' + emReais(p.valor)))
            );
            lista.appendChild(linha);
          });
        }
      }
      folha.appendChild(lista);

      var acoes = no('div', 'acoes');
      if (abaFicha === 'servicos') {
        acoes.appendChild(botao('btn btn-ouro', '+ Novo serviço', function () { abrirFolhaServico(id, null); }));
      } else {
        acoes.appendChild(botao('btn btn-ouro', '+ Registrar pagamento', function () { abrirFolhaPagamento(id, null); }));
      }
      acoes.appendChild(botao('btn btn-fantasma', 'Editar cliente', function () {
        empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(id); } });
        abrirFolhaCliente(id);
      }));
      folha.appendChild(acoes);
    });
  }

  function abrirFolhaServico(clienteId, servicoId) {
    var existente = servicoId ? achar(estado.servicos, servicoId) : null;
    empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });

    abrirFolha(existente ? 'Editar serviço' : 'Novo serviço', function (folha) {
      var forma = no('div');

      var campoValorEl = entradaValor(existente ? existente.valor : 0, true);
      campoValorEl.style.color = 'var(--ouro)';
      forma.appendChild(campo('Valor do serviço', campoValorEl));

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Ex.: Troca de embreagem', 60);
      forma.appendChild(campo('Qual serviço', campoNome));

      var campoData = entradaData(existente ? existente.data : hojeTexto());
      forma.appendChild(campo('Data', campoData));

      var campoObs = entradaTexto(existente ? existente.obs : '', 'Observação (opcional)', 200);
      forma.appendChild(campo('Observação', campoObs));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        var nome = campoNome.value.trim();
        if (valor <= 0) { mostrarErro(forma, 'Informe o valor do serviço.'); return; }
        if (!nome) { mostrarErro(forma, 'Escreva qual foi o serviço.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }

        if (existente) {
          existente.nome = nome;
          existente.valor = valor;
          existente.data = campoData.value;
          existente.obs = campoObs.value.trim();
        } else {
          estado.servicos.push({
            id: novoId(), clienteId: clienteId, nome: nome, valor: valor,
            data: campoData.value, obs: campoObs.value.trim(), criadoEm: Date.now()
          });
        }
        salvar();
        voltarNavegacao();
        avisar(existente ? 'Serviço atualizado.' : 'Serviço cadastrado.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir serviço', function () {
          if (!confirm('Excluir este serviço?')) return;
          estado.servicos = estado.servicos.filter(function (s) { return s.id !== existente.id; });
          estado.pagamentos.forEach(function (p) { if (p.servicoId === existente.id) p.servicoId = ''; });
          salvar();
          voltarNavegacao();
          avisar('Serviço excluído.');
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  function abrirFolhaPagamento(clienteId, pagamentoId) {
    var existente = pagamentoId ? achar(estado.pagamentos, pagamentoId) : null;
    var r = resumoCliente(clienteId);
    var servicos = servicosDoCliente(clienteId);
    var lancarNoCaixa = !existente;
    empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });

    abrirFolha(existente ? 'Editar pagamento' : 'Registrar pagamento', function (folha) {
      var forma = no('div');

      var campoValorEl = entradaValor(existente ? existente.valor : 0, true);
      campoValorEl.style.color = 'var(--verde)';
      forma.appendChild(campo('Valor recebido', campoValorEl));

      if (!existente && r.restante > 0) {
        var atalhos = no('div', 'chips');
        atalhos.appendChild(botao('chip', 'Tudo: ' + emReais(r.restante), function () {
          campoValorEl.value = emReais(r.restante);
        }));
        atalhos.appendChild(botao('chip', 'Metade', function () {
          campoValorEl.value = emReais(Math.round(r.restante / 2));
        }));
        forma.appendChild(campo('Falta ' + emReais(r.restante), atalhos));
      }

      var campoData = entradaData(existente ? existente.data : hojeTexto());
      forma.appendChild(campo('Data do pagamento', campoData));

      var opcoesServico = [{ valor: '', rotulo: 'Sem serviço específico' }].concat(
        servicos.map(function (s) { return { valor: s.id, rotulo: s.nome + ' — ' + emReais(s.valor) }; }));
      var campoServico = entradaSelecao(opcoesServico, existente ? existente.servicoId : '');
      forma.appendChild(campo('Referente a', campoServico));

      var campoConta = null;
      if (!existente && estado.contas.length) {
        var marcar = botao('lembrar', null, function () {
          lancarNoCaixa = !lancarNoCaixa;
          marcar.setAttribute('aria-pressed', lancarNoCaixa ? 'true' : 'false');
          marcar.querySelector('.caixinha').textContent = lancarNoCaixa ? '✓' : '';
          campoConta.parentNode.style.display = lancarNoCaixa ? '' : 'none';
        });
        marcar.setAttribute('aria-pressed', 'true');
        marcar.style.marginBottom = '14px';
        marcar.appendChild(no('span', 'caixinha', '✓'));
        marcar.appendChild(no('span', null, 'Lançar como entrada no caixa'));
        forma.appendChild(marcar);

        campoConta = entradaSelecao(opcoesDeConta(), estado.contas[0].id);
        forma.appendChild(campo('Entrou em qual conta', campoConta));
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        if (valor <= 0) { mostrarErro(forma, 'Informe o valor recebido.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }

        var cliente = achar(estado.clientes, clienteId);

        if (existente) {
          existente.valor = valor;
          existente.data = campoData.value;
          existente.servicoId = campoServico.value;
        } else {
          var lancamentoId = '';
          if (lancarNoCaixa && campoConta) {
            lancamentoId = novoId();
            var servico = campoServico.value ? achar(estado.servicos, campoServico.value) : null;
            estado.lancamentos.push({
              id: lancamentoId,
              tipo: 'entrada',
              valor: valor,
              descricao: (cliente ? cliente.nome : 'Cliente') + (servico ? ' — ' + servico.nome : ''),
              categoria: 'Serviços',
              data: campoData.value,
              contaId: campoConta.value,
              contaDestinoId: '',
              criadoEm: Date.now()
            });
          }
          estado.pagamentos.push({
            id: novoId(), clienteId: clienteId, servicoId: campoServico.value,
            valor: valor, data: campoData.value, lancamentoId: lancamentoId, criadoEm: Date.now()
          });
        }

        salvar();
        voltarNavegacao();
        avisar(existente ? 'Pagamento atualizado.' : 'Pagamento registrado.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir pagamento', function () {
          if (!confirm('Excluir este pagamento?')) return;
          if (existente.lancamentoId) {
            estado.lancamentos = estado.lancamentos.filter(function (l) { return l.id !== existente.lancamentoId; });
          }
          estado.pagamentos = estado.pagamentos.filter(function (p) { return p.id !== existente.id; });
          salvar();
          voltarNavegacao();
          avisar('Pagamento excluído.');
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  function blocoKpi(rotulo, valor, anterior, classeCor) {
    var k = no('div', 'kpi');
    k.appendChild(no('div', 'rotulo', rotulo));
    k.appendChild(no('div', 'n num ' + classeCor, emReais(valor)));

  // ---------- Tela: Transações ----------

  function desenharTransacoes() {
    var tela = $('telaTransacoes');
    tela.textContent = '';
    tela.appendChild(cabecalho('Transações', null, true));

    var busca = no('div', 'busca');
    busca.appendChild(no('span', 'lupa', '⌕'));
    var campo = no('input');

    campo.placeholder = 'Buscar por descrição ou categoria';

    ], filtroTransacoes, function (v) { filtroTransacoes = v; desenharTransacoes(); }));

    var container = no('div');

    tela.appendChild(container);
    desenharListaTransacoes();
