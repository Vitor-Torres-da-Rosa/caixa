  function desenharListaTransacoes() {
    var alvo = $('listaTransacoes');
    if (!alvo) return;
    alvo.textContent = '';

    var termo = buscaTransacoes.trim().toLowerCase();
    var itens = lancamentosDoMes(mesAtivo.ano, mesAtivo.mes).filter(function (l) {
      if (filtroTransacoes !== 'todas' && l.tipo !== filtroTransacoes) return false;
      if (!termo) return true;
      return (l.descricao + ' ' + l.categoria).toLowerCase().indexOf(termo) >= 0;
    });

    if (!itens.length) {
      var c = cartao('liso');
      c.appendChild(estadoVazio(
        termo ? 'Nada encontrado' : 'Nenhum lançamento',
        termo ? 'Tente outro termo de busca.' : 'Toque no + para registrar o primeiro movimento de ' + MESES[mesAtivo.mes] + '.'
      ));
      alvo.appendChild(c);
      return;
    }

    var porDia = {};
    itens.forEach(function (l) { (porDia[l.data] = porDia[l.data] || []).push(l); });

    Object.keys(porDia).sort().reverse().forEach(function (data) {
      var doDia = porDia[data].slice().sort(function (a, b) { return (b.criadoEm || 0) - (a.criadoEm || 0); });
      var totalDia = doDia.reduce(function (s, l) {
        return s + (l.tipo === 'entrada' ? l.valor : l.tipo === 'saida' ? -l.valor : 0);
      }, 0);

      var cab = no('div', 'dia-cabecalho');
      juntar(cab, no('div', 'dia-nome', nomeDoDia(data)), no('div', 'dia-total num', comSinal(totalDia)));
      alvo.appendChild(cab);

      var cartaoDia = cartao('liso');
      doDia.forEach(function (l) { cartaoDia.appendChild(linhaLancamento(l)); });
      alvo.appendChild(cartaoDia);
    });

    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);
    var resumo = cartao();
    resumo.style.marginTop = '16px';
    var linhaResumo = no('div', 'cartao-topo');
    linhaResumo.style.marginBottom = '0';
    juntar(linhaResumo,
      no('div', 'cartao-titulo', 'Saldo do período'),
      no('div', 'linha-valor num ' + (t.saldo >= 0 ? 'verde' : 'vermelho'), emReais(t.saldo))
    );
    resumo.appendChild(linhaResumo);
    alvo.appendChild(resumo);
  }

  function linhaLancamento(l) {
    var b = botao('linha', null, function () { abrirFolhaLancamento(l.id); });
    var cor = l.tipo === 'entrada' ? '#34D399' : l.tipo === 'saida' ? '#F87171' : '#60A5FA';
    var sinal = l.tipo === 'entrada' ? '+' : l.tipo === 'saida' ? '−' : '⇄';

    var sub;
    if (l.tipo === 'transferencia') {
      var origem = achar(estado.contas, l.contaId);
      var destino = achar(estado.contas, l.contaDestinoId);
      sub = (origem ? origem.nome : '—') + ' → ' + (destino ? destino.nome : '—');
    } else {
      var conta = achar(estado.contas, l.contaId);
      sub = l.categoria + (conta ? ' · ' + conta.nome : '');
    }

    juntar(b,
      selo(cor, sinal),
      juntar(no('div', 'linha-texto'),
        no('div', 'linha-titulo', l.descricao || (l.tipo === 'transferencia' ? 'Transferência' : l.categoria)),
        no('div', 'linha-sub', sub)),
      juntar(no('div', 'linha-fim'),
        no('div', 'linha-valor num ' + (l.tipo === 'entrada' ? 'verde' : l.tipo === 'saida' ? 'vermelho' : ''),
          (l.tipo === 'entrada' ? '+ ' : l.tipo === 'saida' ? '− ' : '') + emReais(l.valor)))
    );
    return b;
  }

  // ---------- Tela: Investimentos ----------

  function desenharInvestimentos() {
    var tela = $('telaInvestimentos');
    tela.textContent = '';
    tela.appendChild(cabecalho('Investimentos', null, false));

    var total = totalInvestido(null);
    var aplicado = totalAplicado();

    var cTotal = cartao();
    var topo = no('div', 'cartao-topo');
    juntar(topo, no('div', 'rotulo', 'Total investido'),
      botao('cartao-acao', '+ Novo ativo', function () { abrirFolhaAtivo(null); }));
    cTotal.appendChild(topo);
    cTotal.appendChild(no('div', 'valorao num', emReais(total)));

    if (aplicado > 0) {
      var lucro = total - aplicado;
      var v = no('div', 'variacao ' + (lucro >= 0 ? 'sobe' : 'desce'));
      v.appendChild(no('span', null, (lucro >= 0 ? '↑ ' : '↓ ') +
        Math.abs((lucro / aplicado) * 100).toFixed(2).replace('.', ',') + '%'));
      v.appendChild(no('span', 'resto', '(' + comSinal(lucro) + ' sobre ' + emReais(aplicado) + ')'));
      cTotal.appendChild(v);
    }
    cTotal.appendChild(blocoGrafico(serieInvestimentos(30), '#E9B44C'));
    tela.appendChild(cTotal);

    if (!estado.ativos.length) {
      var vazio = cartao('liso');
      vazio.appendChild(estadoVazio('Nenhum ativo cadastrado',
        'Cadastre o que você tem investido para acompanhar rentabilidade e alocação.'));
      var b = botao('btn btn-ouro', 'Cadastrar primeiro ativo', function () { abrirFolhaAtivo(null); });
      b.style.margin = '0 16px 18px';
      b.style.width = 'calc(100% - 32px)';
      vazio.appendChild(b);
      tela.appendChild(vazio);
      return;
    }

    tela.appendChild(segmentos([
      { valor: 'alocacao', rotulo: 'Alocação' },
      { valor: 'ativos', rotulo: 'Ativos' },
      { valor: 'rentabilidade', rotulo: 'Rentabilidade' }
    ], abaInvestimentos, function (v) { abaInvestimentos = v; desenharInvestimentos(); }));

    if (abaInvestimentos === 'alocacao') {
      var aloc = alocacaoPorClasse();
      var c = cartao();
      c.appendChild(no('div', 'cartao-titulo', 'Alocação por classe'));
      var seg = comCores(aloc.lista);
      c.appendChild(rosca(seg, aloc.total, 'Carteira'));
      c.appendChild(legenda(seg, aloc.total));
      tela.appendChild(c);
    } else if (abaInvestimentos === 'ativos') {
      var lista = cartao('liso');
      estado.ativos.slice().sort(function (a, b) { return valorAtivo(b) - valorAtivo(a); }).forEach(function (a) {
        var atual = valorAtivo(a);
        var rend = a.aplicado > 0 ? ((atual - a.aplicado) / a.aplicado) * 100 : 0;
        var linha = botao('linha', null, function () { abrirFolhaAtivo(a.id); });
        juntar(linha,
          selo(CORES[CLASSES_ATIVO.indexOf(a.classe) % CORES.length], a.nome.charAt(0).toUpperCase()),
          juntar(no('div', 'linha-texto'),
            no('div', 'linha-titulo', a.nome),
            no('div', 'linha-sub', a.classe)),
          juntar(no('div', 'linha-fim'),
            no('div', 'linha-valor num', emReais(atual)),
            no('div', 'linha-nota num ' + (rend >= 0 ? 'verde' : 'vermelho'),
              (rend >= 0 ? '↑ ' : '↓ ') + Math.abs(rend).toFixed(2).replace('.', ',') + '%'))
        );
        lista.appendChild(linha);
      });
      tela.appendChild(lista);
    } else {
      var cR = cartao();
      cR.appendChild(no('div', 'cartao-titulo', 'Rentabilidade da carteira'));
      var lucroTotal = total - aplicado;
      cR.appendChild(no('div', 'valorao pequeno num ' + (lucroTotal >= 0 ? 'verde' : 'vermelho'), comSinal(lucroTotal)));
      cR.appendChild(no('div', 'linha-nota',
        aplicado > 0
          ? 'sobre ' + emReais(aplicado) + ' aplicados (' +
            ((lucroTotal / aplicado) * 100).toFixed(2).replace('.', ',') + '%)'
          : 'informe o valor aplicado nos ativos para calcular'));

      var tabela = no('div');
      tabela.style.marginTop = '14px';
      estado.ativos.slice().sort(function (a, b) {
        var ra = a.aplicado > 0 ? (valorAtivo(a) - a.aplicado) / a.aplicado : 0;
        var rb = b.aplicado > 0 ? (valorAtivo(b) - b.aplicado) / b.aplicado : 0;
        return rb - ra;
      }).forEach(function (a) {
        var atual = valorAtivo(a);
        var lucro = atual - a.aplicado;
        var rend = a.aplicado > 0 ? (lucro / a.aplicado) * 100 : 0;
        var item = no('div', 'legenda-item');
        item.style.padding = '9px 0';
        item.style.borderTop = '1px solid var(--borda)';
        juntar(item,
          no('span', 'nome', a.nome),
          no('span', 'val num ' + (lucro >= 0 ? 'verde' : 'vermelho'), comSinal(lucro)),
          no('span', 'pct num', (rend >= 0 ? '+' : '−') + Math.abs(rend).toFixed(1).replace('.', ',') + '%')
        );
        tabela.appendChild(item);
      });
      cR.appendChild(tabela);
      tela.appendChild(cR);
    }
  }

  // ---------- Tela: Planejamento ----------

  function desenharPlanejamento() {
    var tela = $('telaPlanejamento');
    tela.textContent = '';
    tela.appendChild(cabecalho('Planejamento', null, true));

    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);
    var gastos = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);

    // Orçamento mensal
    var cOrc = cartao();
    cOrc.appendChild(topoDeCartao('Orçamento mensal', 'Editar', function () { abrirFolhaOrcamento(); }));
    if (!estado.orcamentos.geral) {
      cOrc.appendChild(no('p', 'linha-sub', 'Defina um teto de gastos para o mês e acompanhe o quanto já foi usado.'));
      var bDef = botao('btn btn-fantasma', 'Definir orçamento', function () { abrirFolhaOrcamento(); });
      bDef.style.marginTop = '12px';
      cOrc.appendChild(bDef);
    } else {
      var usado = pct(t.saidas, estado.orcamentos.geral);
      var linhaOrc = no('div', 'cartao-topo');
      linhaOrc.style.marginBottom = '8px';
      juntar(linhaOrc,
        no('div', 'linha-valor num', emReais(t.saidas) + ' / ' + emReais(estado.orcamentos.geral)),
        no('div', 'linha-valor num ' + (usado > 100 ? 'vermelho' : usado > 80 ? 'ouro' : 'verde'),
          Math.round(usado) + '%')
      );
      cOrc.appendChild(linhaOrc);
      cOrc.appendChild(progresso(t.saidas, estado.orcamentos.geral,
        usado > 100 ? 'var(--vermelho)' : usado > 80 ? 'var(--ouro)' : 'var(--verde)'));
      var restante = estado.orcamentos.geral - t.saidas;
      cOrc.appendChild(no('div', 'linha-nota',
        restante >= 0 ? 'Restam ' + emReais(restante) + ' neste mês' : 'Você passou ' + emReais(-restante) + ' do orçamento'));
    }
    tela.appendChild(cOrc);

    // Orçamento por categoria
    var chaves = Object.keys(estado.orcamentos.categorias);
    if (chaves.length) {
      var cCat = cartao();
      cCat.appendChild(topoDeCartao('Por categoria', 'Editar', function () { abrirFolhaOrcamento(); }));
      chaves.sort().forEach(function (nomeCat) {
        var teto = estado.orcamentos.categorias[nomeCat];
        var gasto = 0;
        gastos.lista.forEach(function (g) { if (g.nome === nomeCat) gasto = g.valor; });
        var usadoCat = pct(gasto, teto);
        var bloco = no('div');
        bloco.style.marginBottom = '13px';
        var topoCat = no('div', 'legenda-item');
        topoCat.style.marginBottom = '6px';
        juntar(topoCat,
          no('span', 'nome', nomeCat),
          no('span', 'val num', emReais(gasto) + ' / ' + emReais(teto))
        );
        bloco.appendChild(topoCat);
        bloco.appendChild(progresso(gasto, teto,
          usadoCat > 100 ? 'var(--vermelho)' : usadoCat > 80 ? 'var(--ouro)' : 'var(--verde)'));
        cCat.appendChild(bloco);
      });
      tela.appendChild(cCat);
    }

    // Metas
    var cMetas = cartao();
    cMetas.appendChild(topoDeCartao('Metas financeiras', '+ Nova', function () { abrirFolhaMeta(null); }));
    if (!estado.metas.length) {
      cMetas.appendChild(no('p', 'linha-sub', 'Crie metas como uma viagem, um carro ou uma reserva e acompanhe o progresso.'));
    } else {
      estado.metas.forEach(function (m) {
        var bloco = botao(null, null, function () { abrirFolhaMeta(m.id); });
        bloco.style.display = 'block';
        bloco.style.width = '100%';
        bloco.style.textAlign = 'left';
        bloco.style.marginBottom = '15px';

        var topoMeta = no('div', 'legenda-item');
        topoMeta.style.marginBottom = '5px';
        juntar(topoMeta,
          no('span', 'nome', m.nome),
          no('span', 'pct num', Math.round(pct(m.guardado, m.alvo)) + '%')
        );
        bloco.appendChild(topoMeta);
        bloco.appendChild(progresso(m.guardado, m.alvo, 'var(--ouro)'));
        var nota = no('div', 'linha-nota', emReais(m.guardado) + ' de ' + emReais(m.alvo) +
          (m.prazo ? ' · até ' + dataBr(m.prazo) : ''));
        nota.style.marginTop = '5px';
        bloco.appendChild(nota);
        cMetas.appendChild(bloco);
      });
    }
    tela.appendChild(cMetas);

    // Reserva de emergência
    var media = mediaDespesas(3);
    var ideal = media * estado.perfil.reservaMeses;
    var guardado = Math.max(totalEmContas(null), 0);
    var cRes = cartao();
    cRes.appendChild(topoDeCartao('Reserva de emergência', 'Ajustar', function () { abrirFolhaReserva(); }));
    if (!ideal) {
      cRes.appendChild(no('p', 'linha-sub', 'Registre suas despesas por um mês para calcularmos a reserva ideal.'));
    } else {
      var linhaRes = no('div', 'cartao-topo');
      linhaRes.style.marginBottom = '8px';
      juntar(linhaRes,
        no('div', 'linha-valor num', emReais(guardado) + ' / ' + emReais(ideal)),
        no('div', 'linha-valor num ouro', Math.round(pct(guardado, ideal)) + '%')
      );
      cRes.appendChild(linhaRes);
      cRes.appendChild(progresso(guardado, ideal, 'var(--ouro)'));
      cRes.appendChild(no('div', 'linha-nota',
        estado.perfil.reservaMeses + ' meses de despesa, com média de ' + emReais(media) + ' por mês. ' +
        'Contamos o saldo das suas contas como reserva.'));
    }
    tela.appendChild(cRes);

    // Aposentadoria
    var p = estado.perfil;
    var anos = Math.max(0, p.idadeAposentadoria - p.idadeAtual);
    var meses = anos * 12;
    var taxaMes = Math.pow(1 + p.rendimentoAnual / 100, 1 / 12) - 1;
    var atual = patrimonio(null);
    var futuro;
    if (taxaMes > 0) {
      futuro = atual * Math.pow(1 + taxaMes, meses) +
        p.aporteMensal * ((Math.pow(1 + taxaMes, meses) - 1) / taxaMes);
    } else {
      futuro = atual + p.aporteMensal * meses;
    }
    futuro = Math.round(futuro);

    var cApos = cartao();
    cApos.appendChild(topoDeCartao('Aposentadoria', 'Ajustar', function () { abrirFolhaAposentadoria(); }));
    cApos.appendChild(no('div', 'rotulo', 'Projeção aos ' + p.idadeAposentadoria + ' anos'));
    cApos.appendChild(no('div', 'valorao pequeno num ouro', emReais(futuro)));
    cApos.appendChild(no('div', 'linha-nota',
      anos + ' anos de aporte, ' + emReais(p.aporteMensal) + ' por mês, a ' +
      String(p.rendimentoAnual).replace('.', ',') + '% ao ano.'));
    var renda = Math.round(futuro * 0.04 / 12);
    cApos.appendChild(no('div', 'linha-nota',
      'Renda estimada de ' + emReais(renda) + ' por mês, retirando 4% ao ano.'));
    tela.appendChild(cApos);
  }

  // ---------- Análises calculadas ----------

  function normalizar(descricao) {
    return descricao.toLowerCase().replace(/\d+/g, '').replace(/[^a-zà-ú ]/gi, '').trim();
  }

  // Só categorias em que faz sentido sugerir corte: aluguel e imposto não se cancela.
  var CANCELAVEIS = ['Assinaturas', 'Lazer', 'Educação', 'Alimentação', 'Outros'];

  function assinaturasProvaveis() {
    var grupos = {};
    estado.lancamentos.forEach(function (l) {
      if (l.tipo !== 'saida' || !l.descricao) return;
      if (CANCELAVEIS.indexOf(l.categoria) < 0) return;
      var chave = normalizar(l.descricao) + '|' + l.valor;
      if (!chave.trim()) return;
      (grupos[chave] = grupos[chave] || []).push(l);
    });

    var achados = [];
    Object.keys(grupos).forEach(function (chave) {
      var itens = grupos[chave];
      var meses = {};
      itens.forEach(function (l) { meses[l.data.slice(0, 7)] = true; });
      if (Object.keys(meses).length >= 2) {
        achados.push({ descricao: itens[0].descricao, valor: itens[0].valor, vezes: Object.keys(meses).length });
      }
    });
    return achados.sort(function (a, b) { return b.valor - a.valor; });
  }

  function gerarAnalises() {
    var lista = [];
    var ant = mesAnteriorAo(mesAtivo.ano, mesAtivo.mes);
    var atual = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);
    var anterior = gastosPorCategoria(ant.ano, ant.mes);
    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);

    var mapaAnterior = {};
    anterior.lista.forEach(function (c) { mapaAnterior[c.nome] = c.valor; });

    // Maior queda e maior alta por categoria
    var quedas = [], altas = [];
    atual.lista.forEach(function (c) {
      var base = mapaAnterior[c.nome];
      if (!base) return;
      var dif = c.valor - base;
      var p = (dif / base) * 100;
      if (p <= -8) quedas.push({ nome: c.nome, p: p, dif: dif });
      if (p >= 8) altas.push({ nome: c.nome, p: p, dif: dif });
    });
    quedas.sort(function (a, b) { return a.p - b.p; });
    altas.sort(function (a, b) { return b.p - a.p; });

    if (quedas.length) {
      var q = quedas[0];
      lista.push({
        tom: 'bom', pino: '↓', cor: 'var(--verde)', titulo: 'Boa!',
        texto: 'Seus gastos com ' + q.nome.toLowerCase() + ' caíram ' +
          Math.abs(q.p).toFixed(0) + '% em ' + MESES[mesAtivo.mes] + ' comparado ao mês anterior.',
        destaque: 'Economia de ' + emReais(-q.dif), destaqueCor: 'var(--verde)'
      });
    }

    if (altas.length) {
      var a = altas[0];
      lista.push({
        tom: 'atencao', pino: '!', cor: 'var(--ouro)', titulo: 'Atenção',
        texto: 'Seus gastos com ' + a.nome.toLowerCase() + ' subiram ' +
          a.p.toFixed(0) + '% em relação ao mês anterior.',
        destaque: 'Aumento de ' + emReais(a.dif), destaqueCor: 'var(--vermelho)'
      });
    }

    var assinaturas = assinaturasProvaveis();
    if (assinaturas.length) {
      var somaAss = assinaturas.reduce(function (s, x) { return s + x.valor; }, 0);
      lista.push({
        tom: 'oportunidade', pino: '◇', cor: 'var(--roxo)', titulo: 'Oportunidade',
        texto: 'Encontramos ' + assinaturas.length + ' cobrança(s) que se repetem todo mês: ' +
          assinaturas.slice(0, 4).map(function (x) { return x.descricao; }).join(', ') +
          '. Cancelar o que você não usa libera esse valor.',
        destaque: 'Até ' + emReais(somaAss) + ' por mês', destaqueCor: 'var(--roxo)'
      });
    }

    if (t.entradas > 0) {
      var taxa = ((t.entradas - t.saidas) / t.entradas) * 100;
      lista.push({
        tom: taxa >= 20 ? 'bom' : 'atencao',
        pino: '%', cor: taxa >= 20 ? 'var(--verde)' : 'var(--ouro)',
        titulo: taxa >= 20 ? 'Boa taxa de poupança' : 'Sobra apertada',
        texto: 'Você guardou ' + taxa.toFixed(0) + '% do que entrou em ' + MESES[mesAtivo.mes] +
          '. ' + (taxa >= 20 ? 'Acima dos 20% que costumam ser recomendados.' : 'O caminho comum é buscar pelo menos 20%.'),
        destaque: comSinal(t.saldo), destaqueCor: t.saldo >= 0 ? 'var(--verde)' : 'var(--vermelho)'
      });
    }

    estado.metas.forEach(function (m) {
      var p = pct(m.guardado, m.alvo);
      if (p >= 50) {
        lista.push({
          tom: 'meta', pino: '◎', cor: 'var(--azul)', titulo: 'Meta em dia',
          texto: 'Sua meta ' + m.nome + ' está ' + Math.round(p) + '% completa. Faltam ' +
            emReais(Math.max(0, m.alvo - m.guardado)) + '.',
          destaque: null
        });
      }
    });

    if (atual.total > 0) {
      var maior = atual.lista[0];
      lista.push({
        tom: 'info', pino: '★', cor: 'var(--ciano)', titulo: 'Maior gasto do mês',
        texto: maior.nome + ' concentrou ' + Math.round(pct(maior.valor, atual.total)) +
          '% das suas saídas, somando ' + emReais(maior.valor) + '.',
        destaque: null
      });
    }

    if (!lista.length) {
      lista.push({
        tom: 'info', pino: '·', cor: 'var(--suave)', titulo: 'Ainda sem padrões',
        texto: 'Registre lançamentos por alguns meses para eu comparar períodos e apontar tendências.',
        destaque: null
      });
    }

    return lista;
  }

  // ---------- Infraestrutura das folhas ----------

  var folhaAberta = false;

  function abrirFolha(titulo, montar) {
    var folha = $('folha');
    folha.textContent = '';
    folha.appendChild(no('div', 'puxador'));
    var h = no('div', 'folha-titulo', titulo);
    h.id = 'folhaTitulo';
    folha.appendChild(h);
    montar(folha);

    folha.classList.add('aberta');
    $('cortina').classList.add('aberta');

    folha.scrollTop = 0;

  function fecharFolhaEfeito() {
    $('folha').classList.remove('aberta');
    $('cortina').classList.remove('aberta');
    document.body.style.overflow = telaEntrada && !$('entrada').classList.contains('escondida') ? 'hidden' : '';
    folhaAberta = false;
  }

  function fecharFolha() {
    if (topoEh('folha')) voltarNavegacao();
    else fecharFolhaEfeito();
  }

  function campo(rotulo, controle) {
    var c = no('div', 'campo');
    if (rotulo) {
      var l = no('label', null, rotulo);
      if (controle.id) l.htmlFor = controle.id;
      c.appendChild(l);
    }
    c.appendChild(controle);
    return c;
  }

  var contadorCampo = 0;
  function proximoId() { contadorCampo += 1; return 'campo' + contadorCampo; }

  function entradaTexto(valor, placeholder, maximo) {
    var i = no('input', 'entrada');
    i.type = 'text';
    i.id = proximoId();
    i.value = valor || '';
    i.autocomplete = 'off';
    if (placeholder) i.placeholder = placeholder;
    i.maxLength = maximo || 80;
    return i;
  }

  function entradaData(valor) {
    var i = no('input', 'entrada');
    i.type = 'date';
    i.id = proximoId();
    i.value = valor || hojeTexto();
    return i;
  }

  function entradaNumero(valor, passo, minimo, maximo) {
    var i = no('input', 'entrada');
    i.type = 'number';
    i.id = proximoId();
    i.value = String(valor);
    i.step = passo || '1';
    if (minimo != null) i.min = String(minimo);
    if (maximo != null) i.max = String(maximo);
    i.inputMode = 'decimal';
    return i;
  }

  function entradaSelecao(opcoes, valor) {
    var s = no('select', 'entrada');
    s.id = proximoId();
    opcoes.forEach(function (op) {
      var o = no('option', null, op.rotulo);
      o.value = op.valor;
      if (op.valor === valor) o.selected = true;
      s.appendChild(o);
    });
    return s;
  }

  function digitosParaCentavos(str) {
    var d = String(str).replace(/\D/g, '').slice(0, 11);
    return d ? parseInt(d, 10) : 0;
  }

  function entradaValor(centavos, grande) {
    var i = no('input', grande ? 'valor-grande' : 'entrada');
    i.type = 'text';
    i.id = proximoId();
    i.inputMode = 'numeric';
    i.autocomplete = 'off';
    i.value = emReais(centavos || 0);

    function fim() {
      var n = i.value.length;
      if (i.selectionStart === n && i.selectionEnd === n) return;
      try { i.setSelectionRange(n, n); } catch (e) { /* alguns navegadores recusam */ }
    }

    i.addEventListener('input', function () {
      i.value = emReais(digitosParaCentavos(i.value));
      fim();
    });
    ['focus', 'click', 'select', 'keyup'].forEach(function (ev) { i.addEventListener(ev, fim); });
    return i;
  }

  function grupoChips(opcoes, selecionado, aoEscolher) {
    var caixa = no('div', 'chips');
    caixa.setAttribute('role', 'group');
    opcoes.forEach(function (op) {
      var c = botao('chip', op, function () {
        Array.prototype.forEach.call(caixa.children, function (outro) {
          outro.setAttribute('aria-pressed', outro === c ? 'true' : 'false');
        });
        aoEscolher(op);
      });
      c.setAttribute('aria-pressed', op === selecionado ? 'true' : 'false');
      caixa.appendChild(c);
    });
    return caixa;
  }

  function opcoesDeConta() {
    return estado.contas.map(function (c) { return { valor: c.id, rotulo: c.nome }; });
  }

  function mostrarErro(caixa, mensagem) {
    var antigo = caixa.querySelector('.erro');
    if (antigo) antigo.remove();
    var e = no('p', 'erro', mensagem);
    caixa.appendChild(e);
  }

  // ---------- Sugestão de categoria ----------

  function sugerirCategoria(descricao, tipo) {
    var texto = descricao.toLowerCase().trim();
    if (!texto) return null;

    // 1) Descrição igual a algo já lançado antes
    var iguais = estado.lancamentos.filter(function (l) {
      return l.tipo === tipo && l.descricao && l.descricao.toLowerCase().trim() === texto;
    });
    if (iguais.length) return iguais[iguais.length - 1].categoria;

    // 2) Palavras conhecidas
    for (var i = 0; i < PISTAS.length; i++) {
      var categoria = PISTAS[i][0];
      if (categoriasDe(tipo).indexOf(categoria) < 0) continue;
      var palavras = PISTAS[i][1];
      for (var j = 0; j < palavras.length; j++) {
        if (texto.indexOf(palavras[j]) >= 0) return categoria;
      }
    }
    return null;
  }

  // ---------- Folha: lançamento ----------

  function abrirFolhaLancamento(id, rascunho) {
    var existente = id ? achar(estado.lancamentos, id) : null;
    if (id && !existente) return;

    contaPadrao();

    var dados = rascunho || (existente ? {
      tipo: existente.tipo,
      valor: existente.valor,
      descricao: existente.descricao,
      categoria: existente.categoria,
      data: existente.data,
      contaId: existente.contaId || estado.contas[0].id,
      contaDestinoId: existente.contaDestinoId || ''
    } : {
      tipo: 'saida',
      valor: 0,
      descricao: '',
      categoria: 'Outros',
      data: dataPadrao(),
      contaId: estado.contas[0].id,
      contaDestinoId: estado.contas.length > 1 ? estado.contas[1].id : ''
    });

    var categoriaTocada = rascunho ? !!rascunho.categoriaTocada : !!existente;

    abrirFolha(existente ? 'Editar lançamento' : 'Novo lançamento', function (folha) {
      var forma = no('div', 'forma');
      forma.setAttribute('data-tipo', dados.tipo);

      var tipos = segmentos([
        { valor: 'saida', rotulo: 'Saída' },
        { valor: 'entrada', rotulo: 'Entrada' },
        { valor: 'transferencia', rotulo: 'Transferência' }
      ], dados.tipo, function (v) {
        if (v === dados.tipo) return;
        var novo = coletar();
        novo.tipo = v;
        novo.categoriaTocada = categoriaTocada;
        if (v !== 'transferencia' && categoriasDe(v).indexOf(novo.categoria) < 0) novo.categoria = 'Outros';
        abrirFolhaLancamento(id, novo);
      });
      forma.appendChild(tipos);

      var campoValorEl = entradaValor(dados.valor, true);
      forma.appendChild(campo('Valor', campoValorEl));

      var campoDescricao = entradaTexto(dados.descricao,
        dados.tipo === 'transferencia' ? 'Ex.: Reserva para o mês' : 'Ex.: Abastecimento no posto');
      forma.appendChild(campo('Descrição', campoDescricao));

      var caixaChips = null;
      if (dados.tipo !== 'transferencia') {
        caixaChips = grupoChips(categoriasDe(dados.tipo), dados.categoria, function (c) {
          dados.categoria = c;
          categoriaTocada = true;
        });
        forma.appendChild(campo('Categoria', caixaChips));

        campoDescricao.addEventListener('input', function () {
          if (categoriaTocada) return;
          var sugerida = sugerirCategoria(campoDescricao.value, dados.tipo);
          if (!sugerida || sugerida === dados.categoria) return;
          dados.categoria = sugerida;
          Array.prototype.forEach.call(caixaChips.children, function (chip) {
            chip.setAttribute('aria-pressed', chip.textContent === sugerida ? 'true' : 'false');
          });
        });
      }

      var campoConta = entradaSelecao(opcoesDeConta(), dados.contaId);
      forma.appendChild(campo(dados.tipo === 'transferencia' ? 'De qual conta' : 'Conta', campoConta));

      var campoDestino = null;
      if (dados.tipo === 'transferencia') {
        campoDestino = entradaSelecao(opcoesDeConta(), dados.contaDestinoId);
        forma.appendChild(campo('Para qual conta', campoDestino));
      }

      var campoData = entradaData(dados.data);
      forma.appendChild(campo('Data', campoData));

      function coletar() {
        return {
          tipo: dados.tipo,
          valor: digitosParaCentavos(campoValorEl.value),
          descricao: campoDescricao.value,
          categoria: dados.categoria,
          data: campoData.value,
          contaId: campoConta.value,
          contaDestinoId: campoDestino ? campoDestino.value : dados.contaDestinoId
        };
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        if (valor <= 0) { mostrarErro(forma, 'Informe um valor maior que zero.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }
        if (dados.tipo === 'transferencia') {
          if (!campoDestino.value || campoDestino.value === campoConta.value) {

    var dados = rascunho || {

      juntar(topo,
        no('div', 'rotulo', 'Categorias'),
        botao('cartao-acao', dados.categorias.length ? 'Escolher' : '+ Escolher categorias', function () {

        dados.categorias.forEach(function (c) {

        });
      }

      if (!dados.categorias.length) {
        var vazio = no('p', 'linha-sub', 'Sem teto por categoria. Toque em "Escolher categorias" para separar quanto pode gastar em cada uma.');
        vazio.style.marginBottom = '8px';
        forma.appendChild(vazio);
      } else {
        dados.categorias.forEach(function (c) {
          var linha = no('div', 'orc-item');
          var rot = no('div', 'rot', c.nome);
          var gasto = gastoDaCategoria(c.nome);
          rot.appendChild(no('small', null, gasto > 0 ? 'gasto em ' + MESES[mesAtivo.mes] + ': ' + emReais(gasto) : 'sem gasto neste mês'));
          var entrada = entradaValor(c.valor, false);
          campos[c.nome] = entrada;
          var tirar = botao('tirar', '×', function () {
            lerValoresCategorias();
            dados.categorias = dados.categorias.filter(function (x) { return x.nome !== c.nome; });
            abrirFolhaOrcamento(dados);
          });
          tirar.setAttribute('aria-label', 'Tirar ' + c.nome);
          juntar(linha, rot, entrada, tirar);
          forma.appendChild(linha);
        });

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar orçamento', function () {
        lerValoresCategorias();
        estado.orcamentos.geral = digitosParaCentavos(campoGeral.value);
        estado.orcamentos.categorias = {};
        dados.categorias.forEach(function (c) {
          if (c.valor > 0) estado.orcamentos.categorias[c.nome] = c.valor;
        });
        salvar();
        fecharFolha();
        desenhar();
        avisar('Orçamento salvo.');
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });

    abrirFolha('Categorias', function (folha) {

      var lista = no('div', 'cartao liso');

      function estaMarcada(nomeCat) {
        return dados.categorias.some(function (c) { return c.nome === nomeCat; });
      }

      function desenharLista() {
        lista.textContent = '';
        categoriasDe('saida').forEach(function (nomeCat) {
          var gasto = gastoDaCategoria(nomeCat);
          var linha = botao('cat-linha', null, function () {
            if (estaMarcada(nomeCat)) {
              dados.categorias = dados.categorias.filter(function (c) { return c.nome !== nomeCat; });
            } else {
              dados.categorias.push({ nome: nomeCat, valor: gasto > 0 ? Math.ceil(gasto / 1000) * 1000 : 0 });
            }
            desenharLista();
          });
          linha.setAttribute('aria-pressed', estaMarcada(nomeCat) ? 'true' : 'false');
          juntar(linha,
            no('span', 'marca', estaMarcada(nomeCat) ? '✓' : ''),

      ir: 'Apoio ao imposto de renda'
    };

    alvo.appendChild(no('h1', null, titulos[tipo]));
    alvo.appendChild(no('div', 'rel-sub',
      (tipo === 'ir' ? 'Ano de ' + mesAtivo.ano : periodo) +
      ' · gerado em ' + dataBr(hojeTexto()) + (estado.perfil.nome ? ' · ' + estado.perfil.nome : '')));

    if (tipo === 'resumo') {
      alvo.appendChild(no('h2', null, 'Patrimônio'));
      alvo.appendChild(par('Total em contas', emReais(totalEmContas(null))));
      alvo.appendChild(par('Total investido', emReais(totalInvestido(null))));
      alvo.appendChild(par('Patrimônio líquido', emReais(patrimonio(null))));

      alvo.appendChild(no('h2', null, 'Fluxo do mês'));
      alvo.appendChild(par('Entradas', emReais(t.entradas), 'verde'));
      alvo.appendChild(par('Saídas', emReais(t.saidas), 'vermelho'));
      alvo.appendChild(par('Resultado', emReais(t.saldo), t.saldo >= 0 ? 'verde' : 'vermelho'));
      if (t.entradas > 0) {
        alvo.appendChild(par('Taxa de poupança', ((t.saldo / t.entradas) * 100).toFixed(1).replace('.', ',') + '%'));
      }

      if (estado.contas.length) {
        alvo.appendChild(no('h2', null, 'Contas'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Conta' }, { rotulo: 'Tipo' }, { rotulo: 'Saldo', numerica: true }],
          estado.contas.map(function (c) {
            return [celula(c.nome), celula(c.tipo), celula(emReais(saldoConta(c.id, null)))];
          })
        ));
      }

      if (gastos.lista.length) {
        alvo.appendChild(no('h2', null, 'Gastos por categoria'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Categoria' }, { rotulo: 'Valor', numerica: true }, { rotulo: '%', numerica: true }],
          gastos.lista.map(function (g) {
            return [celula(g.nome), celula(emReais(g.valor)), celula(Math.round(pct(g.valor, gastos.total)) + '%')];
          })
        ));
      }

      if (estado.metas.length) {
        alvo.appendChild(no('h2', null, 'Metas'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Meta' }, { rotulo: 'Guardado', numerica: true }, { rotulo: 'Alvo', numerica: true }, { rotulo: '%', numerica: true }],
          estado.metas.map(function (m) {
            return [celula(m.nome), celula(emReais(m.guardado)), celula(emReais(m.alvo)),
                    celula(Math.round(pct(m.guardado, m.alvo)) + '%')];
          })
        ));
      }
    }

    if (tipo === 'fluxo') {
      alvo.appendChild(no('h2', null, 'Resumo'));
      alvo.appendChild(par('Entradas', emReais(t.entradas), 'verde'));
      alvo.appendChild(par('Saídas', emReais(t.saidas), 'vermelho'));
      alvo.appendChild(par('Resultado', emReais(t.saldo), t.saldo >= 0 ? 'verde' : 'vermelho'));

      var itens = lancamentosDoMes(mesAtivo.ano, mesAtivo.mes).slice().sort(function (a, b) {
        return a.data < b.data ? -1 : a.data > b.data ? 1 : (a.criadoEm || 0) - (b.criadoEm || 0);
      });

      alvo.appendChild(no('h2', null, 'Lançamentos (' + itens.length + ')'));
      if (!itens.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhum lançamento neste mês.'));
      } else {
        alvo.appendChild(tabela(
          [{ rotulo: 'Data' }, { rotulo: 'Descrição' }, { rotulo: 'Categoria' }, { rotulo: 'Valor', numerica: true }],
          itens.map(function (l) {
            var sinal = l.tipo === 'entrada' ? '+' : l.tipo === 'saida' ? '−' : '';
            return [
              celula(dataBr(l.data)),
              celula(l.descricao || '—'),
              celula(l.categoria),
              celula(sinal + ' ' + emReais(l.valor), l.tipo === 'entrada' ? 'verde' : l.tipo === 'saida' ? 'vermelho' : '')
            ];
          })
        ));
      }

      if (gastos.lista.length) {
        alvo.appendChild(no('h2', null, 'Totais por categoria'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Categoria' }, { rotulo: 'Valor', numerica: true }, { rotulo: '%', numerica: true }],
          gastos.lista.map(function (g) {
            return [celula(g.nome), celula(emReais(g.valor)), celula(Math.round(pct(g.valor, gastos.total)) + '%')];
          })
        ));
      }
    }

    if (tipo === 'investimentos') {
      var total = totalInvestido(null);
      var aplicado = totalAplicado();
      alvo.appendChild(no('h2', null, 'Posição'));
      alvo.appendChild(par('Valor aplicado', emReais(aplicado)));
      alvo.appendChild(par('Valor atual', emReais(total)));
      alvo.appendChild(par('Resultado', comSinal(total - aplicado), total - aplicado >= 0 ? 'verde' : 'vermelho'));
      if (aplicado > 0) {
        alvo.appendChild(par('Rentabilidade', (((total - aplicado) / aplicado) * 100).toFixed(2).replace('.', ',') + '%'));
      }

      if (!estado.ativos.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhum ativo cadastrado.'));
      } else {
        alvo.appendChild(no('h2', null, 'Ativos'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Ativo' }, { rotulo: 'Classe' }, { rotulo: 'Aplicado', numerica: true },
           { rotulo: 'Atual', numerica: true }, { rotulo: 'Rent.', numerica: true }],
          estado.ativos.map(function (a) {
            var atual = valorAtivo(a);
            var rend = a.aplicado > 0 ? ((atual - a.aplicado) / a.aplicado) * 100 : 0;
            return [
              celula(a.nome), celula(a.classe), celula(emReais(a.aplicado)), celula(emReais(atual)),
              celula(rend.toFixed(2).replace('.', ',') + '%', rend >= 0 ? 'verde' : 'vermelho')
            ];
          })
        ));

        var aloc = alocacaoPorClasse();
        alvo.appendChild(no('h2', null, 'Alocação'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Classe' }, { rotulo: 'Valor', numerica: true }, { rotulo: '%', numerica: true }],
          aloc.lista.map(function (c) {
            return [celula(c.nome), celula(emReais(c.valor)), celula(Math.round(pct(c.valor, aloc.total)) + '%')];
          })
        ));
      }
    }

    if (tipo === 'clientes') {
      var geral = resumoGeralClientes();
      alvo.appendChild(no('h2', null, 'Resumo de todos os clientes'));
      alvo.appendChild(par('Clientes cadastrados', String(estado.clientes.length)));
      alvo.appendChild(par('Serviços prestados', String(estado.servicos.length)));
      alvo.appendChild(par('Valor total dos serviços', emReais(geral.total)));
      alvo.appendChild(par('Já recebido', emReais(geral.pago), 'verde'));
      alvo.appendChild(par('Falta receber', emReais(geral.restante), geral.restante > 0 ? 'vermelho' : 'verde'));
      var prox = proximoPagamentoGeral();
      if (prox) alvo.appendChild(par('Próximo pagamento previsto', dataBr(prox)));

      if (!estado.clientes.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhum cliente cadastrado.'));
      } else {
        alvo.appendChild(no('h2', null, 'Por cliente'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Cliente' }, { rotulo: 'Telefone' }, { rotulo: 'Total', numerica: true },
           { rotulo: 'Pago', numerica: true }, { rotulo: 'Falta', numerica: true }, { rotulo: 'Situação' }],
          estado.clientes.map(function (c) {
            var r = resumoCliente(c.id);
            var sit = situacaoCliente(c);
            return [
              celula(c.nome), celula(c.telefone || '—'), celula(emReais(r.total)),
              celula(emReais(r.pago), 'verde'),
              celula(emReais(r.restante), r.restante > 0 ? 'vermelho' : ''),
              celula(sit.texto)
            ];
          })
        ));

        estado.clientes.forEach(function (c) {
          var servicos = servicosDoCliente(c.id);
          var pagamentos = pagamentosDoCliente(c.id);
          if (!servicos.length && !pagamentos.length) return;
          var r = resumoCliente(c.id);

          alvo.appendChild(no('h2', null, c.nome));
          alvo.appendChild(par('Total / Pago / Falta',
            emReais(r.total) + ' · ' + emReais(r.pago) + ' · ' + emReais(r.restante)));
          if (c.proximoPagamento) alvo.appendChild(par('Próximo pagamento', dataBr(c.proximoPagamento)));

          if (servicos.length) {
            alvo.appendChild(tabela(
              [{ rotulo: 'Data' }, { rotulo: 'Serviço' }, { rotulo: 'Valor', numerica: true }],
              servicos.slice().reverse().map(function (s) {
                return [celula(dataBr(s.data)), celula(s.nome), celula(emReais(s.valor))];
              })
            ));
          }
          if (pagamentos.length) {
            alvo.appendChild(tabela(
              [{ rotulo: 'Data' }, { rotulo: 'Referente a' }, { rotulo: 'Pago', numerica: true }],
              pagamentos.slice().reverse().map(function (p) {
                var s = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
                return [celula(dataBr(p.data)), celula(s ? s.nome : '—'), celula(emReais(p.valor), 'verde')];
              })
            ));
          }
        });
      }
    }

    if (tipo === 'ir') {
      var ano = mesAtivo.ano;
      var fimDoAno = ano + '-12-31';
      var fimAnterior = (ano - 1) + '-12-31';

      alvo.appendChild(no('h2', null, 'Posição em 31/12/' + ano));
      if (!estado.ativos.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhum ativo cadastrado.'));
      } else {
        alvo.appendChild(tabela(
          [{ rotulo: 'Ativo' }, { rotulo: 'Classe' }, { rotulo: 'Em 31/12/' + (ano - 1), numerica: true },
           { rotulo: 'Em 31/12/' + ano, numerica: true }],
          estado.ativos.map(function (a) {
            return [celula(a.nome), celula(a.classe),
                    celula(emReais(valorAtivoEm(a, fimAnterior))),
                    celula(emReais(valorAtivoEm(a, fimDoAno)))];
          })
        ));
        alvo.appendChild(par('Total em 31/12/' + (ano - 1), emReais(totalInvestido(fimAnterior))));
        alvo.appendChild(par('Total em 31/12/' + ano, emReais(totalInvestido(fimDoAno))));
        alvo.appendChild(par('Variação no ano',
          comSinal(totalInvestido(fimDoAno) - totalInvestido(fimAnterior))));
      }

      var rendimentos = estado.lancamentos.filter(function (l) {
        return l.tipo === 'entrada' && l.categoria === 'Rendimentos' && l.data.indexOf(String(ano)) === 0;
      });
      alvo.appendChild(no('h2', null, 'Rendimentos lançados em ' + ano));
      if (!rendimentos.length) {
        alvo.appendChild(no('p', 'rel-nota', 'Nenhuma entrada na categoria Rendimentos neste ano.'));
      } else {
        alvo.appendChild(tabela(
          [{ rotulo: 'Data' }, { rotulo: 'Descrição' }, { rotulo: 'Valor', numerica: true }],
          rendimentos.map(function (l) {
            return [celula(dataBr(l.data)), celula(l.descricao || '—'), celula(emReais(l.valor))];
          })
        ));
        alvo.appendChild(par('Total', emReais(rendimentos.reduce(function (s, l) { return s + l.valor; }, 0))));
      }

      alvo.appendChild(no('p', 'rel-nota',
        'Este relatório é um apoio montado com os dados que você mesmo cadastrou. ' +
        'Ele não substitui os informes oficiais dos bancos e corretoras, que são a fonte válida para a declaração.'));
    }

    alvo.appendChild(no('p', 'rel-nota',
      'Gerado pelo Caixa a partir dos dados guardados neste aparelho. Para salvar em PDF, use o botão acima e escolha "Salvar como PDF" no destino de impressão.'));

    $('relatorio').classList.add('aberto');
    document.body.style.overflow = 'hidden';
    $('relatorio').scrollTop = 0;
    empilhar({ tipo: 'relatorio' });
  }

  function fecharRelatorioEfeito() {
    $('relatorio').classList.remove('aberto');
    document.body.style.overflow = '';
  }

  function fecharRelatorio() {
    if (topoEh('relatorio')) voltarNavegacao();
    else fecharRelatorioEfeito();
  }

  // ---------- Backup, CSV e restauração ----------

  function baixarArquivo(nome, conteudo, tipoMime) {
    var blob = new Blob([conteudo], { type: tipoMime });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = nome;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function carimbo() { return hojeTexto().replace(/-/g, ''); }

  function fazerBackup() {
    var pacote = { app: 'caixa', versao: VERSAO, exportadoEm: new Date().toISOString(), dados: estado };
    baixarArquivo('caixa-backup-' + carimbo() + '.json', JSON.stringify(pacote, null, 2), 'application/json');
    avisar('Backup gerado.');
  }

  function campoCsv(valor) {
    var v = String(valor == null ? '' : valor);
    return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function exportarCsv() {
    if (!estado.lancamentos.length) { avisar('Nada para exportar.'); return; }

    var linhas = [['Data', 'Tipo', 'Categoria', 'Descrição', 'Conta', 'Conta destino', 'Valor'].join(';')];

    estado.lancamentos.slice().sort(function (a, b) {
      return a.data < b.data ? -1 : a.data > b.data ? 1 : (a.criadoEm || 0) - (b.criadoEm || 0);
    }).forEach(function (l) {
      var origem = achar(estado.contas, l.contaId);
      var destino = achar(estado.contas, l.contaDestinoId);
      var sinal = l.tipo === 'entrada' ? 1 : l.tipo === 'saida' ? -1 : 0;
      linhas.push([
        campoCsv(dataBr(l.data)),
        campoCsv(l.tipo === 'entrada' ? 'Entrada' : l.tipo === 'saida' ? 'Saída' : 'Transferência'),
        campoCsv(l.categoria),
        campoCsv(l.descricao || ''),
        campoCsv(origem ? origem.nome : ''),
        campoCsv(destino ? destino.nome : ''),
        campoCsv(((sinal || 1) * l.valor / 100).toFixed(2).replace('.', ','))
      ].join(';'));
    });

    baixarArquivo('caixa-' + carimbo() + '.csv', '﻿' + linhas.join('\r\n'), 'text/csv;charset=utf-8');
    avisar('CSV exportado.');
  }

  function restaurarBackup(arquivo) {
    var leitor = new FileReader();

    leitor.onload = function () {
      var bruto;
      try { bruto = JSON.parse(String(leitor.result)); } catch (e) { avisar('Arquivo inválido: não é um JSON.'); return; }

      var dados = null;
      if (bruto && bruto.dados) dados = bruto.dados;
      else if (bruto && Array.isArray(bruto.lancamentos)) dados = bruto;
      else if (Array.isArray(bruto)) dados = { lancamentos: bruto };

      if (!dados) { avisar('Arquivo inválido: não encontrei os dados do Caixa.'); return; }

      var limpo = limparEstado(dados);

      // Backup antigo, só com lançamentos soltos: cria uma conta para eles.
      if (limpo.lancamentos.length && !limpo.contas.length) {
        var carteira = { id: novoId(), nome: 'Carteira', tipo: 'Dinheiro físico', saldoInicial: 0, cor: CORES[0] };
        limpo.contas = [carteira];
        limpo.lancamentos.forEach(function (l) { if (!l.contaId) l.contaId = carteira.id; });
      }

      if (!limpo.lancamentos.length && !limpo.contas.length && !limpo.ativos.length && !limpo.metas.length) {
        avisar('Arquivo inválido: nenhum dado aproveitável.');
        return;
      }

      if (!confirm('Restaurar ' + limpo.lancamentos.length + ' lançamento(s), ' +
                   limpo.contas.length + ' conta(s), ' + limpo.ativos.length + ' ativo(s) e ' +
                   limpo.metas.length + ' meta(s)? Isso substitui tudo o que está no aplicativo agora.')) return;

      estado = limpo;
      salvar();
      fecharFolha();
      desenhar();
      avisar('Backup restaurado.');
    };

    leitor.onerror = function () { avisar('Não foi possível ler o arquivo.'); };
    leitor.readAsText(arquivo);
  }

  function apagarTudo() {
    var quanto = estado.lancamentos.length + estado.contas.length + estado.ativos.length + estado.metas.length;
    if (!quanto) { avisar('Não há nada para apagar.'); return; }
    if (!confirm('Apagar todos os seus dados do Caixa? São ' + quanto + ' registros.')) return;
    if (!confirm('Tem certeza mesmo? Faça um backup antes, se quiser guardar.')) return;
    estado = estadoPadrao();
    salvar();
    desenhar();
    avisar('Tudo apagado.');
  }

  // ---------- Avisos ----------

  var tempoAviso = null;

  function avisar(mensagem) {
    var el = $('toque');
    el.textContent = mensagem;
    el.classList.add('visivel');
    clearTimeout(tempoAviso);
    tempoAviso = setTimeout(function () { el.classList.remove('visivel'); }, 2600);
  }

  // ---------- Service worker ----------

  function mostrarAvisoDeVersao(trabalhador) {
    if ($('avisoVersao')) return;
    var aviso = no('div', 'aviso');
    aviso.id = 'avisoVersao';
    aviso.appendChild(no('span', null, 'Nova versão disponível.'));
    var b = botao(null, 'Atualizar', function () {
      b.disabled = true;
      b.textContent = 'Atualizando…';
      trabalhador.postMessage({ tipo: 'PULAR_ESPERA' });
    });
    aviso.appendChild(b);
    document.body.appendChild(aviso);
  }

  function registrarServiceWorker() {
    if (!('serviceWorker' in navigator)) return;

    var recarregando = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (recarregando) return;
      recarregando = true;
      location.reload();
    });

    navigator.serviceWorker.register('sw.js').then(function (registro) {
      if (registro.waiting && navigator.serviceWorker.controller) mostrarAvisoDeVersao(registro.waiting);

      registro.addEventListener('updatefound', function () {
        var novo = registro.installing;
        if (!novo) return;
        novo.addEventListener('statechange', function () {
          if (novo.state === 'installed' && navigator.serviceWorker.controller) mostrarAvisoDeVersao(novo);
        });
      });

      setInterval(function () { registro.update().catch(function () {}); }, 60 * 60 * 1000);
    }).catch(function () { /* sem service worker o app segue funcionando */ });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      navigator.serviceWorker.getRegistration().then(function (r) {
        if (r) r.update().catch(function () {});
      });
    });
  }

  // ---------- Ligações ----------

  $('fab').addEventListener('click', function () { abrirFolhaLancamento(null); });
  $('cortina').addEventListener('click', fecharFolha);
  $('relFechar').addEventListener('click', fecharRelatorio);
  $('relImprimir').addEventListener('click', function () { window.print(); });

  $('arquivoRestaurar').addEventListener('change', function (evento) {
    var arquivo = evento.target.files && evento.target.files[0];
    if (arquivo) restaurarBackup(arquivo);
    evento.target.value = '';
  });

  document.addEventListener('keydown', function (evento) {
    if (evento.key !== 'Escape') return;
    if ($('relatorio').classList.contains('aberto')) fecharRelatorio();
    else if (folhaAberta) fecharFolha();
  });

  window.addEventListener('popstate', aoVoltar);

  // ---------- Início ----------

  function comecar() {
    iniciarNavegacao();

    if (!cripto) {
      // Sem WebCrypto (contexto não seguro) o app roda sem conta, como antes.
      estado = limparEstado(dadosParaImportar() || estadoPadrao());
      desenhar();
      avisar('Abra o app por HTTPS para usar contas com senha.');
      return;
    }

    var guardada = sessaoGuardada();
    if (!guardada) { estado = estadoPadrao(); mostrarEntrada('abertura'); return; }

    var conta = achar(lerContas(), guardada.contaId);
    if (!conta) { limparSessao(); estado = estadoPadrao(); mostrarEntrada('abertura'); return; }

    importarChave(guardada.chave).then(function (chave) {
      return abrirCofre(conta, chave);
    }).then(function () {
      esconderEntrada();
      desenhar();
    }).catch(function () {
      limparSessao();
      estado = estadoPadrao();
      mostrarEntrada('login');
    });
  }

  estado = estadoPadrao();
  comecar();
  registrarServiceWorker();
})();
</script>
