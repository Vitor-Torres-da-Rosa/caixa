      estado.contas.forEach(function (c) {
        var s = saldoConta(c.id, null);

        var linha = no('div', 'linha linha-dupla');
        var alvo = botao('linha-alvo', null, function () { abrirExtratoConta(c.id); });
        juntar(alvo,
          selo(c.cor, c.nome.charAt(0).toUpperCase()),
          juntar(no('div', 'linha-texto'),
            no('div', 'linha-titulo', c.nome),
            no('div', 'linha-sub', c.tipo)),
          juntar(no('div', 'linha-fim'),
            no('div', 'linha-valor num' + (s < 0 ? ' vermelho' : ''), emReais(s)))
        );
        linha.appendChild(alvo);

        var lapis = botao('linha-acao', null, function () { abrirFolhaConta(c.id); });
        lapis.setAttribute('aria-label', 'Editar a conta ' + c.nome);
        lapis.appendChild(icone('lapis'));
        linha.appendChild(lapis);

        cContas.appendChild(linha);
      });
      var totalLinha = no('div', 'linha');
      totalLinha.style.background = 'var(--cartao-2)';
      juntar(totalLinha,
        juntar(no('div', 'linha-texto'), no('div', 'linha-titulo suave', 'Total em contas')),
        juntar(no('div', 'linha-fim'), no('div', 'linha-valor num', emReais(totalEmContas(null))))
      );
      cContas.appendChild(totalLinha);
    }
    tela.appendChild(cContas);
  }

  // ---------- Empreendedor: tela ----------

  function desenharEmpreendedor(tela) {
    var geral = resumoGeralClientes();

    var cResumo = cartao();
    cResumo.appendChild(no('div', 'rotulo', 'A receber de todos os clientes'));
    cResumo.appendChild(no('div', 'valorao num ' + (geral.restante > 0 ? 'ouro' : 'verde'), emReais(geral.restante)));

    var barra = no('div', 'barra-dupla');
    barra.style.marginTop = '10px';
    var iPago = no('i');
    iPago.style.width = pct(geral.pago, geral.total) + '%';
    iPago.style.background = 'var(--verde)';
    var iFalta = no('i');
    iFalta.style.width = (geral.total > 0 ? 100 - pct(geral.pago, geral.total) : 0) + '%';
    iFalta.style.background = 'var(--ouro)';
    juntar(barra, iPago, iFalta);
    cResumo.appendChild(barra);

    var grade = no('div', 'resumo-grade');
    [['Total', geral.total, ''], ['Recebido', geral.pago, 'verde'], ['Falta', geral.restante, 'ouro']].forEach(function (item) {
      var d = no('div');
      d.appendChild(no('div', 'r', item[0]));
      d.appendChild(no('div', 'v ' + item[2], emReais(item[1])));
      grade.appendChild(d);
    });
    cResumo.appendChild(grade);

    var proxima = proximoPagamentoGeral();
    if (proxima) {
      cResumo.appendChild(no('div', 'linha-nota', 'Próximo pagamento previsto para ' + dataBr(proxima) + '.'));
    }
    if (geral.atrasados) {
      var alerta = no('div', 'linha-nota vermelho',
        geral.atrasados + ' cliente(s) em atraso, somando ' + emReais(geral.emAtraso) + '.');
      cResumo.appendChild(alerta);
    }
    tela.appendChild(cResumo);

    var cClientes = cartao('liso');
    var topo = topoDeCartao('Clientes', '+ Novo', function () { abrirFolhaCliente(null); });
    topo.style.padding = '16px 16px 0';
    topo.style.marginBottom = '8px';
    cClientes.appendChild(topo);

    if (!estado.clientes.length) {
      cClientes.appendChild(estadoVazio('Nenhum cliente ainda',
        'Cadastre quem contratou seu serviço para acompanhar o que já foi pago e o que falta receber.'));
      var b = botao('btn btn-ouro', 'Cadastrar primeiro cliente', function () { abrirFolhaCliente(null); });
      b.style.margin = '0 16px 18px';
      b.style.width = 'calc(100% - 32px)';
      cClientes.appendChild(b);
    } else {
      // Quem está atrasado sobe para o topo.
      estado.clientes.slice().sort(function (a, b) {
        var atA = clienteAtrasado(a.id) ? 1 : 0;
        var atB = clienteAtrasado(b.id) ? 1 : 0;
        if (atA !== atB) return atB - atA;
        return resumoCliente(b.id).restante - resumoCliente(a.id).restante;
      }).forEach(function (c) {
        var r = resumoCliente(c.id);
        var sit = situacaoCliente(c);
        var atrasado = sit.classe === 'atrasado';

        var linha = no('div', 'linha linha-dupla' + (atrasado ? ' atrasada' : ''));
        var alvo = botao('linha-alvo', null, function () {
          if (atrasado) { abrirResumoAtraso(c.id); return; }
          abrirFichaCliente(c.id);
        });

        var texto = no('div', 'linha-texto');
        texto.appendChild(no('div', 'linha-titulo', c.nome));
        var sub = no('div', 'linha-sub');
        var fones = telefonesDoCliente(c);
        sub.appendChild(document.createTextNode(
          servicosDoCliente(c.id).length + ' registro(s)' +
          (fones.length ? ' · ' + telefoneBonito(fones[0].numero) : '') +
          (fones.length > 1 ? ' +' + (fones.length - 1) : '')));
        texto.appendChild(sub);

        var fim = no('div', 'linha-fim');
        fim.appendChild(no('div', 'linha-valor num ' +
          (atrasado ? 'vermelho' : r.restante > 0 ? 'ouro' : 'verde'), emReais(r.restante)));
        fim.appendChild(no('span', 'etiqueta ' + sit.classe, sit.texto));

        juntar(alvo, selo(atrasado ? '#FF6B6B' : sit.classe === 'quitado' ? '#3DDC84' : '#E9B44C',
          c.nome.charAt(0).toUpperCase()), texto, fim);
        linha.appendChild(alvo);

        if (r.restante > 0 && temWhatsapp(c)) {
          var zap = botao('linha-acao', null, function () {
            abrirWhatsapp(c, mensagemDeCobranca(c));
          });
          zap.setAttribute('aria-label', 'Falar com ' + c.nome + ' no WhatsApp');
          zap.style.color = '#25D366';
          zap.appendChild(iconeWhatsapp());
          linha.appendChild(zap);
        }

        cClientes.appendChild(linha);
      });
    }
    tela.appendChild(cClientes);

  }

  // O que venceu e ainda não foi pago, com o atalho para o WhatsApp.
  function abrirResumoAtraso(clienteId) {
    var cliente = achar(estado.clientes, clienteId);
    if (!cliente) return;
    var atraso = atrasoDoCliente(clienteId);
    var r = resumoCliente(clienteId);

    abrirFolha('Cobrança de ' + cliente.nome, function (folha) {
      var cabeca = cartao();
      cabeca.appendChild(no('div', 'rotulo', 'Em atraso'));
      cabeca.appendChild(no('div', 'valorao vermelho num',
        emReais(atraso.total || r.restante)));
      if (atraso.desde) {
        cabeca.appendChild(no('div', 'linha-nota', 'A parcela mais antiga venceu em ' + dataBr(atraso.desde) + '.'));
      }
      cabeca.appendChild(no('div', 'linha-nota',
        'No total, ainda faltam ' + emReais(r.restante) + ' deste cliente.'));
      folha.appendChild(cabeca);

      if (atraso.vencidas.length) {
        var lista = cartao();
        lista.appendChild(no('div', 'cartao-titulo', 'O que deveria ter sido pago'));
        var caixa = no('div');
        caixa.style.marginTop = '10px';
        atraso.vencidas.forEach(function (p) {
          var servicoP = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
          var l = no('div', 'parcela-linha vencida');
          juntar(l,
            no('span', 'q', 'Parcela ' + p.numero + '/' + p.total + ' · venceu em ' + dataBr(p.vencimento) +
              (servicoP ? ' · ' + servicoP.nome : '')),
            no('span', 'v num', emReais(p.valor)));
          caixa.appendChild(l);
        });
        lista.appendChild(caixa);
        folha.appendChild(lista);
      } else {
        var semParcela = cartao();
        semParcela.appendChild(no('p', 'linha-sub',
          'Não há parcelas combinadas para este cliente. A data prevista no cadastro já passou.'));
        folha.appendChild(semParcela);
      }

      var acoes = no('div', 'acoes');
      if (temWhatsapp(cliente)) {
        var whats = botao('btn-whats', null, function () {
          abrirWhatsapp(cliente, mensagemDeCobranca(cliente));
        });
        whats.appendChild(iconeWhatsapp());
        whats.appendChild(no('span', null, 'Mandar mensagem no WhatsApp'));
        acoes.appendChild(whats);
        acoes.appendChild(no('div', 'linha-nota',
          'A conversa abre com o texto já escrito. Você lê, muda o que quiser e só então envia.'));
      } else if (cliente.telefone) {
        acoes.appendChild(no('div', 'linha-nota',
          'Este cliente está marcado como sem WhatsApp. Você pode mudar isso em Editar cliente.'));
      } else {
        acoes.appendChild(no('div', 'linha-nota',
          'Cadastre o celular do cliente para poder cobrar pelo WhatsApp.'));
      }
      acoes.appendChild(botao('btn btn-ouro', 'Registrar pagamento', function () {
        fecharFolha();
        setTimeout(function () { abrirFolhaPagamento(clienteId, null); }, 250);
      }));
      acoes.appendChild(botao('btn btn-fantasma', 'Abrir a ficha do cliente', function () {
        fecharFolha();
        setTimeout(function () { abrirFichaCliente(clienteId); }, 250);
      }));
      folha.appendChild(acoes);
    });
  }

  // ---------- Empreendedor: folhas ----------

  function abrirFolhaCliente(id) {
    var existente = id ? achar(estado.clientes, id) : null;
    if (id && !existente) return;

    abrirFolha(existente ? 'Editar cliente' : 'Novo cliente', function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Nome do cliente', 60);
      forma.appendChild(campo('Nome', campoNome));

      // Uma linha por número. Cada uma tem o seu botão de WhatsApp.
      var numeros = existente ? telefonesDoCliente(existente).map(function (t) {
        return { numero: t.numero, whats: t.whats !== false };
      }) : [];
      if (!numeros.length) numeros = [{ numero: '', whats: true }];

      var caixaNumeros = no('div');
      forma.appendChild(campo('Celulares', caixaNumeros));

      var resumoNumeros = no('div', 'telefone-marca');
      forma.appendChild(resumoNumeros);

      function pintarNumeros() {
        caixaNumeros.textContent = '';
        numeros.forEach(function (item, i) {
          var linha = no('div', 'telefone-linha');

          var entrada = entradaTelefone(item.numero);
          var alterna = botao('linha-acao', null, function () {
            item.whats = !item.whats;
            item.tocado = true;
            pintarAlterna();
            contarNumeros();
          });
          alterna.appendChild(iconeWhatsapp());

          // Só a cor do ícone muda; refazer a lista a cada tecla tiraria o
          // teclado do ar no meio da digitação.
          function pintarAlterna() {
            alterna.className = 'linha-acao' + (item.whats ? ' tem-whats' : '');
            alterna.setAttribute('aria-label', (item.whats ? 'Tem' : 'Não tem') + ' WhatsApp');
          }
          pintarAlterna();

          entrada.addEventListener('input', function () {
            item.numero = soDigitos(entrada.value);
            // Fixo não costuma ter WhatsApp; celular sim. Depois que você
            // mexe no ícone verde, a sua escolha manda.
            if (!item.tocado) { item.whats = pareceCelular(item.numero); pintarAlterna(); }
            contarNumeros();
          });

          linha.appendChild(entrada);
          linha.appendChild(alterna);

          if (numeros.length > 1) {
            var tirar = botao('linha-acao', null, function () {
              numeros.splice(i, 1);
              pintarNumeros();
            });
            tirar.setAttribute('aria-label', 'Remover este número');
            tirar.appendChild(icone('lixo'));
            linha.appendChild(tirar);
          }

          caixaNumeros.appendChild(linha);
        });

        if (numeros.length < 6) {
          var somar = botao('btn btn-fantasma', '+ Outro número', function () {
            numeros.push({ numero: '', whats: true });
            pintarNumeros();
          });
          somar.style.padding = '11px';
          somar.style.fontSize = '14px';
          caixaNumeros.appendChild(somar);
        }

        var verificar = botao('btn btn-fantasma', 'Verificar quais têm WhatsApp', function () {
          verificarNumeros();
        });
        verificar.style.padding = '11px';
        verificar.style.fontSize = '14px';
        verificar.style.marginTop = '8px';
        caixaNumeros.appendChild(verificar);

        contarNumeros();
      }

      function contarNumeros() {
        var validos = numeros.filter(function (t) { return numeroWhatsapp(t.numero); });
        var comWhats = validos.filter(function (t) { return t.whats; });
        resumoNumeros.textContent = '';
        if (!validos.length) {
          resumoNumeros.appendChild(document.createTextNode('Marque o ícone verde nos números que atendem no WhatsApp.'));
          return;
        }
        resumoNumeros.appendChild(no('span', 'n', comWhats.length + ' de ' + validos.length));
        resumoNumeros.appendChild(document.createTextNode(
          ' número(s) marcado(s) com WhatsApp. O ícone verde liga e desliga cada um.'));
      }

      // Nenhum site consegue perguntar ao WhatsApp quem tem conta: isso não
      // é aberto. Então marcamos pelo formato (celular sim, fixo não) e
      // deixamos você abrir a conversa para confirmar de verdade.
      function verificarNumeros() {
        var validos = numeros.filter(function (t) { return numeroWhatsapp(t.numero); });
        if (!validos.length) {
          avisarCaixa('Nenhum número completo', 'Escreva ao menos um número com DDD para poder verificar.');
          return;
        }
        var mudou = 0;
        validos.forEach(function (t) {
          var esperado = pareceCelular(t.numero);
          t.tocado = false;
          if (t.whats !== esperado) { t.whats = esperado; mudou += 1; }
        });
        pintarNumeros();
        perguntar({
          titulo: mudou ? mudou + ' número(s) remarcado(s)' : 'Nada mudou',
          texto: 'Marcamos como WhatsApp os números de celular (11 dígitos com o 9 na frente) e ' +
            'desmarcamos os fixos. O WhatsApp não deixa nenhum site consultar quem tem conta, ' +
            'então a confirmação de verdade é abrindo a conversa.',
          ok: 'Abrir a conversa para testar', cancelar: 'Deixar assim', icone: 'alerta'
        }, function () {
          var alvo = validos.filter(function (t) { return t.whats; })[0] || validos[0];
          window.open('https://wa.me/' + numeroWhatsapp(alvo.numero), '_blank', 'noopener');
        });
      }

      pintarNumeros();

      var campoObs = entradaTexto(existente ? existente.obs : '', 'Anotação (opcional)', 200);
      forma.appendChild(campo('Observação', campoObs));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = campoNome.value.trim();
        if (!nome) { mostrarErro(forma, 'Escreva o nome do cliente.'); return; }

        var lista = numeros.filter(function (t) { return soDigitos(t.numero); })
          .map(function (t) { return { numero: soDigitos(t.numero), whats: !!t.whats, rotulo: '' }; });
        var principal = lista.length ? lista[0] : { numero: '', whats: true };

        if (existente) {
          existente.nome = nome;
          existente.telefones = lista;
          existente.telefone = principal.numero;
          existente.whatsapp = principal.whats;
          existente.obs = campoObs.value.trim();
        } else {
          estado.clientes.push({
            id: novoId(), nome: nome,
            telefones: lista,
            telefone: principal.numero,
            whatsapp: principal.whats,
            obs: campoObs.value.trim(),
            proximoPagamento: '',
            criadoEm: Date.now()
          });
        }
        salvar();
        fecharFolha();
        desenhar();
        avisar(existente ? 'Cliente atualizado.' : 'Cliente cadastrado.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir cliente', function () {
          var quantos = servicosDoCliente(existente.id).length + pagamentosDoCliente(existente.id).length +
            estado.parcelas.filter(function (p) { return p.clienteId === existente.id; }).length;
          perguntar({
            titulo: 'Excluir ' + existente.nome + '?',
            texto: 'Vão embora também os ' + quantos + ' registro(s) desse cliente. Não dá para desfazer.',
            ok: 'Excluir cliente', tom: 'perigo'
          }, function () {
          estado.servicos.forEach(function (s) { if (s.clienteId === existente.id) marcarExcluido('servicos', s.id); });
          estado.pagamentos.forEach(function (p) { if (p.clienteId === existente.id) marcarExcluido('pagamentos', p.id); });
          estado.parcelas.forEach(function (p) { if (p.clienteId === existente.id) marcarExcluido('parcelas', p.id); });
          marcarExcluido('clientes', existente.id);
          estado.servicos = estado.servicos.filter(function (s) { return s.clienteId !== existente.id; });
          estado.pagamentos = estado.pagamentos.filter(function (p) { return p.clienteId !== existente.id; });
          estado.parcelas = estado.parcelas.filter(function (p) { return p.clienteId !== existente.id; });
          estado.clientes = estado.clientes.filter(function (c) { return c.id !== existente.id; });
          salvar();
          fecharFolha();
          desenhar();
          avisar('Cliente excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  var abaFicha = 'servicos';

  function abrirFichaCliente(id) {
    var cliente = achar(estado.clientes, id);
    if (!cliente) return;
    abaFicha = 'servicos';
    montarFichaCliente(id);
  }

  function montarFichaCliente(id) {
    var cliente = achar(estado.clientes, id);
    if (!cliente) { fecharFolha(); return; }
    var r = resumoCliente(id);
    var atraso = atrasoDoCliente(id);

    abrirFolha(cliente.nome, function (folha) {
      var fones = telefonesDoCliente(cliente);
      if (fones.length) {
        var tel = no('p', 'linha-sub', fones.map(function (t) {
          return telefoneBonito(t.numero) + (t.whats ? '' : ' (sem WhatsApp)');
        }).join('  ·  '));
        tel.style.textAlign = 'center';
        tel.style.marginTop = '-10px';
        folha.appendChild(tel);
      }

      if (atraso.vencidas.length) {
        var faixa = no('div', 'aviso-atraso');
        faixa.style.marginTop = '14px';
        faixa.appendChild(icone('alerta'));
        var txtAtraso = no('div');
        txtAtraso.appendChild(no('div', null, atraso.vencidas.length + ' pagamento(s) em atraso'));
        txtAtraso.appendChild(no('div', 'n', emReais(atraso.total) + ' desde ' + dataBr(atraso.desde)));
        faixa.appendChild(txtAtraso);
        folha.appendChild(faixa);
      }

      var cResumo = cartao();
      var grade = no('div', 'resumo-grade');
      grade.style.marginTop = '0';
      [['Total', r.total, ''], ['Pago', r.pago, 'verde'], ['Falta', r.restante, r.restante > 0 ? 'ouro' : 'verde']].forEach(function (item) {
        var d = no('div');
        d.appendChild(no('div', 'r', item[0]));
        d.appendChild(no('div', 'v ' + item[2], emReais(item[1])));
        grade.appendChild(d);
      });
      cResumo.appendChild(grade);
      cResumo.appendChild(progresso(r.pago, r.total || 1, 'var(--verde)'));
      var proximaData = proximoVencimento(id);
      if (proximaData && r.restante > 0) {
        cResumo.appendChild(no('div', 'linha-nota',
          'Próximo pagamento previsto para ' + dataBr(proximaData) + '.'));
      }
      if (cliente.obs) cResumo.appendChild(no('div', 'linha-nota', cliente.obs));
      folha.appendChild(cResumo);

      var abas = no('div', 'aba-cliente');
      [['servicos', 'Registros'], ['parcelas', 'Parcelas'], ['pagamentos', 'Pagos']].forEach(function (a) {
        var b = botao(null, a[1], function () {
          if (abaFicha === a[0]) return;
          abaFicha = a[0];
          montarFichaCliente(id);
        });
        b.setAttribute('aria-selected', abaFicha === a[0] ? 'true' : 'false');
        abas.appendChild(b);
      });
      folha.appendChild(abas);

      var lista = cartao('liso');
      if (abaFicha === 'servicos') {
        var servicos = servicosDoCliente(id);
        if (!servicos.length) {
          lista.appendChild(estadoVazio('Nenhum registro',
            'Cadastre a venda ou o serviço e o valor combinado.'));
        } else {
          servicos.forEach(function (s) {
            var linha = botao('linha', null, function () { abrirFolhaServico(id, s.id); });
            juntar(linha,
              selo(corDeCategoria(s.tipo || 'Serviço'), (s.tipo || 'S').charAt(0).toUpperCase()),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', s.nome),
                no('div', 'linha-sub', (s.tipo || 'Serviço') + ' · ' + dataBr(s.data) + (s.obs ? ' · ' + s.obs : ''))),
              juntar(no('div', 'linha-fim'), no('div', 'linha-valor num', emReais(s.valor)))
            );
            lista.appendChild(linha);
          });
        }
      } else if (abaFicha === 'parcelas') {
        var parcelas = parcelasDoCliente(id);
        if (!parcelas.length) {
          lista.appendChild(estadoVazio('Sem parcelas combinadas',
            'Monte a previsão de pagamento para acompanhar o que vence e quando.'));
        } else {
          var hojeP = hojeTexto();
          parcelas.forEach(function (p) {
            var paga = parcelaPaga(p);
            var vencida = !paga && p.vencimento < hojeP;
            var servicoP = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
            var parcial = parcelaParcial(p);
            var jurosP = jurosDaParcela(p);
            var recebido = pagoNaParcela(p);
            // Numa parcela paga, o número em verde é o que entrou de verdade.
            // Quando ela foi coberta pela sobra de outro pagamento, não há
            // dinheiro lançado nela, então mostramos o valor combinado.
            var comDinheiro = paga && recebido > 0;
            var mostrar = paga ? (comDinheiro ? recebido : p.valor) : p.valor + jurosP;

            var sub = (paga ? 'Paga' : vencida ? 'Venceu' : 'Vence') + ' em ' +
              dataBr(paga && p.quitadaEm ? p.quitadaEm : p.vencimento);
            if (parcial) sub = 'Faltam ' + emReais(faltaNaParcela(p)) + ' · ' + sub.toLowerCase();
            if (comDinheiro && recebido !== p.valor) sub += ' · combinada em ' + emReais(p.valor);
            if (paga && !comDinheiro) sub += ' · coberta por outro pagamento';
            if (jurosP > 0) sub += ' · ' + emReais(jurosP) + ' de juros';
            if (servicoP) sub += ' · ' + servicoP.nome;

            var linha = botao('linha' + (vencida ? ' atrasada' : ''), null, function () {
              if (!paga) { abrirFolhaParcela(id, p.id); return; }
              var recibo = p.pagamentoId || pagamentoDaParcela(p);
              if (recibo) { abrirFolhaPagamento(id, recibo); return; }
              avisarCaixa('Parcela ' + p.numero + ' de ' + p.total,
                'Ela foi quitada com o que sobrou de outro pagamento, então não tem um recebimento próprio para abrir.');
            });
            juntar(linha,
              selo(paga ? '#3DDC84' : vencida ? '#FF6B6B' : parcial ? '#38BDF8' : '#E9B44C',
                paga ? '✓' : String(p.numero)),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', 'Parcela ' + p.numero + ' de ' + p.total),
                no('div', 'linha-sub', sub)),
              juntar(no('div', 'linha-fim'),
                no('div', 'linha-valor num' + (paga ? ' verde' : vencida ? ' vermelho' : ''),
                  emReais(mostrar)))
            );
            lista.appendChild(linha);
          });
        }
      } else {
        var pagamentos = pagamentosDoCliente(id);
        if (!pagamentos.length) {
          lista.appendChild(estadoVazio('Nenhum pagamento', 'Registre cada valor recebido com a data.'));
        } else {
          pagamentos.forEach(function (p) {
            var servico = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
            var linha = botao('linha', null, function () { abrirFolhaPagamento(id, p.id); });
            juntar(linha,
              selo('#34D399', '✓'),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', dataBr(p.data)),
                no('div', 'linha-sub', servico ? servico.nome : 'Pagamento' + (p.lancamentoId ? ' · lançado no caixa' : ''))),
              juntar(no('div', 'linha-fim'), no('div', 'linha-valor num verde', '+ ' + emReais(p.valor)))
            );
            lista.appendChild(linha);
          });
        }
      }
      folha.appendChild(lista);

      var acoes = no('div', 'acoes');
      if (abaFicha === 'servicos') {
        acoes.appendChild(botao('btn btn-ouro', '+ Nova venda ou serviço', function () { abrirFolhaServico(id, null); }));
      } else if (abaFicha === 'parcelas') {
        acoes.appendChild(botao('btn btn-ouro', '+ Combinar parcelas', function () { abrirFolhaParcelamento(id, ''); }));
        var emAberto = parcelasDoCliente(id).filter(function (p) { return !parcelaPaga(p); });
        if (emAberto.length) {
          acoes.appendChild(botao('btn btn-perigo', 'Apagar as ' + emAberto.length + ' parcelas em aberto', function () {
            perguntar({
              titulo: 'Apagar as parcelas em aberto?',
              texto: 'Saem as ' + emAberto.length + ' parcelas que ainda não foram pagas, somando ' +
                emReais(emAberto.reduce(function (soma, p) { return soma + faltaNaParcela(p); }, 0)) +
                '. As já pagas continuam. Os registros e os pagamentos não são tocados.',
              ok: 'Apagar parcelas', tom: 'perigo'
            }, function () {
              emAberto.forEach(function (p) { marcarExcluido('parcelas', p.id); });
              var fora = {};
              emAberto.forEach(function (p) { fora[p.id] = true; });
              estado.parcelas = estado.parcelas.filter(function (p) { return !fora[p.id]; });
              salvar();
              montarFichaCliente(id);
              avisar('Parcelas apagadas.');
            });
          }));
        }
      } else {
        acoes.appendChild(botao('btn btn-ouro', '+ Registrar pagamento', function () { abrirFolhaPagamento(id, null); }));
      }

      if (r.restante > 0 && temWhatsapp(cliente)) {
        var whats = botao('btn-whats', null, function () {
          abrirWhatsapp(cliente, mensagemDeCobranca(cliente));
        });
        whats.appendChild(iconeWhatsapp());
        whats.appendChild(no('span', null, atraso.vencidas.length ? 'Cobrar pelo WhatsApp' : 'Falar no WhatsApp'));
        acoes.appendChild(whats);
      }

      acoes.appendChild(botao('btn btn-fantasma', 'Editar cliente', function () {
        empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(id); } });
        abrirFolhaCliente(id);
      }));
      folha.appendChild(acoes);
    });
  }

  // A pessoa escolhe o tipo, cria os seus, renomeia e apaga.
  function opcoesDeTipo() {
    return tiposDeRegistro().map(function (t) { return { valor: t, rotulo: t }; });
  }

  function abrirGerenciarTipos(aoTerminar) {
    abrirEscolha({
      titulo: 'Tipos de registro',
      opcoes: tiposDeRegistro().map(function (t) {
        return {
          valor: t,
          rotulo: t,
          detalhe: TIPOS_REGISTRO_BASE.indexOf(t) >= 0 ? 'de fábrica' : 'toque para renomear ou excluir'
        };
      }),
      valor: '',
      acao: { rotulo: '+ Criar tipo novo', aoTocar: function () { criarTipoRegistro(aoTerminar); } }
    }, function (escolhido) {
      if (escolhido == null) { if (aoTerminar) aoTerminar(); return; }
      if (TIPOS_REGISTRO_BASE.indexOf(escolhido) >= 0) {
        avisarCaixa('Tipo de fábrica', 'Venda, Serviço e Outros não podem ser mudados. Crie um tipo seu, se precisar.',
          function () { if (aoTerminar) aoTerminar(); });
        return;
      }
      editarTipoRegistro(escolhido, aoTerminar);
    });
  }

  function criarTipoRegistro(aoTerminar) {
    abrirFolhaTexto('Novo tipo', 'Nome do tipo', '', 'Ex.: Locação', function (nome) {
      if (tiposDeRegistro().indexOf(nome) >= 0) { avisar('Esse tipo já existe.'); return; }
      estado.tiposRegistro.push(nome);
      salvar();
      avisar('Tipo criado.');
      if (aoTerminar) aoTerminar(nome);
    }, aoTerminar);
  }

  function editarTipoRegistro(tipo, aoTerminar) {
    abrirFolhaTexto('Editar tipo', 'Nome do tipo', tipo, 'Nome do tipo', function (nome) {
      var i = estado.tiposRegistro.indexOf(tipo);
      if (i >= 0) estado.tiposRegistro[i] = nome;
      estado.servicos.forEach(function (s) { if (s.tipo === tipo) s.tipo = nome; });
      salvar();
      avisar('Tipo renomeado.');
      if (aoTerminar) aoTerminar(nome);
    }, aoTerminar, function (fecharDepois) {
      var usados = estado.servicos.filter(function (s) { return s.tipo === tipo; }).length;
      perguntar({
        titulo: 'Excluir o tipo ' + tipo + '?',
        texto: usados ? 'Os ' + usados + ' registro(s) com esse tipo passam a valer como "Outros".'
                      : 'Nenhum registro usa esse tipo hoje.',
        ok: 'Excluir tipo', tom: 'perigo'
      }, function () {
        estado.tiposRegistro = estado.tiposRegistro.filter(function (t) { return t !== tipo; });
        estado.servicos.forEach(function (s) { if (s.tipo === tipo) s.tipo = 'Outros'; });
        salvar();
        avisar('Tipo excluído.');
        fecharDepois('Outros');
      });
    });
  }

  function abrirFolhaServico(clienteId, servicoId) {

    var tipoEscolhido = existente ? (existente.tipo || 'Serviço') : 'Serviço';

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Ex.: Troca de embreagem', 60);
      forma.appendChild(campo('O que foi', campoNome));

      var campoData = entradaData(existente ? existente.data : hojeTexto());
      forma.appendChild(campo('Realizado na data', campoData));

      var campoObs = entradaTexto(existente ? existente.obs : '', 'Observação (opcional)', 200);
      forma.appendChild(campo('Observação', campoObs));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {

        if (valor <= 0) { mostrarErro(forma, 'Informe o valor combinado.'); return; }

          existente.data = campoData.value;
          existente.obs = campoObs.value.trim();
        } else {
          estado.servicos.push({
            id: novoServicoId, clienteId: clienteId, nome: nome, tipo: campoTipo.value,
            valor: valor, data: campoData.value, obs: campoObs.value.trim(), criadoEm: Date.now()
          });

        salvar();

        if (existente) { avisar('Registro atualizado.'); return; }
        setTimeout(function () {
          perguntar({
            titulo: 'Combinar o pagamento?',

            ok: 'Combinar parcelas', cancelar: 'Agora não', icone: 'alvo'
          }, function () { abrirFolhaParcelamento(clienteId, novoServicoId); });
        }, 320);
