<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090D12">
<meta name="description" content="Controle de receitas, despesas, investimentos e metas.">
<title>Caixa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caixa">
<style>
  :root {
    --fundo: #090D12;
    --cartao: #131B24;
    --cartao-2: #18212C;
    --borda: #212C3A;
    --texto: #E6EDF5;
    --suave: #94A3B4;
    --fraco: #66768A;
    --ouro: #E9B44C;
    --ouro-2: #C2913A;
    --verde: #34D399;
    --vermelho: #F87171;
    --azul: #60A5FA;
    --roxo: #A78BFA;
    --rosa: #F472B6;
    --ciano: #22D3EE;
    --raio: 16px;
    --baixo: env(safe-area-inset-bottom, 0px);
    --alto: env(safe-area-inset-top, 0px);
    --nav: 62px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  input, select { -webkit-appearance: none; appearance: none; }

  .oculto { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Estrutura ---------- */

  .tela { display: none; padding: 0 16px; }
  .tela.ativa { display: block; }

  main { padding-bottom: calc(var(--nav) + var(--baixo) + 92px); }

  .cabecalho {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: calc(14px + var(--alto)) 0 14px;
  }
  .cabecalho h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .cabecalho .sub { font-size: 13px; color: var(--suave); margin-top: 2px; }

  .mes-seletor {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 999px;
    padding: 3px;
    flex: 0 0 auto;
  }
  .mes-seletor button {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: var(--suave);
    font-size: 17px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .mes-seletor button:active { background: var(--cartao-2); }
  .mes-seletor .rotulo {
    font-size: 13px;
    font-weight: 600;
    padding: 0 4px;
    min-width: 94px;
    text-align: center;
    text-transform: capitalize;
  }

  /* ---------- Cartões ---------- */

  .cartao {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    padding: 16px;
    margin-bottom: 12px;
  }
  .cartao.liso { padding: 0; overflow: hidden; }

  .cartao-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .cartao-titulo { font-size: 15px; font-weight: 600; }
  .cartao-acao { font-size: 13px; color: var(--ouro); font-weight: 600; }

  .rotulo {
    font-size: 12px;
    color: var(--suave);
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 600;
  }

  .valorao { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0; }
  .valorao.pequeno { font-size: 26px; }

  .variacao { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .variacao.sobe { color: var(--verde); }
  .variacao.desce { color: var(--vermelho); }
  .variacao .resto { color: var(--fraco); font-weight: 500; }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpi {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 12px 10px;
  }
  .kpi .rotulo { font-size: 11px; letter-spacing: .04em; }
  .kpi .n { font-size: 14.5px; font-weight: 700; margin: 5px 0 4px; }
  .kpi .variacao { font-size: 12px; }

  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---------- Gráficos ---------- */

  .grafico { width: 100%; display: block; }
  .grafico-eixo { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--fraco); }

  .rosca-caixa { position: relative; width: 168px; margin: 4px auto 12px; }
  .rosca-centro {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    pointer-events: none;
  }
  .rosca-centro .t { font-size: 11px; color: var(--suave); }
  .rosca-centro .v { font-size: 17px; font-weight: 700; }

  .legenda { display: flex; flex-direction: column; gap: 9px; }
  .legenda-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .legenda-item .bolinha { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .legenda-item .nome { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legenda-item .pct { color: var(--suave); font-size: 12.5px; }
  .legenda-item .val { font-size: 12.5px; color: var(--suave); }

  /* ---------- Barras e progresso ---------- */

  .trilho { height: 7px; border-radius: 999px; background: #1E2833; overflow: hidden; }
  .trilho i { display: block; height: 100%; border-radius: 999px; transition: width .3s ease; }

  .barra-dupla { display: flex; height: 9px; border-radius: 999px; overflow: hidden; background: #1E2833; }
  .barra-dupla i { display: block; height: 100%; }

  /* ---------- Listas ---------- */

  .linha {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 13px 16px;
    text-align: left;
    border-top: 1px solid var(--borda);
  }
  .linha:first-child { border-top: 0; }
  .linha:active { background: var(--cartao-2); }

  .selo {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 700;
  }

  .linha-texto { flex: 1 1 auto; min-width: 0; }
  .linha-titulo { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-sub { font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-fim { flex: 0 0 auto; text-align: right; }
  .linha-valor { font-size: 15px; font-weight: 700; }
  .linha-nota { font-size: 12px; color: var(--fraco); }

  .verde { color: var(--verde); }
  .vermelho { color: var(--vermelho); }
  .ouro { color: var(--ouro); }
  .suave { color: var(--suave); }

  .dia-cabecalho {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 16px 4px 8px;
  }
  .dia-nome { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--suave); }
  .dia-total { font-size: 12.5px; font-weight: 600; color: var(--fraco); }

  .vazio { padding: 32px 18px; text-align: center; color: var(--suave); font-size: 14px; }
  .vazio strong { display: block; color: var(--texto); font-size: 15.5px; margin-bottom: 5px; }

  /* ---------- Segmentos e chips ---------- */

  .segmentos {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 999px;
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .segmentos::-webkit-scrollbar { display: none; }
  .segmentos button {
    flex: 1 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--suave);
    white-space: nowrap;
  }
  .segmentos button[aria-selected="true"] { background: var(--ouro); color: #17202A; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 13px;
    border-radius: 999px;
    background: var(--cartao-2);
    border: 1px solid var(--borda);
    font-size: 13.5px;
    color: var(--texto);
  }
  .chip[aria-pressed="true"] { background: var(--ouro); border-color: var(--ouro); color: #17202A; font-weight: 600; }

  /* ---------- Busca ---------- */

  .busca {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 0 12px;
    margin-bottom: 12px;
  }
  .busca input { flex: 1; border: 0; background: none; outline: none; padding: 12px 0; font-size: 14.5px; }
  .busca .lupa { color: var(--fraco); font-size: 15px; }

  /* ---------- Navegação ---------- */

  nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: calc(var(--nav) + var(--baixo));
    padding-bottom: var(--baixo);
    display: flex;
    background: rgba(11,16,22,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--borda);
    z-index: 40;
  }
  nav button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--fraco);
    font-size: 10.5px;
    font-weight: 600;
  }
  nav button svg { width: 21px; height: 21px; }
  nav button[aria-selected="true"] { color: var(--ouro); }

  .fab {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--nav) + var(--baixo) + 16px);
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(160deg, #F0C367, var(--ouro-2));
    color: #17202A;
    font-size: 30px;
    font-weight: 300;
    line-height: 1;
    display: grid;
    place-items: center;
    box-shadow: 0 10px 26px rgba(0,0,0,.55), 0 0 0 5px var(--fundo);
    z-index: 41;
  }
  .fab:active { transform: translateX(-50%) scale(.94); }

  /* ---------- Folhas ---------- */

  .cortina {
    position: fixed;
    inset: 0;
    background: rgba(4,7,10,.72);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 50;
  }
  .cortina.aberta { opacity: 1; pointer-events: auto; }

  .folha {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #0F151C;
    border-top: 1px solid var(--borda);
    border-radius: 22px 22px 0 0;
    padding: 8px 16px calc(22px + var(--baixo));
    transform: translateY(101%);
    transition: transform .27s cubic-bezier(.32,.72,0,1);
    z-index: 51;
  }
  .folha.aberta { transform: translateY(0); }

  .puxador { width: 38px; height: 4px; border-radius: 999px; background: #2B3846; margin: 6px auto 14px; }
  .folha-titulo { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 16px; }

  .campo { margin-bottom: 14px; }
  .campo > label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin-bottom: 7px; }

  .entrada {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--borda);
    border-radius: 12px;
    background: var(--cartao);
    outline: none;
    font-size: 15px;
  }
  .entrada:focus { border-color: var(--ouro); }
  select.entrada { background-image: linear-gradient(45deg, transparent 50%, var(--suave) 50%), linear-gradient(135deg, var(--suave) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
  input[type="date"].entrada { min-height: 47px; }
  ::placeholder { color: var(--fraco); }

  .valor-grande {
    width: 100%;
    padding: 6px 0 12px;
    border: 0;
    border-bottom: 2px solid var(--borda);
    border-radius: 0;
    background: none;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -.02em;
    text-align: center;
    outline: none;
  }
  .valor-grande:focus { border-bottom-color: currentColor; }
  .forma[data-tipo="saida"] .valor-grande { color: var(--vermelho); }
  .forma[data-tipo="entrada"] .valor-grande { color: var(--verde); }
  .forma[data-tipo="transferencia"] .valor-grande { color: var(--azul); }

  .acoes { display: flex; flex-direction: column; gap: 9px; margin-top: 20px; }

  .btn {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    font-size: 15.5px;
    font-weight: 700;
    text-align: center;
  }
  .btn-ouro { background: var(--ouro); color: #17202A; }
  .btn-fantasma { background: var(--cartao); border: 1px solid var(--borda); color: var(--texto); }
  .btn-perigo { background: transparent; color: var(--vermelho); font-size: 14.5px; padding: 12px; }
  .btn-perigo:active { background: rgba(248,113,113,.1); }
  .btn:disabled { opacity: .45; }

  .erro { color: var(--vermelho); font-size: 13px; text-align: center; margin-top: 4px; }

  /* ---------- Insights ---------- */

  .insight {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .insight-topo { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 13.5px; font-weight: 700; }
  .insight-topo .pino { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; }
  .insight p { margin: 0; font-size: 13.5px; color: var(--suave); line-height: 1.5; }
  .insight .destaque { margin-top: 9px; font-size: 13.5px; font-weight: 700; }

  /* ---------- Aviso e toque ---------- */

  .aviso {
    position: fixed;
    left: 12px; right: 12px;
    top: calc(10px + var(--alto));
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--cartao-2);
    border: 1px solid var(--borda);
    color: var(--texto);
    border-radius: 13px;
    box-shadow: 0 12px 30px rgba(0,0,0,.6);
    z-index: 70;
    font-size: 14px;
  }
  .aviso span { flex: 1; }
  .aviso button { padding: 8px 13px; border-radius: 999px; background: var(--ouro); color: #17202A; font-size: 13.5px; font-weight: 700; }

  .toque {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--nav) + var(--baixo) + 84px);
    max-width: calc(100% - 32px);
    padding: 11px 18px;
    background: #212C3A;
    border: 1px solid #2E3B4B;
    border-radius: 999px;
    font-size: 14px;
    box-shadow: 0 10px 26px rgba(0,0,0,.5);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .toque.visivel { opacity: 1; }

  /* ---------- Relatório ---------- */

  #relatorio {
    position: fixed;
    inset: 0;
    background: var(--fundo);
    z-index: 90;
    overflow-y: auto;
    display: none;
  }
  #relatorio.aberto { display: block; }
  .rel-barra {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: calc(12px + var(--alto)) 16px 12px;
    background: rgba(9,13,18,.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--borda);
  }
  .rel-barra button { font-size: 14px; font-weight: 600; color: var(--ouro); }
  .rel-folha { padding: 18px 16px 40px; max-width: 720px; margin: 0 auto; }
  .rel-folha h1 { font-size: 22px; margin: 0 0 4px; }
  .rel-folha .rel-sub { color: var(--suave); font-size: 13px; margin-bottom: 20px; }
  .rel-folha h2 { font-size: 15px; margin: 24px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--borda); }
  .rel-tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rel-tabela th { text-align: left; color: var(--suave); font-weight: 600; padding: 7px 6px; border-bottom: 1px solid var(--borda); font-size: 12px; }
  .rel-tabela td { padding: 8px 6px; border-bottom: 1px solid #1A232E; }
  .rel-tabela td.n, .rel-tabela th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .rel-par { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1A232E; font-size: 14px; }
  .rel-par .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rel-nota { font-size: 12px; color: var(--fraco); margin-top: 18px; line-height: 1.6; }

  @media print {
    :root { --fundo: #fff; --texto: #111; --suave: #555; --fraco: #777; --borda: #ccc; }
    body { background: #fff; color: #111; }
    body > *:not(#relatorio) { display: none !important; }
    #relatorio { position: static; display: block; background: #fff; color: #111; overflow: visible; }
    .rel-barra { display: none; }
    .rel-folha { padding: 0; max-width: none; }
    .rel-tabela td { border-bottom: 1px solid #ddd; }
    .verde { color: #0A7A4B; }
    .vermelho { color: #B02A20; }
  }

  @media (min-width: 640px) {
    .tela, .rel-folha { max-width: 620px; margin-left: auto; margin-right: auto; }
    nav { max-width: 620px; left: 50%; transform: translateX(-50%); border-radius: 18px 18px 0 0; border-left: 1px solid var(--borda); border-right: 1px solid var(--borda); }
  }
</style>
</head>
<body>

<main>
  <section class="tela ativa" id="telaInicio"></section>
  <section class="tela" id="telaTransacoes"></section>
  <section class="tela" id="telaInvestimentos"></section>
  <section class="tela" id="telaPlanejamento"></section>
  <section class="tela" id="telaMais"></section>
</main>

<button class="fab" id="fab" aria-label="Novo lançamento">+</button>

<nav id="navegacao" role="tablist"></nav>

<div class="cortina" id="cortina"></div>
<section class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="folhaTitulo"></section>

<div id="relatorio">
  <div class="rel-barra">
    <button id="relFechar">‹ Voltar</button>
    <button id="relImprimir">Salvar em PDF</button>
  </div>
  <div class="rel-folha" id="relConteudo"></div>
</div>

<div class="toque" id="toque" role="status" aria-live="polite"></div>
<input type="file" id="arquivoRestaurar" accept="application/json,.json" class="oculto">

<script>
(function () {
  'use strict';

  var VERSAO = '2.0.0';
  var CHAVE = 'caixa.dados.v2';
  var CHAVE_ANTIGA = 'caixa.lancamentos.v1';

  var CATEGORIAS = {
    saida: ['Moradia', 'Transporte', 'Combustível', 'Alimentação', 'Mercado', 'Casa', 'Manutenção',
            'Peças', 'Ferramentas', 'Saúde', 'Educação', 'Lazer', 'Assinaturas', 'Impostos',
            'Investimentos', 'Outros'],
    entrada: ['Salário', 'Uber', 'Oficina', 'Freela', 'Venda', 'Rendimentos', 'Outros']
  };

  var CLASSES_ATIVO = ['Renda Fixa', 'Ações', 'FIIs', 'Exterior', 'Cripto', 'Outros'];

  var TIPOS_CONTA = ['Conta corrente', 'Poupança', 'Dinheiro físico', 'Corretora', 'Cartão de crédito'];

  var CORES = ['#E9B44C', '#60A5FA', '#22D3EE', '#F472B6', '#A78BFA', '#34D399', '#F87171', '#FB923C'];

  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
               'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var MESES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var DIAS_SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira',
                     'quinta-feira', 'sexta-feira', 'sábado'];

  // Palavras que sugerem categoria a partir da descrição.
  var PISTAS = [
    ['Transporte', ['uber', '99', 'taxi', 'táxi', 'onibus', 'ônibus', 'metro', 'metrô', 'passagem', 'estacionamento', 'pedagio', 'pedágio']],
    ['Combustível', ['posto', 'gasolina', 'etanol', 'alcool', 'álcool', 'diesel', 'combustivel', 'combustível', 'abastec', 'shell', 'ipiranga', 'petrobras']],

  var $ = function (id) { return document.getElementById(id); };

  var moeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var moedaCurta = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

  function emReais(centavos) { return moeda.format((centavos || 0) / 100); }

  function emReaisCurto(centavos) {
    var v = (centavos || 0) / 100;
    var abs = Math.abs(v);
    if (abs >= 1000000) return (v / 1000000).toFixed(1).replace('.', ',') + 'mi';
    if (abs >= 1000) return Math.round(v / 1000) + 'k';
    return moedaCurta.format(v);
  }

  function pct(parte, total) { return total > 0 ? (parte / total) * 100 : 0; }

  function comSinal(centavos) { return (centavos > 0 ? '+' : centavos < 0 ? '−' : '') + emReais(Math.abs(centavos)); }

  // ---------- Datas em texto AAAA-MM-DD, sem fuso ----------

  function textoDeData(ano, mesIndice, dia) {
    return String(ano) + '-' + String(mesIndice + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
  }

  function deData(d) { return textoDeData(d.getFullYear(), d.getMonth(), d.getDate()); }

  function hojeTexto() { return deData(new Date()); }

  function partes(texto) {
    var p = String(texto).split('-');
    return { ano: +p[0], mes: +p[1] - 1, dia: +p[2] };
  }

  function comoData(texto) { var p = partes(texto); return new Date(p.ano, p.mes, p.dia); }

  function somaDias(texto, n) {
    var p = partes(texto);
    return deData(new Date(p.ano, p.mes, p.dia + n));
  }

  function nomeDoDia(texto) {
    var hoje = hojeTexto();
    if (texto === hoje) return 'Hoje';
    if (texto === somaDias(hoje, -1)) return 'Ontem';
    var p = partes(texto);
    var semana = DIAS_SEMANA[comoData(texto).getDay()].replace('-feira', '');
    return semana.charAt(0).toUpperCase() + semana.slice(1) + ', ' + p.dia + ' de ' + MESES[p.mes];
  }

  function dataCurta(texto) {
    var p = partes(texto);
    return String(p.dia).padStart(2, '0') + ' ' + MESES_CURTO[p.mes];
  }

  function dataBr(texto) {
    var p = partes(texto);
    return String(p.dia).padStart(2, '0') + '/' + String(p.mes + 1).padStart(2, '0') + '/' + p.ano;
  }

  function prefixoMes(ano, mes) { return String(ano) + '-' + String(mes + 1).padStart(2, '0'); }

  function ultimoDiaDoMes(ano, mes) { return deData(new Date(ano, mes + 1, 0)); }

  // ---------- Estado ----------

  var estado = null;

  function estadoPadrao() {
    return {
      versao: 2,
      perfil: { nome: '', reservaMeses: 6, idadeAtual: 30, idadeAposentadoria: 60, aporteMensal: 0, rendimentoAnual: 8 },
      contas: [],
      lancamentos: [],
      ativos: [],
      metas: [],
      orcamentos: { geral: 0, categorias: {} }
    };

  function novoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function inteiro(v) { return typeof v === 'number' && isFinite(v) ? Math.round(v) : 0; }

  function texto(v) { return typeof v === 'string' ? v : ''; }

  function ehData(v) { return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v); }

  function limparEstado(bruto) {
    var limpo = estadoPadrao();
    if (!bruto || typeof bruto !== 'object') return limpo;

    if (bruto.perfil && typeof bruto.perfil === 'object') {
      limpo.perfil.nome = texto(bruto.perfil.nome).slice(0, 40);
      limpo.perfil.reservaMeses = Math.min(Math.max(inteiro(bruto.perfil.reservaMeses) || 6, 1), 24);
      limpo.perfil.idadeAtual = Math.min(Math.max(inteiro(bruto.perfil.idadeAtual) || 30, 14), 100);
      limpo.perfil.idadeAposentadoria = Math.min(Math.max(inteiro(bruto.perfil.idadeAposentadoria) || 60, 15), 110);
      limpo.perfil.aporteMensal = Math.max(inteiro(bruto.perfil.aporteMensal), 0);
      var rend = Number(bruto.perfil.rendimentoAnual);
      limpo.perfil.rendimentoAnual = isFinite(rend) ? Math.min(Math.max(rend, 0), 60) : 8;
    }

    if (Array.isArray(bruto.contas)) {
      limpo.contas = bruto.contas.filter(function (c) {
        return c && typeof c === 'object' && typeof c.id === 'string' && texto(c.nome);
      }).map(function (c) {
        return {
          id: c.id,
          nome: texto(c.nome).slice(0, 40),
          tipo: TIPOS_CONTA.indexOf(c.tipo) >= 0 ? c.tipo : 'Conta corrente',
          saldoInicial: inteiro(c.saldoInicial),
          cor: CORES.indexOf(c.cor) >= 0 ? c.cor : CORES[0]
        };
      });
    }

    if (Array.isArray(bruto.lancamentos)) {
      limpo.lancamentos = bruto.lancamentos.filter(function (l) {
        return l && typeof l === 'object' && typeof l.id === 'string' &&
          ['entrada', 'saida', 'transferencia'].indexOf(l.tipo) >= 0 &&
          inteiro(l.valor) > 0 && ehData(l.data);
      }).map(function (l) {
        return {
          id: l.id,
          tipo: l.tipo,
          valor: inteiro(l.valor),
          descricao: texto(l.descricao).slice(0, 80),
          categoria: texto(l.categoria) || 'Outros',
          data: l.data,
          contaId: texto(l.contaId),
          contaDestinoId: texto(l.contaDestinoId),
          criadoEm: inteiro(l.criadoEm) || Date.now()
        };
      });
    }

    if (Array.isArray(bruto.ativos)) {
      limpo.ativos = bruto.ativos.filter(function (a) {
        return a && typeof a === 'object' && typeof a.id === 'string' && texto(a.nome);
      }).map(function (a) {
        var historico = Array.isArray(a.historico) ? a.historico.filter(function (p) {
          return p && ehData(p.data) && inteiro(p.valor) >= 0;
        }).map(function (p) {
          return { data: p.data, valor: inteiro(p.valor) };
        }).sort(function (x, y) { return x.data < y.data ? -1 : 1; }) : [];
        return {
          id: a.id,
          nome: texto(a.nome).slice(0, 50),
          classe: CLASSES_ATIVO.indexOf(a.classe) >= 0 ? a.classe : 'Outros',
          aplicado: Math.max(inteiro(a.aplicado), 0),
          historico: historico.length ? historico : [{ data: hojeTexto(), valor: Math.max(inteiro(a.aplicado), 0) }]
        };
      });
    }

    if (Array.isArray(bruto.metas)) {
      limpo.metas = bruto.metas.filter(function (m) {
        return m && typeof m === 'object' && typeof m.id === 'string' && texto(m.nome) && inteiro(m.alvo) > 0;
      }).map(function (m) {
        return {
          id: m.id,
          nome: texto(m.nome).slice(0, 50),
          alvo: inteiro(m.alvo),
          guardado: Math.max(inteiro(m.guardado), 0),
          prazo: ehData(m.prazo) ? m.prazo : ''
        };
      });
    }

    if (bruto.orcamentos && typeof bruto.orcamentos === 'object') {
      limpo.orcamentos.geral = Math.max(inteiro(bruto.orcamentos.geral), 0);
      var cats = bruto.orcamentos.categorias;
      if (cats && typeof cats === 'object') {
        CATEGORIAS.saida.forEach(function (c) {
          var v = Math.max(inteiro(cats[c]), 0);
          if (v > 0) limpo.orcamentos.categorias[c] = v;
        });
      }
    }

    return limpo;
  }

  function migrarDaV1() {
    var bruto;
    try { bruto = JSON.parse(localStorage.getItem(CHAVE_ANTIGA) || 'null'); } catch (e) { return null; }
    if (!Array.isArray(bruto) || !bruto.length) return null;

    var carteira = { id: novoId(), nome: 'Carteira', tipo: 'Dinheiro físico', saldoInicial: 0, cor: CORES[0] };
    var novo = estadoPadrao();
    novo.contas = [carteira];
    novo.lancamentos = bruto.map(function (l) {
      return {
        id: typeof l.id === 'string' ? l.id : novoId(),
        tipo: l.tipo === 'entrada' ? 'entrada' : 'saida',
        valor: inteiro(l.valor),
        descricao: texto(l.descricao),
        categoria: texto(l.categoria) || 'Outros',
        data: ehData(l.data) ? l.data : hojeTexto(),
        contaId: carteira.id,
        contaDestinoId: '',
        criadoEm: inteiro(l.criadoEm) || Date.now()
      };
    });
    return limparEstado(novo);
  }

  function carregar() {
    var bruto = null;
    try { bruto = JSON.parse(localStorage.getItem(CHAVE) || 'null'); } catch (e) { bruto = null; }

    if (bruto) { estado = limparEstado(bruto); return; }

    var migrado = migrarDaV1();
    if (migrado) { estado = migrado; salvar(); return; }

    estado = estadoPadrao();
  }

  function salvar() {
    try {
      localStorage.setItem(CHAVE, JSON.stringify(estado));
    } catch (e) {
      avisar('Não foi possível salvar. Armazenamento cheio?');
    }
  }

  function achar(lista, id) {
    for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i];
    return null;
  }

  function contaPadrao() {
    if (!estado.contas.length) {
      estado.contas.push({ id: novoId(), nome: 'Carteira', tipo: 'Dinheiro físico', saldoInicial: 0, cor: CORES[0] });
      salvar();
    }
    return estado.contas[0];
  }

  // ---------- Cálculos ----------

  function saldoConta(id, ate) {
    var c = achar(estado.contas, id);
    if (!c) return 0;
    var s = c.saldoInicial;
    estado.lancamentos.forEach(function (l) {
      if (ate && l.data > ate) return;
      if (l.tipo === 'entrada' && l.contaId === id) s += l.valor;
      else if (l.tipo === 'saida' && l.contaId === id) s -= l.valor;
      else if (l.tipo === 'transferencia') {
        if (l.contaId === id) s -= l.valor;
        if (l.contaDestinoId === id) s += l.valor;
      }
    });
    return s;
  }

  function totalEmContas(ate) {
    var s = 0;
    estado.contas.forEach(function (c) { s += c.saldoInicial; });
    estado.lancamentos.forEach(function (l) {
      if (ate && l.data > ate) return;
      if (l.tipo === 'entrada') s += l.valor;
      else if (l.tipo === 'saida') s -= l.valor;
    });
    return s;
  }

  function valorAtivoEm(ativo, ate) {
    var valor = 0;
    var achou = false;
    for (var i = 0; i < ativo.historico.length; i++) {
      if (!ate || ativo.historico[i].data <= ate) { valor = ativo.historico[i].valor; achou = true; }
    }
    return achou ? valor : 0;
  }

  function valorAtivo(ativo) { return valorAtivoEm(ativo, null); }

  function totalInvestido(ate) {
    var s = 0;
    estado.ativos.forEach(function (a) { s += valorAtivoEm(a, ate); });
    return s;
  }

  function totalAplicado() {
    var s = 0;
    estado.ativos.forEach(function (a) { s += a.aplicado; });
    return s;
  }

  function patrimonio(ate) { return totalEmContas(ate) + totalInvestido(ate); }

  function lancamentosDoMes(ano, mes) {
    var pre = prefixoMes(ano, mes);
    return estado.lancamentos.filter(function (l) { return l.data.indexOf(pre) === 0; });
  }

  function totaisDoMes(ano, mes) {
    var entradas = 0, saidas = 0;
    lancamentosDoMes(ano, mes).forEach(function (l) {
      if (l.tipo === 'entrada') entradas += l.valor;
      else if (l.tipo === 'saida') saidas += l.valor;
    });
    return { entradas: entradas, saidas: saidas, saldo: entradas - saidas };
  }

  function gastosPorCategoria(ano, mes) {
    var mapa = {};
    var total = 0;
    lancamentosDoMes(ano, mes).forEach(function (l) {
      if (l.tipo !== 'saida') return;
      mapa[l.categoria] = (mapa[l.categoria] || 0) + l.valor;
      total += l.valor;
    });
    var lista = Object.keys(mapa).map(function (nome) {
      return { nome: nome, valor: mapa[nome] };
    }).sort(function (a, b) { return b.valor - a.valor; });
    return { lista: lista, total: total };
  }

  function alocacaoPorClasse() {
    var mapa = {};
    var total = 0;
    estado.ativos.forEach(function (a) {
      var v = valorAtivo(a);
      mapa[a.classe] = (mapa[a.classe] || 0) + v;
      total += v;
    });
    var lista = Object.keys(mapa).map(function (nome) {
      return { nome: nome, valor: mapa[nome] };
    }).sort(function (a, b) { return b.valor - a.valor; });
    return { lista: lista, total: total };
  }

  function mediaDespesas(meses) {
    var hoje = new Date();
    var soma = 0, contados = 0;
    for (var i = 1; i <= meses; i++) {
      var d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
      var t = totaisDoMes(d.getFullYear(), d.getMonth());
      if (t.entradas > 0 || t.saidas > 0) { soma += t.saidas; contados++; }
    }
    if (!contados) {
      var atual = totaisDoMes(hoje.getFullYear(), hoje.getMonth());
      return atual.saidas;
    }
    return Math.round(soma / contados);
  }

  function seriePatrimonio(dias) {
    var pontos = [];
    var fim = hojeTexto();
    for (var i = dias - 1; i >= 0; i--) {
      var d = somaDias(fim, -i);
      pontos.push({ data: d, valor: patrimonio(d) });
    }
    return pontos;
  }

  function serieInvestimentos(dias) {
    var pontos = [];
    var fim = hojeTexto();
    for (var i = dias - 1; i >= 0; i--) {
      var d = somaDias(fim, -i);
      pontos.push({ data: d, valor: totalInvestido(d) });
    }
    return pontos;
  }

  // ---------- Construção de elementos ----------

  function no(tag, classe, conteudo) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (conteudo != null) e.textContent = conteudo;
    return e;
  }

  function juntar(pai) {
    for (var i = 1; i < arguments.length; i++) {
      var f = arguments[i];
      if (f) pai.appendChild(f);
    }
    return pai;
  }

  function botao(classe, conteudo, aoClicar) {

    return b;

  function svgNo(nome, atributos) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', nome);
    Object.keys(atributos || {}).forEach(function (k) { e.setAttribute(k, atributos[k]); });
    return e;
  }

  var contadorId = 0;
  function idUnico() { contadorId += 1; return 'g' + contadorId; }

  // ---------- Gráfico de área ----------

  function graficoArea(pontos, cor) {
    var L = 320, A = 132, base = 108, topo = 12;
    var svg = svgNo('svg', {
      'class': 'grafico', viewBox: '0 0 ' + L + ' ' + A,
      preserveAspectRatio: 'none', role: 'img', height: '132'
    });
    svg.style.height = 'auto';

    if (pontos.length < 2) {
      svg.setAttribute('aria-label', 'Sem dados suficientes para o gráfico');
      return svg;
    }

    var valores = pontos.map(function (p) { return p.valor; });
    var min = Math.min.apply(null, valores);
    var max = Math.max.apply(null, valores);
    if (max === min) { max = min + 1; }
    var faixa = max - min;
    min -= faixa * 0.12;
    max += faixa * 0.12;

    function x(i) { return (i / (pontos.length - 1)) * L; }
    function y(v) { return base - ((v - min) / (max - min)) * (base - topo); }

    // Linhas de grade
    for (var g = 0; g <= 3; g++) {
      var yy = topo + ((base - topo) / 3) * g;
      svg.appendChild(svgNo('line', {
        x1: 0, y1: yy, x2: L, y2: yy,
        stroke: '#1B2531', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke'
      }));
    }

    var d = '';
    pontos.forEach(function (p, i) { d += (i ? 'L' : 'M') + x(i).toFixed(2) + ' ' + y(p.valor).toFixed(2) + ' '; });

    var idGrad = idUnico();
    var defs = svgNo('defs', {});
    var grad = svgNo('linearGradient', { id: idGrad, x1: '0', y1: '0', x2: '0', y2: '1' });
    var p1 = svgNo('stop', { offset: '0%', 'stop-color': cor, 'stop-opacity': '.34' });
    var p2 = svgNo('stop', { offset: '100%', 'stop-color': cor, 'stop-opacity': '0' });
    juntar(grad, p1, p2);
    defs.appendChild(grad);
    svg.appendChild(defs);

    svg.appendChild(svgNo('path', {
      d: d + 'L' + L + ' ' + base + ' L0 ' + base + ' Z',
      fill: 'url(#' + idGrad + ')'
    }));

    svg.appendChild(svgNo('path', {
      d: d, fill: 'none', stroke: cor, 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      'vector-effect': 'non-scaling-stroke'
    }));

    var ultimo = pontos[pontos.length - 1];
    svg.appendChild(svgNo('circle', {
      cx: x(pontos.length - 1) - 1, cy: y(ultimo.valor), r: 3.5,
      fill: cor, stroke: '#090D12', 'stroke-width': 2
    }));

    svg.setAttribute('aria-label',
      'Evolução de ' + emReais(pontos[0].valor) + ' em ' + dataCurta(pontos[0].data) +
      ' até ' + emReais(ultimo.valor) + ' hoje');

    return svg;
  }

  function blocoGrafico(pontos, cor) {
    var caixa = no('div');
    caixa.appendChild(graficoArea(pontos, cor));
    if (pontos.length >= 2) {
      var eixo = no('div', 'grafico-eixo');
      var passo = Math.max(1, Math.floor((pontos.length - 1) / 4));
      for (var i = 0; i < pontos.length - 1; i += passo) {
        eixo.appendChild(no('span', null, dataCurta(pontos[i].data)));
      }
      eixo.appendChild(no('span', null, 'Hoje'));
      caixa.appendChild(eixo);
    }
    return caixa;
  }

  // ---------- Rosca ----------

  function rosca(segmentos, total, rotuloCentro) {
    var caixa = no('div', 'rosca-caixa');
    var raio = 56, largura = 20, centro = 70, circ = 2 * Math.PI * raio;

    var svg = svgNo('svg', { viewBox: '0 0 140 140', width: '168', height: '168', role: 'img' });
    svg.appendChild(svgNo('circle', {
      cx: centro, cy: centro, r: raio, fill: 'none',
      stroke: '#1B2531', 'stroke-width': largura
    }));

    var acumulado = 0;
    segmentos.forEach(function (s, i) {
      if (!s.valor || total <= 0) return;
      var fatia = (s.valor / total) * circ;
      var arco = svgNo('circle', {
        cx: centro, cy: centro, r: raio, fill: 'none',
        stroke: s.cor || CORES[i % CORES.length],
        'stroke-width': largura,
        'stroke-dasharray': Math.max(fatia - 2, 0.5) + ' ' + (circ - Math.max(fatia - 2, 0.5)),
        'stroke-dashoffset': -acumulado,
        'stroke-linecap': 'butt',
        transform: 'rotate(-90 ' + centro + ' ' + centro + ')'
      });
      svg.appendChild(arco);
      acumulado += fatia;
    });

    svg.setAttribute('aria-label', segmentos.map(function (s) {
      return s.nome + ' ' + Math.round(pct(s.valor, total)) + '%';
    }).join(', ') || 'Sem dados');

    caixa.appendChild(svg);

    var meio = no('div', 'rosca-centro');
    juntar(meio, no('div', 't', rotuloCentro || 'Total'), no('div', 'v', emReais(total)));
    caixa.appendChild(meio);

    return caixa;
  }

  function legenda(segmentos, total) {
    var lista = no('div', 'legenda');
    segmentos.forEach(function (s, i) {
      var item = no('div', 'legenda-item');
      var bolinha = no('i', 'bolinha');
      bolinha.style.background = s.cor || CORES[i % CORES.length];
      juntar(item,
        bolinha,
        no('span', 'nome', s.nome),
        no('span', 'val', emReais(s.valor)),
        no('span', 'pct', Math.round(pct(s.valor, total)) + '%')
      );
      lista.appendChild(item);
    });
    return lista;
  }

  function comCores(lista) {
    return lista.map(function (item, i) {
      return { nome: item.nome, valor: item.valor, cor: CORES[i % CORES.length] };
    });
  }

  // ---------- Peças reutilizáveis ----------

  function cartao(classeExtra) {
    return no('div', 'cartao' + (classeExtra ? ' ' + classeExtra : ''));
  }

  function topoDeCartao(titulo, textoAcao, aoClicar) {
    var topo = no('div', 'cartao-topo');
    topo.appendChild(no('div', 'cartao-titulo', titulo));
    if (textoAcao) topo.appendChild(botao('cartao-acao', textoAcao, aoClicar));
    return topo;
  }

  function variacao(atual, anterior) {
    var el = no('div', 'variacao');
    if (!anterior) {
      el.className = 'variacao';
      el.appendChild(no('span', 'resto', 'sem base de comparação'));
      return el;
    }
    var dif = atual - anterior;
    var p = (dif / Math.abs(anterior)) * 100;
    el.className = 'variacao ' + (dif >= 0 ? 'sobe' : 'desce');
    el.appendChild(no('span', null, (dif >= 0 ? '↑ ' : '↓ ') + Math.abs(p).toFixed(1).replace('.', ',') + '%'));
    el.appendChild(no('span', 'resto', '(' + comSinal(dif) + ')'));
    return el;
  }

  function progresso(feito, alvo, cor) {
    var t = no('div', 'trilho');
    var i = no('i');
    i.style.width = Math.min(100, pct(feito, alvo)).toFixed(1) + '%';
    i.style.background = cor || 'var(--ouro)';
    t.appendChild(i);
    return t;
  }

  function segmentos(opcoes, ativo, aoTrocar) {
    var caixa = no('div', 'segmentos');
    caixa.setAttribute('role', 'tablist');
    opcoes.forEach(function (op) {
      var b = botao(null, op.rotulo, function () { aoTrocar(op.valor); });
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', op.valor === ativo ? 'true' : 'false');
      caixa.appendChild(b);
    });
    return caixa;
  }

  function estadoVazio(titulo, detalhe) {
    var v = no('div', 'vazio');
    v.appendChild(no('strong', null, titulo));
    v.appendChild(document.createTextNode(detalhe));
    return v;
  }

  function selo(cor, letra) {
    var s = no('div', 'selo', letra);
    s.style.background = cor + '22';
    s.style.color = cor;
    return s;
  }

  // ---------- Estado da interface ----------

  var agora = new Date();
  var mesAtivo = { ano: agora.getFullYear(), mes: agora.getMonth() };
  var telaAtiva = 'inicio';
  var filtroTransacoes = 'todas';
  var buscaTransacoes = '';
  var abaInvestimentos = 'alocacao';

  var TELAS = [
    { id: 'inicio', rotulo: 'Início', icone: 'M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5' },
    { id: 'transacoes', rotulo: 'Transações', icone: 'M4 8h13l-3-3M20 16H7l3 3' },
    { id: 'investimentos', rotulo: 'Investir', icone: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
    { id: 'planejamento', rotulo: 'Planejar', icone: 'M4 5h16v16H4zM4 10h16M9 3v4M15 3v4' },
    { id: 'mais', rotulo: 'Mais', icone: 'M5 12h.01M12 12h.01M19 12h.01' }
  ];

  function desenharNavegacao() {
    var nav = $('navegacao');
    nav.textContent = '';
    TELAS.forEach(function (t) {
      var b = botao(null, null, function () { irPara(t.id); });
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', telaAtiva === t.id ? 'true' : 'false');

      var svg = svgNo('svg', { viewBox: '0 0 24 24', fill: 'none' });
      svg.appendChild(svgNo('path', {
        d: t.icone, stroke: 'currentColor', 'stroke-width': 1.8,
        'stroke-linecap': 'round', 'stroke-linejoin': 'round'
      }));
      b.appendChild(svg);
      b.appendChild(no('span', null, t.rotulo));
      nav.appendChild(b);
    });
  }

  function irPara(id) {
    telaAtiva = id;
    ['inicio', 'transacoes', 'investimentos', 'planejamento', 'mais'].forEach(function (t) {
      var el = $('tela' + t.charAt(0).toUpperCase() + t.slice(1));
      el.classList.toggle('ativa', t === id);
    });
    window.scrollTo(0, 0);
    desenhar();
  }

  function cabecalho(titulo, subtitulo, comMes) {
    var c = no('div', 'cabecalho');
    var esquerda = no('div');
    esquerda.appendChild(no('h1', null, titulo));
    if (subtitulo) esquerda.appendChild(no('div', 'sub', subtitulo));
    c.appendChild(esquerda);

    if (comMes) {
      var sel = no('div', 'mes-seletor');
      var anterior = botao(null, '‹', function () { mudarMes(-1); });
      anterior.setAttribute('aria-label', 'Mês anterior');
      var rotulo = no('div', 'rotulo', MESES[mesAtivo.mes] + ' ' + mesAtivo.ano);
      var proximo = botao(null, '›', function () { mudarMes(1); });
      proximo.setAttribute('aria-label', 'Mês seguinte');
      juntar(sel, anterior, rotulo, proximo);
      c.appendChild(sel);
    }
    return c;
  }

  function mudarMes(passo) {
    var d = new Date(mesAtivo.ano, mesAtivo.mes + passo, 1);
    mesAtivo = { ano: d.getFullYear(), mes: d.getMonth() };
    desenhar();
  }

  function saudacao() {
    var h = new Date().getHours();
    if (h < 12) return 'Bom dia';
    if (h < 18) return 'Boa tarde';
    return 'Boa noite';
  }

  function mesAnteriorAo(ano, mes) {
    var d = new Date(ano, mes - 1, 1);
    return { ano: d.getFullYear(), mes: d.getMonth() };
  }

  // ---------- Tela: Início ----------

  function desenharInicio() {
    var tela = $('telaInicio');
    tela.textContent = '';

    var nome = estado.perfil.nome;
    var hoje = new Date();
    var diaTexto = DIAS_SEMANA[hoje.getDay()].replace('-feira', '');
    diaTexto = diaTexto.charAt(0).toUpperCase() + diaTexto.slice(1);

    tela.appendChild(cabecalho(
      saudacao() + (nome ? ', ' + nome : ''),
      diaTexto + ', ' + hoje.getDate() + ' de ' + MESES[hoje.getMonth()],
      false
    ));

    // Patrimônio
    var cPat = cartao();
    cPat.appendChild(no('div', 'rotulo', 'Patrimônio líquido'));
    cPat.appendChild(no('div', 'valorao num', emReais(patrimonio(null))));

    var fimMesPassado = ultimoDiaDoMes(mesAnteriorAo(hoje.getFullYear(), hoje.getMonth()).ano,
                                       mesAnteriorAo(hoje.getFullYear(), hoje.getMonth()).mes);
    cPat.appendChild(variacao(patrimonio(null), patrimonio(fimMesPassado)));
    cPat.appendChild(blocoGrafico(seriePatrimonio(30), '#E9B44C'));
    tela.appendChild(cPat);

    // KPIs do mês
    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);
    var ant = mesAnteriorAo(mesAtivo.ano, mesAtivo.mes);
    var tAnt = totaisDoMes(ant.ano, ant.mes);

    var kpis = no('div', 'kpis');
    kpis.appendChild(blocoKpi('Receitas', t.entradas, tAnt.entradas, 'verde'));
    kpis.appendChild(blocoKpi('Despesas', t.saidas, tAnt.saidas, 'vermelho'));
    kpis.appendChild(blocoKpi('Investido', totalInvestido(null), totalInvestido(fimMesPassado), 'ouro'));
    tela.appendChild(kpis);

    // Fluxo de caixa
    var cFluxo = cartao();
    cFluxo.appendChild(topoDeCartao('Fluxo de caixa', 'Ver todas', function () { irPara('transacoes'); }));
    cFluxo.appendChild(no('div', 'valorao pequeno num ' + (t.saldo >= 0 ? 'verde' : 'vermelho'), emReais(t.saldo)));
    cFluxo.appendChild(no('div', 'linha-nota', 'líquido em ' + MESES[mesAtivo.mes]));

    var barra = no('div', 'barra-dupla');
    barra.style.marginTop = '14px';
    var soma = t.entradas + t.saidas;
    var iE = no('i'); iE.style.width = pct(t.entradas, soma) + '%'; iE.style.background = 'var(--verde)';
    var iS = no('i'); iS.style.width = pct(t.saidas, soma) + '%'; iS.style.background = 'var(--vermelho)';
    juntar(barra, iE, iS);
    cFluxo.appendChild(barra);

    var duas = no('div', 'duas');
    duas.style.marginTop = '12px';
    duas.appendChild(parDeValores('Entradas', emReais(t.entradas), 'verde'));
    var dir = parDeValores('Saídas', emReais(t.saidas), 'vermelho');
    dir.style.textAlign = 'right';
    duas.appendChild(dir);
    cFluxo.appendChild(duas);
    tela.appendChild(cFluxo);

    // Distribuição de gastos
    var gastos = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);
    var cGastos = cartao();
    cGastos.appendChild(topoDeCartao('Distribuição de gastos', 'Relatório', function () { abrirRelatorio('fluxo'); }));
    if (!gastos.total) {
      cGastos.appendChild(estadoVazio('Sem gastos em ' + MESES[mesAtivo.mes], 'Os lançamentos de saída aparecem aqui divididos por categoria.'));
    } else {
      var seg = comCores(gastos.lista.slice(0, 6));
      var outros = gastos.lista.slice(6).reduce(function (s, c) { return s + c.valor; }, 0);
      if (outros > 0) seg.push({ nome: 'Demais', valor: outros, cor: '#4B5A6B' });
      cGastos.appendChild(rosca(seg, gastos.total, 'Gastos'));
      cGastos.appendChild(legenda(seg, gastos.total));
    }
    tela.appendChild(cGastos);

    // Contas
    var cContas = cartao('liso');
    var topoContas = topoDeCartao('Contas', '+ Nova', function () { abrirFolhaConta(null); });
    topoContas.style.padding = '16px 16px 0';
    topoContas.style.marginBottom = '8px';
    cContas.appendChild(topoContas);

    if (!estado.contas.length) {
      cContas.appendChild(estadoVazio('Nenhuma conta', 'Cadastre suas contas para acompanhar o saldo de cada uma.'));
    } else {
      estado.contas.forEach(function (c) {
        var linha = botao('linha', null, function () { abrirFolhaConta(c.id); });
        var s = saldoConta(c.id, null);
        juntar(linha,
          selo(c.cor, c.nome.charAt(0).toUpperCase()),
          juntar(no('div', 'linha-texto'),
            no('div', 'linha-titulo', c.nome),
            no('div', 'linha-sub', c.tipo)),
          juntar(no('div', 'linha-fim'),
            no('div', 'linha-valor num' + (s < 0 ? ' vermelho' : ''), emReais(s)))
        );
        cContas.appendChild(linha);
      });
      var totalLinha = no('div', 'linha');
      totalLinha.style.background = 'var(--cartao-2)';
      juntar(totalLinha,
        juntar(no('div', 'linha-texto'), no('div', 'linha-titulo suave', 'Total em contas')),
        juntar(no('div', 'linha-fim'), no('div', 'linha-valor num', emReais(totalEmContas(null))))
      );
      cContas.appendChild(totalLinha);
    }
    tela.appendChild(cContas);
  }

  function blocoKpi(rotulo, valor, anterior, classeCor) {
    var k = no('div', 'kpi');
    k.appendChild(no('div', 'rotulo', rotulo));
    k.appendChild(no('div', 'n num ' + classeCor, emReais(valor)));
    if (anterior) {
      var dif = valor - anterior;
      var p = (dif / Math.abs(anterior)) * 100;
      var v = no('div', 'variacao ' + (dif >= 0 ? 'sobe' : 'desce'),
        (dif >= 0 ? '↑ ' : '↓ ') + Math.abs(p).toFixed(1).replace('.', ',') + '%');
      k.appendChild(v);
    } else {
      k.appendChild(no('div', 'variacao', ' '));
    }
    return k;
  }

  function parDeValores(rotulo, valor, classeCor) {
    var d = no('div');
    d.appendChild(no('div', 'rotulo', rotulo));
    d.appendChild(no('div', 'linha-valor num ' + (classeCor || ''), valor));
    return d;
  }

  // ---------- Tela: Transações ----------

  function desenharTransacoes() {
    var tela = $('telaTransacoes');
    tela.textContent = '';
    tela.appendChild(cabecalho('Transações', null, true));

    var busca = no('div', 'busca');
    busca.appendChild(no('span', 'lupa', '⌕'));
    var campo = no('input');
    campo.type = 'search';
    campo.placeholder = 'Buscar por descrição ou categoria';
    campo.value = buscaTransacoes;
    campo.addEventListener('input', function () {
      buscaTransacoes = campo.value;
      desenharListaTransacoes();
    });
    busca.appendChild(campo);
    tela.appendChild(busca);

    tela.appendChild(segmentos([
      { valor: 'todas', rotulo: 'Todas' },
      { valor: 'entrada', rotulo: 'Receitas' },
      { valor: 'saida', rotulo: 'Despesas' },
      { valor: 'transferencia', rotulo: 'Transferências' }
    ], filtroTransacoes, function (v) { filtroTransacoes = v; desenharTransacoes(); }));

    var container = no('div');
    container.id = 'listaTransacoes';
    tela.appendChild(container);
    desenharListaTransacoes();
  }

  function desenharListaTransacoes() {
    var alvo = $('listaTransacoes');
    if (!alvo) return;
    alvo.textContent = '';

    var termo = buscaTransacoes.trim().toLowerCase();
    var itens = lancamentosDoMes(mesAtivo.ano, mesAtivo.mes).filter(function (l) {
      if (filtroTransacoes !== 'todas' && l.tipo !== filtroTransacoes) return false;
      if (!termo) return true;
      return (l.descricao + ' ' + l.categoria).toLowerCase().indexOf(termo) >= 0;
    });

    if (!itens.length) {
      var c = cartao('liso');
      c.appendChild(estadoVazio(
        termo ? 'Nada encontrado' : 'Nenhum lançamento',
        termo ? 'Tente outro termo de busca.' : 'Toque no + para registrar o primeiro movimento de ' + MESES[mesAtivo.mes] + '.'
      ));
      alvo.appendChild(c);
      return;
    }

    var porDia = {};
    itens.forEach(function (l) { (porDia[l.data] = porDia[l.data] || []).push(l); });

    Object.keys(porDia).sort().reverse().forEach(function (data) {
      var doDia = porDia[data].slice().sort(function (a, b) { return (b.criadoEm || 0) - (a.criadoEm || 0); });
      var totalDia = doDia.reduce(function (s, l) {
        return s + (l.tipo === 'entrada' ? l.valor : l.tipo === 'saida' ? -l.valor : 0);
      }, 0);

      var cab = no('div', 'dia-cabecalho');
      juntar(cab, no('div', 'dia-nome', nomeDoDia(data)), no('div', 'dia-total num', comSinal(totalDia)));
      alvo.appendChild(cab);

      var cartaoDia = cartao('liso');
      doDia.forEach(function (l) { cartaoDia.appendChild(linhaLancamento(l)); });
      alvo.appendChild(cartaoDia);
    });

    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);
    var resumo = cartao();
    resumo.style.marginTop = '16px';
    var linhaResumo = no('div', 'cartao-topo');
    linhaResumo.style.marginBottom = '0';
    juntar(linhaResumo,
      no('div', 'cartao-titulo', 'Saldo do período'),
      no('div', 'linha-valor num ' + (t.saldo >= 0 ? 'verde' : 'vermelho'), emReais(t.saldo))
    );
    resumo.appendChild(linhaResumo);
    alvo.appendChild(resumo);
  }

  function linhaLancamento(l) {
    var b = botao('linha', null, function () { abrirFolhaLancamento(l.id); });
    var cor = l.tipo === 'entrada' ? '#34D399' : l.tipo === 'saida' ? '#F87171' : '#60A5FA';
    var sinal = l.tipo === 'entrada' ? '+' : l.tipo === 'saida' ? '−' : '⇄';

    var sub;
    if (l.tipo === 'transferencia') {
      var origem = achar(estado.contas, l.contaId);
      var destino = achar(estado.contas, l.contaDestinoId);
      sub = (origem ? origem.nome : '—') + ' → ' + (destino ? destino.nome : '—');
    } else {
      var conta = achar(estado.contas, l.contaId);
      sub = l.categoria + (conta ? ' · ' + conta.nome : '');
    }

    juntar(b,
      selo(cor, sinal),
      juntar(no('div', 'linha-texto'),
        no('div', 'linha-titulo', l.descricao || (l.tipo === 'transferencia' ? 'Transferência' : l.categoria)),
        no('div', 'linha-sub', sub)),
      juntar(no('div', 'linha-fim'),
        no('div', 'linha-valor num ' + (l.tipo === 'entrada' ? 'verde' : l.tipo === 'saida' ? 'vermelho' : ''),
          (l.tipo === 'entrada' ? '+ ' : l.tipo === 'saida' ? '− ' : '') + emReais(l.valor)))
    );
    return b;
  }

  // ---------- Tela: Investimentos ----------

  function desenharInvestimentos() {
    var tela = $('telaInvestimentos');
    tela.textContent = '';
    tela.appendChild(cabecalho('Investimentos', null, false));

    var total = totalInvestido(null);
    var aplicado = totalAplicado();

    var cTotal = cartao();
    var topo = no('div', 'cartao-topo');
    juntar(topo, no('div', 'rotulo', 'Total investido'),
      botao('cartao-acao', '+ Novo ativo', function () { abrirFolhaAtivo(null); }));
    cTotal.appendChild(topo);
    cTotal.appendChild(no('div', 'valorao num', emReais(total)));

    if (aplicado > 0) {
      var lucro = total - aplicado;
      var v = no('div', 'variacao ' + (lucro >= 0 ? 'sobe' : 'desce'));
      v.appendChild(no('span', null, (lucro >= 0 ? '↑ ' : '↓ ') +
        Math.abs((lucro / aplicado) * 100).toFixed(2).replace('.', ',') + '%'));
      v.appendChild(no('span', 'resto', '(' + comSinal(lucro) + ' sobre ' + emReais(aplicado) + ')'));
      cTotal.appendChild(v);
    }
    cTotal.appendChild(blocoGrafico(serieInvestimentos(30), '#E9B44C'));
    tela.appendChild(cTotal);

    if (!estado.ativos.length) {
      var vazio = cartao('liso');
      vazio.appendChild(estadoVazio('Nenhum ativo cadastrado',
        'Cadastre o que você tem investido para acompanhar rentabilidade e alocação.'));
      var b = botao('btn btn-ouro', 'Cadastrar primeiro ativo', function () { abrirFolhaAtivo(null); });
      b.style.margin = '0 16px 18px';
      b.style.width = 'calc(100% - 32px)';
      vazio.appendChild(b);
      tela.appendChild(vazio);
      return;
    }

    tela.appendChild(segmentos([
      { valor: 'alocacao', rotulo: 'Alocação' },
      { valor: 'ativos', rotulo: 'Ativos' },
      { valor: 'rentabilidade', rotulo: 'Rentabilidade' }
    ], abaInvestimentos, function (v) { abaInvestimentos = v; desenharInvestimentos(); }));

    if (abaInvestimentos === 'alocacao') {
      var aloc = alocacaoPorClasse();
      var c = cartao();
      c.appendChild(no('div', 'cartao-titulo', 'Alocação por classe'));
      var seg = comCores(aloc.lista);
      c.appendChild(rosca(seg, aloc.total, 'Carteira'));
      c.appendChild(legenda(seg, aloc.total));
      tela.appendChild(c);
    } else if (abaInvestimentos === 'ativos') {
      var lista = cartao('liso');
      estado.ativos.slice().sort(function (a, b) { return valorAtivo(b) - valorAtivo(a); }).forEach(function (a) {
        var atual = valorAtivo(a);
        var rend = a.aplicado > 0 ? ((atual - a.aplicado) / a.aplicado) * 100 : 0;
        var linha = botao('linha', null, function () { abrirFolhaAtivo(a.id); });
        juntar(linha,
          selo(CORES[CLASSES_ATIVO.indexOf(a.classe) % CORES.length], a.nome.charAt(0).toUpperCase()),
          juntar(no('div', 'linha-texto'),
            no('div', 'linha-titulo', a.nome),
            no('div', 'linha-sub', a.classe)),
          juntar(no('div', 'linha-fim'),
            no('div', 'linha-valor num', emReais(atual)),
            no('div', 'linha-nota num ' + (rend >= 0 ? 'verde' : 'vermelho'),
              (rend >= 0 ? '↑ ' : '↓ ') + Math.abs(rend).toFixed(2).replace('.', ',') + '%'))
        );
        lista.appendChild(linha);
      });
      tela.appendChild(lista);
    } else {
      var cR = cartao();
      cR.appendChild(no('div', 'cartao-titulo', 'Rentabilidade da carteira'));
      var lucroTotal = total - aplicado;
      cR.appendChild(no('div', 'valorao pequeno num ' + (lucroTotal >= 0 ? 'verde' : 'vermelho'), comSinal(lucroTotal)));
      cR.appendChild(no('div', 'linha-nota',
        aplicado > 0
          ? 'sobre ' + emReais(aplicado) + ' aplicados (' +
            ((lucroTotal / aplicado) * 100).toFixed(2).replace('.', ',') + '%)'
          : 'informe o valor aplicado nos ativos para calcular'));

      var tabela = no('div');
      tabela.style.marginTop = '14px';
      estado.ativos.slice().sort(function (a, b) {
        var ra = a.aplicado > 0 ? (valorAtivo(a) - a.aplicado) / a.aplicado : 0;
        var rb = b.aplicado > 0 ? (valorAtivo(b) - b.aplicado) / b.aplicado : 0;
        return rb - ra;
      }).forEach(function (a) {
        var atual = valorAtivo(a);
        var lucro = atual - a.aplicado;
        var rend = a.aplicado > 0 ? (lucro / a.aplicado) * 100 : 0;
        var item = no('div', 'legenda-item');
        item.style.padding = '9px 0';
        item.style.borderTop = '1px solid var(--borda)';
        juntar(item,
          no('span', 'nome', a.nome),
          no('span', 'val num ' + (lucro >= 0 ? 'verde' : 'vermelho'), comSinal(lucro)),
          no('span', 'pct num', (rend >= 0 ? '+' : '−') + Math.abs(rend).toFixed(1).replace('.', ',') + '%')
        );
        tabela.appendChild(item);
      });
      cR.appendChild(tabela);
      tela.appendChild(cR);
    }
  }

  // ---------- Tela: Planejamento ----------

  function desenharPlanejamento() {

  // ---------- Análises calculadas ----------

  function normalizar(descricao) {
    return descricao.toLowerCase().replace(/\d+/g, '').replace(/[^a-zà-ú ]/gi, '').trim();
  }

  // Só categorias em que faz sentido sugerir corte: aluguel e imposto não se cancela.
  var CANCELAVEIS = ['Assinaturas', 'Lazer', 'Educação', 'Alimentação', 'Outros'];

  function assinaturasProvaveis() {
    var grupos = {};
    estado.lancamentos.forEach(function (l) {
      if (l.tipo !== 'saida' || !l.descricao) return;
      if (CANCELAVEIS.indexOf(l.categoria) < 0) return;
      var chave = normalizar(l.descricao) + '|' + l.valor;
      if (!chave.trim()) return;
      (grupos[chave] = grupos[chave] || []).push(l);
    });

    var achados = [];
    Object.keys(grupos).forEach(function (chave) {
      var itens = grupos[chave];
      var meses = {};
      itens.forEach(function (l) { meses[l.data.slice(0, 7)] = true; });
      if (Object.keys(meses).length >= 2) {
        achados.push({ descricao: itens[0].descricao, valor: itens[0].valor, vezes: Object.keys(meses).length });
      }
    });
    return achados.sort(function (a, b) { return b.valor - a.valor; });
  }

  function gerarAnalises() {
    var lista = [];
    var ant = mesAnteriorAo(mesAtivo.ano, mesAtivo.mes);
    var atual = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);
    var anterior = gastosPorCategoria(ant.ano, ant.mes);
    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);

    var mapaAnterior = {};
    anterior.lista.forEach(function (c) { mapaAnterior[c.nome] = c.valor; });

    // Maior queda e maior alta por categoria
    var quedas = [], altas = [];
    atual.lista.forEach(function (c) {
      var base = mapaAnterior[c.nome];
      if (!base) return;
      var dif = c.valor - base;
      var p = (dif / base) * 100;
      if (p <= -8) quedas.push({ nome: c.nome, p: p, dif: dif });
      if (p >= 8) altas.push({ nome: c.nome, p: p, dif: dif });
    });
    quedas.sort(function (a, b) { return a.p - b.p; });
    altas.sort(function (a, b) { return b.p - a.p; });

    if (quedas.length) {
      var q = quedas[0];
      lista.push({
        tom: 'bom', pino: '↓', cor: 'var(--verde)', titulo: 'Boa!',
        texto: 'Seus gastos com ' + q.nome.toLowerCase() + ' caíram ' +
          Math.abs(q.p).toFixed(0) + '% em ' + MESES[mesAtivo.mes] + ' comparado ao mês anterior.',
        destaque: 'Economia de ' + emReais(-q.dif), destaqueCor: 'var(--verde)'
      });
    }

    if (altas.length) {
      var a = altas[0];
      lista.push({
        tom: 'atencao', pino: '!', cor: 'var(--ouro)', titulo: 'Atenção',
        texto: 'Seus gastos com ' + a.nome.toLowerCase() + ' subiram ' +
          a.p.toFixed(0) + '% em relação ao mês anterior.',
        destaque: 'Aumento de ' + emReais(a.dif), destaqueCor: 'var(--vermelho)'
      });
    }

    var assinaturas = assinaturasProvaveis();
    if (assinaturas.length) {
      var somaAss = assinaturas.reduce(function (s, x) { return s + x.valor; }, 0);
      lista.push({
        tom: 'oportunidade', pino: '◇', cor: 'var(--roxo)', titulo: 'Oportunidade',
        texto: 'Encontramos ' + assinaturas.length + ' cobrança(s) que se repetem todo mês: ' +
          assinaturas.slice(0, 4).map(function (x) { return x.descricao; }).join(', ') +
          '. Cancelar o que você não usa libera esse valor.',
        destaque: 'Até ' + emReais(somaAss) + ' por mês', destaqueCor: 'var(--roxo)'
      });
    }

    if (t.entradas > 0) {
      var taxa = ((t.entradas - t.saidas) / t.entradas) * 100;
      lista.push({
        tom: taxa >= 20 ? 'bom' : 'atencao',
        pino: '%', cor: taxa >= 20 ? 'var(--verde)' : 'var(--ouro)',
        titulo: taxa >= 20 ? 'Boa taxa de poupança' : 'Sobra apertada',
        texto: 'Você guardou ' + taxa.toFixed(0) + '% do que entrou em ' + MESES[mesAtivo.mes] +
          '. ' + (taxa >= 20 ? 'Acima dos 20% que costumam ser recomendados.' : 'O caminho comum é buscar pelo menos 20%.'),
        destaque: comSinal(t.saldo), destaqueCor: t.saldo >= 0 ? 'var(--verde)' : 'var(--vermelho)'
      });
    }

    estado.metas.forEach(function (m) {
      var p = pct(m.guardado, m.alvo);
      if (p >= 50) {
        lista.push({
          tom: 'meta', pino: '◎', cor: 'var(--azul)', titulo: 'Meta em dia',
          texto: 'Sua meta ' + m.nome + ' está ' + Math.round(p) + '% completa. Faltam ' +
            emReais(Math.max(0, m.alvo - m.guardado)) + '.',
          destaque: null
        });
      }
    });

    if (atual.total > 0) {
      var maior = atual.lista[0];
      lista.push({
        tom: 'info', pino: '★', cor: 'var(--ciano)', titulo: 'Maior gasto do mês',
        texto: maior.nome + ' concentrou ' + Math.round(pct(maior.valor, atual.total)) +
          '% das suas saídas, somando ' + emReais(maior.valor) + '.',
        destaque: null
      });
    }

    if (!lista.length) {
      lista.push({
        tom: 'info', pino: '·', cor: 'var(--suave)', titulo: 'Ainda sem padrões',
        texto: 'Registre lançamentos por alguns meses para eu comparar períodos e apontar tendências.',
        destaque: null
      });
    }

    return lista;
  }

  // ---------- Infraestrutura das folhas ----------

  var folhaAberta = false;

  function abrirFolha(titulo, montar) {
    var folha = $('folha');
    folha.textContent = '';
    folha.appendChild(no('div', 'puxador'));

  function campo(rotulo, controle) {
    var c = no('div', 'campo');
    if (rotulo) {
      var l = no('label', null, rotulo);
      if (controle.id) l.htmlFor = controle.id;
      c.appendChild(l);
    }
    c.appendChild(controle);
    return c;

  var contadorCampo = 0;
  function proximoId() { contadorCampo += 1; return 'campo' + contadorCampo; }

  function entradaTexto(valor, placeholder, maximo) {
    var i = no('input', 'entrada');
    i.type = 'text';
    i.id = proximoId();
    i.value = valor || '';
    i.autocomplete = 'off';
    if (placeholder) i.placeholder = placeholder;
    i.maxLength = maximo || 80;
    return i;
  }

  function entradaData(valor) {
    var i = no('input', 'entrada');
    i.type = 'date';
    i.id = proximoId();
    i.value = valor || hojeTexto();
    return i;
  }

  function entradaNumero(valor, passo, minimo, maximo) {
    var i = no('input', 'entrada');
    i.type = 'number';
    i.id = proximoId();
    i.value = String(valor);
    i.step = passo || '1';
    if (minimo != null) i.min = String(minimo);
    if (maximo != null) i.max = String(maximo);
    i.inputMode = 'decimal';
    return i;
  }

  function entradaSelecao(opcoes, valor) {
    var s = no('select', 'entrada');
    s.id = proximoId();
    opcoes.forEach(function (op) {
      var o = no('option', null, op.rotulo);
      o.value = op.valor;
      if (op.valor === valor) o.selected = true;
      s.appendChild(o);
    });
    return s;
  }

  function digitosParaCentavos(str) {
    var d = String(str).replace(/\D/g, '').slice(0, 11);
    return d ? parseInt(d, 10) : 0;
  }

  function entradaValor(centavos, grande) {
    var i = no('input', grande ? 'valor-grande' : 'entrada');
    i.type = 'text';
    i.id = proximoId();
    i.inputMode = 'numeric';
    i.autocomplete = 'off';
    i.value = emReais(centavos || 0);

    function fim() {
      var n = i.value.length;
      if (i.selectionStart === n && i.selectionEnd === n) return;
      try { i.setSelectionRange(n, n); } catch (e) { /* alguns navegadores recusam */ }
    }

    i.addEventListener('input', function () {
      i.value = emReais(digitosParaCentavos(i.value));
      fim();
    });
    ['focus', 'click', 'select', 'keyup'].forEach(function (ev) { i.addEventListener(ev, fim); });
    return i;
  }

  function grupoChips(opcoes, selecionado, aoEscolher) {
    var caixa = no('div', 'chips');
    caixa.setAttribute('role', 'group');
    opcoes.forEach(function (op) {
      var c = botao('chip', op, function () {
        Array.prototype.forEach.call(caixa.children, function (outro) {
          outro.setAttribute('aria-pressed', outro === c ? 'true' : 'false');
        });
        aoEscolher(op);
      });
      c.setAttribute('aria-pressed', op === selecionado ? 'true' : 'false');
      caixa.appendChild(c);
    });
    return caixa;
  }

  // ---------- Sugestão de categoria ----------

  function sugerirCategoria(descricao, tipo) {
    var texto = descricao.toLowerCase().trim();
    if (!texto) return null;

    // 1) Descrição igual a algo já lançado antes
    var iguais = estado.lancamentos.filter(function (l) {
      return l.tipo === tipo && l.descricao && l.descricao.toLowerCase().trim() === texto;
    });
    if (iguais.length) return iguais[iguais.length - 1].categoria;

    // 2) Palavras conhecidas
    for (var i = 0; i < PISTAS.length; i++) {
      var categoria = PISTAS[i][0];
      if (CATEGORIAS[tipo].indexOf(categoria) < 0) continue;
      var palavras = PISTAS[i][1];
      for (var j = 0; j < palavras.length; j++) {
        if (texto.indexOf(palavras[j]) >= 0) return categoria;
      }
    }
    return null;
  }

  // ---------- Folha: lançamento ----------

  function abrirFolhaLancamento(id, rascunho) {
    var existente = id ? achar(estado.lancamentos, id) : null;
    if (id && !existente) return;

    contaPadrao();

    var dados = rascunho || (existente ? {
      tipo: existente.tipo,
      valor: existente.valor,
      descricao: existente.descricao,
      categoria: existente.categoria,
      data: existente.data,
      contaId: existente.contaId || estado.contas[0].id,
      contaDestinoId: existente.contaDestinoId || ''
    } : {
      tipo: 'saida',
      valor: 0,
      descricao: '',
      categoria: 'Outros',
      data: dataPadrao(),
      contaId: estado.contas[0].id,
      contaDestinoId: estado.contas.length > 1 ? estado.contas[1].id : ''
    });

    var categoriaTocada = rascunho ? !!rascunho.categoriaTocada : !!existente;

    abrirFolha(existente ? 'Editar lançamento' : 'Novo lançamento', function (folha) {
      var forma = no('div', 'forma');
      forma.setAttribute('data-tipo', dados.tipo);

      var tipos = segmentos([
        { valor: 'saida', rotulo: 'Saída' },
        { valor: 'entrada', rotulo: 'Entrada' },
        { valor: 'transferencia', rotulo: 'Transferência' }
      ], dados.tipo, function (v) {
        if (v === dados.tipo) return;
        var novo = coletar();
        novo.tipo = v;
        novo.categoriaTocada = categoriaTocada;
        if (v !== 'transferencia' && CATEGORIAS[v].indexOf(novo.categoria) < 0) novo.categoria = 'Outros';
        abrirFolhaLancamento(id, novo);
      });
      forma.appendChild(tipos);

      var campoValorEl = entradaValor(dados.valor, true);
      forma.appendChild(campo('Valor', campoValorEl));

      var campoDescricao = entradaTexto(dados.descricao,
        dados.tipo === 'transferencia' ? 'Ex.: Reserva para o mês' : 'Ex.: Abastecimento no posto');
      forma.appendChild(campo('Descrição', campoDescricao));

      var caixaChips = null;
      if (dados.tipo !== 'transferencia') {
        caixaChips = grupoChips(CATEGORIAS[dados.tipo], dados.categoria, function (c) {
          dados.categoria = c;
          categoriaTocada = true;
        });
        forma.appendChild(campo('Categoria', caixaChips));

        campoDescricao.addEventListener('input', function () {
          if (categoriaTocada) return;
          var sugerida = sugerirCategoria(campoDescricao.value, dados.tipo);
          if (!sugerida || sugerida === dados.categoria) return;
          dados.categoria = sugerida;
          Array.prototype.forEach.call(caixaChips.children, function (chip) {
            chip.setAttribute('aria-pressed', chip.textContent === sugerida ? 'true' : 'false');
          });
        });
      }

      var campoConta = entradaSelecao(opcoesDeConta(), dados.contaId);
      forma.appendChild(campo(dados.tipo === 'transferencia' ? 'De qual conta' : 'Conta', campoConta));

      var campoDestino = null;
      if (dados.tipo === 'transferencia') {
        campoDestino = entradaSelecao(opcoesDeConta(), dados.contaDestinoId);
        forma.appendChild(campo('Para qual conta', campoDestino));
      }

      var campoData = entradaData(dados.data);
      forma.appendChild(campo('Data', campoData));

      function coletar() {
        return {
          tipo: dados.tipo,
          valor: digitosParaCentavos(campoValorEl.value),
          descricao: campoDescricao.value,
          categoria: dados.categoria,
          data: campoData.value,
          contaId: campoConta.value,
          contaDestinoId: campoDestino ? campoDestino.value : dados.contaDestinoId
        };
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        if (valor <= 0) { mostrarErro(forma, 'Informe um valor maior que zero.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }
        if (dados.tipo === 'transferencia') {
          if (!campoDestino.value || campoDestino.value === campoConta.value) {
            mostrarErro(forma, 'Escolha duas contas diferentes para a transferência.');
            return;
          }
        }

        var registro = {
          id: existente ? existente.id : novoId(),
          tipo: dados.tipo,
          valor: valor,
          descricao: campoDescricao.value.trim(),
          categoria: dados.tipo === 'transferencia' ? 'Transferência' : dados.categoria,
          data: campoData.value,
          contaId: campoConta.value,
          contaDestinoId: dados.tipo === 'transferencia' ? campoDestino.value : '',
          criadoEm: existente ? existente.criadoEm : Date.now()
        };

        if (existente) {
          estado.lancamentos = estado.lancamentos.map(function (l) { return l.id === existente.id ? registro : l; });
        } else {
          estado.lancamentos.push(registro);
        }

        salvar();
        var p = partes(registro.data);
        mesAtivo = { ano: p.ano, mes: p.mes };
        fecharFolha();
        desenhar();
        avisar(existente ? 'Lançamento atualizado.' : 'Lançamento salvo.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir lançamento', function () {
          if (!confirm('Excluir este lançamento? Não dá para desfazer.')) return;
          estado.lancamentos = estado.lancamentos.filter(function (l) { return l.id !== existente.id; });
          salvar();
          fecharFolha();
          desenhar();
          avisar('Lançamento excluído.');
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);

      setTimeout(function () { campoValorEl.focus(); }, 270);
    });
  }

  function dataPadrao() {
    var hoje = new Date();
    if (hoje.getFullYear() === mesAtivo.ano && hoje.getMonth() === mesAtivo.mes) return hojeTexto();
    return textoDeData(mesAtivo.ano, mesAtivo.mes, 1);
  }

          existente.saldoInicial = digitosParaCentavos(campoSaldo.value);
          existente.cor = cor;
        } else {
          estado.contas.push({
            id: novoId(), nome: nome, tipo: campoTipo.value,

          });

        salvar();

      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir conta', function () {
          var usada = estado.lancamentos.filter(function (l) {
            return l.contaId === existente.id || l.contaDestinoId === existente.id;
          }).length;
          if (usada) {
            alert('Esta conta tem ' + usada + ' lançamento(s). Mova ou exclua esses lançamentos antes de apagar a conta.');

          estado.contas = estado.contas.filter(function (c) { return c.id !== existente.id; });
          salvar();
          fecharFolha();
          desenhar();
          avisar('Conta excluída.');
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
